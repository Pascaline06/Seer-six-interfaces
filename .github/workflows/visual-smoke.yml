                  if (matchingInspector) {
                    await page.locator('#main #marketDetail button[data-market-action="close-detail"]').click();
                    if (await page.locator("#main #marketDetail").count() !== 0) report.failures.push(viewport.name+"/"+theme+"/opportunity: closing the ledger inspector left stale detail visible");
                  }
                }
                const modelButton = page.locator('#main button[data-market-action="model-opportunity"]:not([disabled])').first();
                const modelCount = await page.locator('#main button[data-market-action="model-opportunity"]:not([disabled])').count();
                if (modelCount) {
                  const modelKey = await modelButton.getAttribute("data-market-id");
                  await modelButton.click();
                  const modelOpened = await page.waitForFunction((key) => {
                    const lab = document.querySelector("#opportunityLab");
                    const select = document.querySelector("#oppMarketSelect");
                    return !!lab && !!select && select.value === key;
                  }, modelKey, { timeout: 8000 }).then(() => true).catch(() => false);
                  if (!modelOpened) report.failures.push(viewport.name+"/"+theme+"/opportunity: Model did not open the Decision Lab for the exact selected market");
                } else {
                  report.warnings.push(viewport.name+"/"+theme+"/opportunity: no returned binary market was eligible for the Model action");
                }
              }

              if (route === "home" && viewport.name === "desktop" && theme === "dark") {
                const themeToggle = page.locator("#themeToggle");
                const beforeTheme = await page.locator("body").evaluate(el => el.dataset.theme || "dark");
                await themeToggle.click();
                const toggledTheme = await page.locator("body").evaluate(el => el.dataset.theme || "dark");
                if (beforeTheme !== "dark" || toggledTheme !== "light") report.failures.push("desktop/dark/home: theme toggle did not switch from dark to light");
                await themeToggle.click();
                if (await page.locator("body").evaluate(el => el.dataset.theme || "dark") !== "dark") report.failures.push("desktop/dark/home: theme toggle did not restore dark theme");
              }

              if (route === "app" && viewport.name === "desktop" && theme === "dark") {
                for (const [selector,label] of [["#marketFilter","category"],["#marketNetwork","network"],["#marketSort","sort order"]]) {
                  const control = page.locator(selector);
                  if (await control.count() !== 1) {
                    report.failures.push("desktop/dark/app: Explorer "+label+" selector is missing");
                    continue;
                  }
                  const optionCount = await control.locator("option").count();
                  if (optionCount > 1) {
                    const value = await control.locator("option").nth(1).getAttribute("value");
                    await control.selectOption({index:1});
                    const persisted = await page.waitForFunction(([sel,wanted]) => {
                      const node = document.querySelector(sel);
                      return !!node && node.value === wanted;
                    }, [selector,value], {timeout:6000}).then(()=>true).catch(()=>false);
                    if (!persisted) report.failures.push("desktop/dark/app: Explorer "+label+" selection did not persist after interaction");
                    const defaultValue = await control.locator("option").nth(0).getAttribute("value");
                    await control.selectOption({index:0});
                    await page.waitForFunction(([sel,wanted]) => document.querySelector(sel)?.value === wanted, [selector,defaultValue], {timeout:6000}).catch(()=>{});
                  }
                }
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, {timeout:20000}).catch(()=>{});
              }

              if (route === "home") {
                const getApp = page.locator("#getAppButton");
                if (await getApp.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/home: Get the app CTA is missing");
                } else {
                  const destination = await getApp.getAttribute("href");
                  const target = await getApp.getAttribute("target");
                  const label = (await getApp.innerText()).replace(/\s+/g, " ").trim();
                  if (label !== "Visit Seer ↗") report.failures.push(viewport.name+"/"+theme+"/home: top-right CTA label should differ from the competitor's Open App label");
                  if (destination !== "https://app.seer.pm/" || target !== "_blank") {
                    report.failures.push(viewport.name+"/"+theme+"/home: Visit Seer CTA must open the official Seer app in a new tab");
                  } else {
                    const [popup] = await Promise.all([
                      page.context().waitForEvent("page", { timeout: 10000 }),
                      getApp.click()
                    ]).catch(() => [null]);
                    if (!popup) {
                      report.failures.push(viewport.name+"/"+theme+"/home: Get the app CTA did not open the official Seer app");
                    } else {
                      await popup.waitForLoadState("domcontentloaded", { timeout: 12000 }).catch(() => {});
                      if (!popup.url().startsWith("https://app.seer.pm/")) {
                        report.failures.push(viewport.name+"/"+theme+"/home: Get the app opened unexpected destination "+popup.url());
                      }
                      await popup.close().catch(() => {});
                    }
                  }
                }
              }

              if (route === "deep") {
                const landscapeRows = page.locator(".liquidity-landscape .landscape-row");
                const rowCount = await landscapeRows.count();
                if (metrics.marketFeedStatus === "live" && rowCount === 0) {
                  report.failures.push(viewport.name+"/"+theme+"/deep: live Deep Forecasts data did not populate the liquidity landscape");
                } else if (rowCount > 0) {
                  const reportedLabels = await page.locator(".liquidity-landscape .landscape-meta b").allInnerTexts();
                  const knownBars = page.locator(".liquidity-landscape .landscape-rail:not(.is-unreported) > i");
                  const widths = await knownBars.evaluateAll(nodes => nodes.map(node => Number.parseFloat(node.style.width)).filter(Number.isFinite));
                  if (reportedLabels.some(label => label.trim().startsWith("$")) && (!widths.length || !widths.some(width => width > 0) || Math.max(...widths) < 99.5)) {
                    report.failures.push(viewport.name+"/"+theme+"/deep: reported liquidity did not render as correctly normalized bars");
                  }
                  const unavailable = await page.locator(".liquidity-landscape .landscape-rail.is-unreported").count();
                  const unavailableLabels = reportedLabels.filter(label => label.trim() === "Not reported").length;
                  if (unavailable !== unavailableLabels) report.failures.push(viewport.name+"/"+theme+"/deep: unreported liquidity was not represented honestly");
                }
              }

              // Risk Pricing: record Inspect must resolve to the matching record inspector, and close must dismiss it.
              if (route === "risk") {
                const riskInspect = page.locator('#main .risk-market-record button[data-market-action="inspect"]').first();
                const riskInspectCount = await page.locator('#main .risk-market-record button[data-market-action="inspect"]').count();
                if (riskInspectCount > 0) {
                  const wantedTitle = (await riskInspect.locator("xpath=ancestor::article").locator("h3").innerText()).trim();
                  await riskInspect.click();
                  const matchingInspector = await page.waitForFunction((wanted) => {
                    const detail = document.querySelector("#marketDetail");
                    return !!detail && detail.querySelector("h2")?.innerText.trim() === wanted;
                  }, wantedTitle, { timeout: 8000 }).then(() => true).catch(() => false);
                  if (!matchingInspector) report.failures.push(viewport.name+"/"+theme+"/risk: Inspect record did not open the inspector for the exact market");
                  const closeRiskInspector = page.locator('#main #marketDetail button[data-market-action="close-detail"]');
                  if (matchingInspector && await closeRiskInspector.count() !== 1) {
                    report.failures.push(viewport.name+"/"+theme+"/risk: risk inspector did not expose its close action");
                  } else if (matchingInspector) {
                    await closeRiskInspector.click();
                    if (await page.locator("#main #marketDetail").count() !== 0) report.failures.push(viewport.name+"/"+theme+"/risk: closing the inspector left stale market detail visible");
                  }
                } else {
                  report.failures.push(viewport.name+"/"+theme+"/risk: market records are missing Inspect actions");
                }
                await page.locator("#riskA").evaluate(el => { el.value = "17"; el.dispatchEvent(new Event("input", { bubbles: true })); });
                await page.locator("#riskB").evaluate(el => { el.value = "82"; el.dispatchEvent(new Event("input", { bubbles: true })); });
                const riskGapText = (await page.locator("#riskGap").innerText()).trim();
                const riskALabel = (await page.locator("#riskALabel").innerText()).trim();
                const riskBLabel = (await page.locator("#riskBLabel").innerText()).trim();
                if (riskGapText !== "65 points" || riskALabel !== "17/100" || riskBLabel !== "82/100") {
                  report.failures.push(viewport.name+"/"+theme+"/risk: sensitivity sliders did not update their values and derived gap");
                }
              }

              // Futarchy: both scenario buttons, reference selector and shift slider must update the what-if output.
              if (route === "futarchy") {
                const passButton = page.locator('.futarchy-workbench .scenario-toggle button').filter({ hasText: "If proposal passes" });
                const failButton = page.locator('.futarchy-workbench .scenario-toggle button').filter({ hasText: "If proposal fails" });
                if (await passButton.count() !== 1 || await failButton.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/futarchy: pass/fail scenario controls are missing");
                } else {
                  await failButton.click();
                  if (!(await page.locator('.scenario-toggle button.primary').innerText()).includes("If proposal fails")) {
                    report.failures.push(viewport.name+"/"+theme+"/futarchy: selecting proposal failure did not update the active state");
                  }
                  await passButton.click();
                  if (!(await page.locator('.scenario-toggle button.primary').innerText()).includes("If proposal passes")) {
                    report.failures.push(viewport.name+"/"+theme+"/futarchy: selecting proposal pass did not update the active state");
                  }
                  const shift = page.locator("#scenarioDelta");
                  await shift.evaluate(el => { el.value = "12"; el.dispatchEvent(new Event("input", { bubbles: true })); });
                  if (!(await page.locator("#scenarioDeltaLabel").innerText()).includes("+12 percentage points")) {
                    report.failures.push(viewport.name+"/"+theme+"/futarchy: scenario shift slider did not update its visible label");
                  }
                  const marketSelect = page.locator("#futarchyMarketSelect");
                  if (await marketSelect.locator("option").count() > 1) {
                    await marketSelect.selectOption({ index: 1 });
                    const selectedStillRendered = await page.waitForFunction(() => {
                      const select = document.querySelector("#futarchyMarketSelect");
                      const output = document.querySelector("#futarchyScenarioValue");
                      return !!select && !!output && !!select.value;
                    }, null, { timeout: 5000 }).then(() => true).catch(() => false);
                    if (!selectedStillRendered) report.failures.push(viewport.name+"/"+theme+"/futarchy: selecting a reference market did not retain a coherent scenario");
                  }
                }
              }

              // Home calls to action and all six interface cards / navigation buttons must route to their matching interface.
              if (route === "home" && viewport.name === "desktop" && theme === "dark") {
                for (const [selector, expectedRoute, label] of [
                  ['.hero-actions button:has-text("Explore live markets")', "app", "Explore live markets"],
                  ['.hero-actions button:has-text("Explore forecasts")', "deep", "Explore forecasts"]
                ]) {
                  const cta = page.locator(selector);
                  if (await cta.count() !== 1) {
                    report.failures.push("desktop/dark/home: "+label+" CTA is missing");
                  } else {
                    await cta.click();
                    const routed = await page.waitForFunction(wanted => document.querySelector("#main")?.dataset.page === wanted, expectedRoute, { timeout: 6000 }).then(() => true).catch(() => false);
                    if (!routed) report.failures.push("desktop/dark/home: "+label+" CTA did not navigate to "+expectedRoute);
                    await page.locator('#nav button[data-page="home"]').click();
                    await page.waitForFunction(() => document.querySelector("#main")?.dataset.page === "home", null, { timeout: 6000 }).catch(() => {});
                  }
                }
                const interfaceButtons = page.locator("#main .interface-preview .interface-open");
                const interfaceButtonCount = await interfaceButtons.count();
                if (interfaceButtonCount !== 6) {
                  report.failures.push("desktop/dark/home: expected six interface preview buttons, found "+interfaceButtonCount);
                } else {
                  for (let n = 0; n < interfaceButtonCount; n++) {
                    const button = interfaceButtons.nth(n);
                    const onclick = await button.getAttribute("onclick") || "";
                    const match = onclick.match(/go\(['"]([^'"]+)['"]\)/);
                    if (!match) {
                      report.failures.push("desktop/dark/home: interface preview button "+n+" has no route target");
                      continue;
                    }
                    const expectedRoute = match[1];
                    await button.click();
                    const routed = await page.waitForFunction(wanted => document.querySelector("#main")?.dataset.page === wanted, expectedRoute, { timeout: 6000 }).then(() => true).catch(() => false);
                    if (!routed) report.failures.push("desktop/dark/home: interface preview button "+n+" did not navigate to "+expectedRoute);
                    await page.goto(base+"#/home", { waitUntil: "domcontentloaded", timeout: 45000 });
                    await page.waitForSelector("#main h1", { timeout: 15000 });
                    await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#main .hero-signal")?.dataset.marketStatus || ""), null, { timeout: 20000 }).catch(() => {});
                  }
                }
                // All six side-navigation buttons must navigate to the matching page.
                for (const target of routes) {
                  await page.locator('#nav button[data-page="'+target+'"]').click();
                  const routed = await page.waitForFunction(wanted => document.querySelector("#main")?.dataset.page === wanted, target, { timeout: 6000 }).then(() => true).catch(() => false);
                  if (!routed) report.failures.push("desktop/dark/home: sidebar navigation did not open "+target);
                }
                await page.goto(base+"#/home", { waitUntil: "domcontentloaded", timeout: 45000 });
                await page.waitForSelector("#main h1", { timeout: 15000 });
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#main .hero-signal")?.dataset.marketStatus || ""), null, { timeout: 20000 }).catch(() => {});
                for (const selector of ["#main .signal-desk-action", "#main .market-journey .journey-open"]) {
                  const ctas = page.locator(selector);
                  const count = await ctas.count();
                  for (let n = 0; n < count; n++) {
                    await ctas.nth(n).click();
                    const openedExplorer = await page.waitForFunction(() => document.querySelector("#main")?.dataset.page === "app", null, { timeout: 6000 }).then(() => true).catch(() => false);
                    if (!openedExplorer) report.failures.push("desktop/dark/home: "+selector+" did not navigate to the Market Explorer");
                    await page.locator('#nav button[data-page="home"]').click();
                    await page.waitForFunction(() => document.querySelector("#main")?.dataset.page === "home", null, { timeout: 6000 }).catch(() => {});
                  }
                }
              }

              const nextRoute = routes[(routes.indexOf(route) + 1) % routes.length];
              const nextLink = page.locator(`#siteFooter .interface-link[data-suite-page="${nextRoute}"]`);
              await nextLink.click();
              const footerNavigationWorks = await page.locator("#main").getAttribute("data-page") === nextRoute;
              if (!footerNavigationWorks) report.failures.push(`${viewport.name}/${theme}/${route}: footer link did not navigate to ${nextRoute}`);
              if (route === "risk") {
                // The footer has returned to home: assert the visible market tape is present, populated and moving.
                const homeTape = page.locator("#main .signal-ticker.market-tape");
                if (await homeTape.count() !== 1) {
                  report.failures.push(`${viewport.name}/${theme}: home Market Tape is missing after footer navigation`);
                } else {
                  const animation = await homeTape.locator(".signal-ticker-track").evaluate(el => getComputedStyle(el).animationName);
                  const items = homeTape.locator('.signal-ticker-set:not([aria-hidden="true"]) .market-tape-item');
                  const count = await items.count();
                  const avatars = await items.locator(".market-avatar").count();
                  if (animation !== "signalTickerRun") report.failures.push(`${viewport.name}/${theme}: home Market Tape stopped after route navigation`);
                  if (count < 1 || avatars !== count) report.failures.push(`${viewport.name}/${theme}: home Market Tape is missing per-market avatars`);
                }
              }
              if (metrics.marketFeedStatus !== "live") report.warnings.push(`${viewport.name}/${theme}/${route}: live API status was ${metrics.marketFeedStatus}; check CORS/API availability`);
              }
            }
            await context.close();
          }

          fs.writeFileSync("artifacts/report.json", JSON.stringify(report, null, 2));
          console.log(JSON.stringify({ testedAt: report.testedAt, checks: report.results.length, failures: report.failures, warnings: report.warnings, routes: report.results.map(({viewport, theme, route, heading, headingFontFamily, bodyFontLoaded, displayFontLoaded, monoFontLoaded, interfaceNavCount, currentFooterRoute, footerOutsideWorkspace, heroSignalCount, interfaceArtCount, explorerControlCount, explorerVisibleCardCount, explorerWatchlistButtonCount, marketPulseItemCount, signalDeskCount, signalStoryCount, marketWireVisible, marketWireItemCount, marketWireAnimation, marketWireStatus, prefersReducedMotion, explorerIndexStatus, explorerPageLabel, heroMarketStatus, horizontalOverflow, marketFeedStatus}) => ({viewport, theme, route, heading, headingFontFamily, bodyFontLoaded, displayFontLoaded, monoFontLoaded, interfaceNavCount, currentFooterRoute, footerOutsideWorkspace, heroSignalCount, interfaceArtCount, explorerControlCount, explorerVisibleCardCount, explorerWatchlistButtonCount, marketPulseItemCount, marketWireVisible, marketWireItemCount, marketWireAnimation, marketWireStatus, prefersReducedMotion, explorerIndexStatus, explorerPageLabel, heroMarketStatus, horizontalOverflow, marketFeedStatus})) }, null, 2));
          await browser.close();
          if (report.failures.length) process.exit(1);
          NODE

      - name: Upload desktop/mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seer-six-dark-light-browser-visual-check
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
