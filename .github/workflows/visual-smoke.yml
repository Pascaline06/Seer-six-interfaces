name: Seer Six browser smoke and visual capture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seer-six-visual-smoke-live-index-v2
  cancel-in-progress: true

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and detect system Chrome
        run: |
          npm install --no-save playwright
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No system Chromium/Chrome binary is available on this runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Wait for the deployed revision
        run: |
          node --input-type=module <<'NODE'
          const url = "https://pascaline06.github.io/Seer-six-interfaces/";
          const marker = 'statlabel">Opened</div>';
          for (let attempt = 1; attempt <= 18; attempt++) {
            try {
              const response = await fetch(url, { cache: "no-store" });
              const html = await response.text();
              if (response.ok && html.includes(marker) && html.includes('marketStatusList:["open","answer_not_final","in_dispute"]') && html.includes("Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800") && html.includes("DM+Sans:wght@400;500;600;700") && html.includes("JetBrains+Mono:wght@400;500;600;700") && html.includes('id="siteFooter"') && html.includes("function interfaceArt") && html.includes('id="marketNetwork"') && html.includes("Risk is multidimensional.") && html.includes("Market activity ledger") && html.includes("loadFutarchyMarkets") && html.includes('id="marketWire"') && html.includes("function renderMarketWire") && html.includes("function renderSignalDesk") && html.includes("Signal Desk / Source-backed briefing") && html.includes("signal-ticker-track") && html.includes("marketAvatarHTML(m,44)") && html.includes("market-tape") && html.includes('id="getAppButton" href="https://app.seer.pm/" target="_blank" rel="noopener noreferrer"') && html.includes('body[data-theme="light"] .signal-ticker.market-tape{background:linear-gradient') && html.includes("No repricing confirmed between snapshots.") && html.includes("function renderObservedPriceTrace") && html.includes("seer-six-price-trace-v1") && html.includes("OBSERVED PRICE TRACE") && html.includes('data-wire-action="history"') && html.includes("No repricing observed yet.") && html.includes("AUTO-REFRESH 60S") && html.includes('id="getAppButton"') && html.includes("top-app-cta") && html.includes("const reportedNumber=") && html.includes("liquidityUSD:reportedNumber(m.liquidityUSD)") && html.includes("function renderLiquidityLandscape") && html.includes("Liquidity landscape") && html.includes("landscape-rail is-unreported") && html.includes("function renderOpportunityLab") && html.includes("Price your own thesis.") && html.includes("function refreshOpportunityMarketSelection") && html.includes("data-entry-price") && html.includes("function openWireMarket") && html.includes('data-wire-action="inspect"') && html.includes(".market-wire-viewport:hover .market-wire-track") && html.includes("function renderExplorerLedger") && html.includes('data-explorer-view="table"') && html.includes("data-opportunity-field=\"belief\"")) {
                console.log(`Deployed build marker found on attempt ${attempt}; HTTP ${response.status}`);
                process.exit(0);
              }
              console.log(`Attempt ${attempt}: waiting for latest build (HTTP ${response.status})`);
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          console.error("Latest build marker was not found on the deployed site.");
          process.exit(1);
          NODE

      - name: Verify desktop/mobile, dark/light routes; capture screenshots
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const base = "https://pascaline06.github.io/Seer-six-interfaces/";
          const routes = ["home", "app", "deep", "futarchy", "opportunity", "risk"];
          const viewports = [
            { name: "desktop", width: 1440, height: 1000 },
            { name: "mobile", width: 390, height: 844 },
          ];
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN });
          const themes = ["dark", "light"];
          const report = { testedAt: new Date().toISOString(), base, results: [], failures: [], warnings: [] };

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: viewport.name === "mobile" ? 2 : 1, isMobile: viewport.name === "mobile", hasTouch: viewport.name === "mobile" });
            const page = await context.newPage();
            const pageErrors = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            await page.goto(base, { waitUntil: "domcontentloaded", timeout: 45000 });

            for (const theme of themes) {
              for (const route of routes) {
              await page.goto(base + "#/" + route, { waitUntil: "domcontentloaded", timeout: 45000 });
              await page.waitForSelector("#main h1", { timeout: 15000 });
              await page.evaluate(async (wanted) => {
                const current = document.body.dataset.theme || "dark";
                if (current !== wanted) document.getElementById("themeToggle")?.click();
                // Explicitly request the font weights used by the visual system.
                await Promise.all([
                  document.fonts.load('400 15px "DM Sans"'),
                  document.fonts.load('700 32px "Bricolage Grotesque"'),
                  document.fonts.load('400 14px "JetBrains Mono"')
                ]);
                await document.fonts.ready;
                // Smooth route transitions should not produce mid-scroll screenshots.
                window.scrollTo({ top: 0, behavior: "instant" });
              }, theme);
              await page.waitForFunction(() => window.scrollY === 0);
              pageErrors.length = 0;
              await page.waitForFunction(() => /Live Seer record|live records|Demo fallback|live endpoint unavailable|Data status\s*(Connected|Fallback)/.test(document.body.innerText), null, { timeout: 12000 }).catch(() => {});
              // Do not capture the hero or explorer while their live-data requests are still in flight.
              if (route === "home") {
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#main .hero-signal")?.dataset.marketStatus || ""), null, { timeout: 20000 }).catch(() => {});
              }
              if (route === "app") {
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, { timeout: 20000 }).catch(() => {});
              }
              await page.waitForTimeout(500);

              const metrics = await page.evaluate(() => {
                const main = document.querySelector("#main");
                const heading = main?.querySelector("h1");
                const nav = document.querySelector("#nav");
                const body = document.body;
                const root = document.documentElement;
                const font = heading ? getComputedStyle(heading).fontFamily : "";
                const active = nav?.querySelector("button.active")?.dataset.page || null;
                return {
                  title: document.title,
                  heading: heading?.innerText || null,
                  headingFontFamily: font,
                  theme: document.body.dataset.theme || "dark",
                  bodyFontLoaded: document.fonts.check('400 15px "DM Sans"'),
                  displayFontLoaded: document.fonts.check('700 32px "Bricolage Grotesque"'),
                  monoFontLoaded: document.fonts.check('400 14px "JetBrains Mono"'),
                  interfaceNavCount: document.querySelectorAll("#siteFooter a[data-suite-page]").length || 0,
                  interfaceNavTargets: [...document.querySelectorAll("#siteFooter a[data-suite-page]")].map(a => a.getAttribute("href")),
                  currentFooterRoute: document.querySelector("#siteFooter a[data-suite-page][aria-current=\"page\"]")?.dataset.suitePage || null,
                  footerOutsideWorkspace: !document.querySelector(".layout")?.contains(document.querySelector("#siteFooter")),
                  heroSignalCount: main?.querySelectorAll(".hero-signal").length || 0,
                  interfaceArtCount: main?.querySelectorAll(".interface-art svg").length || 0,
                  explorerControlCount: ["#marketSearch","#marketFilter","#marketNetwork","#marketSort"].filter(selector => document.querySelector(selector)).length,
                  explorerVisibleCardCount: main?.querySelectorAll(".explorer-market-grid .market").length || 0,
                  explorerWatchlistButtonCount: main?.querySelectorAll(".market-save[data-market-action='save']").length || 0,
                  marketPulseItemCount: main?.querySelectorAll(".market-pulse .pulse-item").length || 0,
                  signalDeskCount: main?.querySelectorAll(".signal-desk").length || 0,
                  signalStoryCount: main?.querySelectorAll(".signal-desk .signal-story").length || 0,
                  signalTickerCount: main?.querySelectorAll('.signal-ticker').length || 0,
                  signalTickerItemCount: main?.querySelectorAll('.signal-ticker-set:not([aria-hidden="true"]) .signal-ticker-item').length || 0,
                  signalTickerAnimation: getComputedStyle(main?.querySelector('.signal-ticker-track') || body).animationName,
                  marketWireVisible: !!document.querySelector("#marketWire"),
                  marketWireItemCount: document.querySelectorAll("#marketWire .market-wire-set:not([aria-hidden='true']) .wire-item").length,
                  marketWireAnimation: getComputedStyle(document.querySelector("#marketWire .market-wire-track") || body).animationName,
                  prefersReducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
                  marketWireStatus: document.querySelector("#marketWire .market-wire-head small")?.innerText || "missing",
                  explorerIndexStatus: main?.querySelector("#explorerStatus")?.dataset.status || "not-app",
                  explorerPageLabel: main?.querySelector("#pageStatus")?.innerText?.trim() || null,
                  heroMarketStatus: main?.querySelector(".hero-signal")?.dataset.marketStatus || "not-home",
                  headingAlign: heading ? getComputedStyle(heading).textAlign : "missing",
                  introAlign: main?.querySelector(".intro") ? getComputedStyle(main.querySelector(".intro")).textAlign : "missing",
                  nonLeftAlignedCopy: [...(main?.querySelectorAll(".sectionhead h2,.sectionhead p,.panel p,.evidenceitem,.crumb,.market h3,.notice") || [])].filter(el => !["left","start"].includes(getComputedStyle(el).textAlign)).map(el => ({selector:el.tagName.toLowerCase()+"."+el.className,text:(el.innerText||"").slice(0,60),align:getComputedStyle(el).textAlign})),
                  viewportWidth: window.innerWidth,
                  documentWidth: Math.max(root.scrollWidth, body.scrollWidth),
                  horizontalOverflow: Math.max(root.scrollWidth, body.scrollWidth) > window.innerWidth + 1,
                  activeRoute: active,
                  marketFeedStatus: /Live Seer record|live records|Data status\s*Connected/.test(document.body.innerText) ? "live" : /Demo fallback|live endpoint unavailable|Data status\s*Fallback/.test(document.body.innerText) ? "fallback" : "not-visible",
                  mainWidth: Math.round(main?.getBoundingClientRect().width || 0),
                  getAppButtonVisible: (() => { const el = document.querySelector("#getAppButton"); if (!el) return false; const r = el.getBoundingClientRect(); const s = getComputedStyle(el); return r.width > 0 && r.height > 0 && s.display !== "none" && s.visibility !== "hidden"; })(),
                  getAppButtonTarget: document.querySelector("#getAppButton")?.getAttribute("href") || null,
                  marketWireHasGradient: /linear-gradient/i.test(getComputedStyle(document.querySelector("#marketWire") || body).backgroundImage),
                  signalTickerHasGradient: /linear-gradient/i.test(getComputedStyle(document.querySelector("#main .signal-ticker") || body).backgroundImage),
                };
              });

              // Market Wire is hidden on home because the homepage uses the featured Market Tape instead.
              if (route !== "home") {
              // The movement log opens and closes, and its empty state must be honest on an unchanged source snapshot.
              const historyToggle = page.locator('#marketWire button[data-wire-action="history"]');
              if (await historyToggle.count() !== 1) {
                report.failures.push(viewport.name+"/"+theme+"/"+route+": observed movement-log control is missing");
              } else {
                await historyToggle.click();
                const historyPanelVisible = await page.locator("#marketWire .wire-ledger").count() === 1;
                const historyExpanded = await page.locator('#marketWire button[data-wire-action="history"]').getAttribute("aria-expanded");
                const historyHasState = await page.locator("#marketWire .wire-ledger").innerText().catch(() => "");
                if (!historyPanelVisible || historyExpanded !== "true") report.failures.push(viewport.name+"/"+theme+"/"+route+": movement log did not open accessibly");
                if (!historyHasState.includes("OBSERVED REPRICING") || (!historyHasState.includes("No repricing observed yet.") && !historyHasState.includes("pp"))) report.failures.push(viewport.name+"/"+theme+"/"+route+": movement log has neither an honest empty state nor observed price changes");
                await page.locator('#marketWire button[data-wire-action="history"]').click();
                const historyClosed = await page.locator("#marketWire .wire-ledger").count() === 0;
                const historyCollapsed = await page.locator('#marketWire button[data-wire-action="history"]').getAttribute("aria-expanded");
                if (!historyClosed || historyCollapsed !== "false") report.failures.push(viewport.name+"/"+theme+"/"+route+": movement log did not close");
              }
              }
              // The homepage market tape must show real market records, move continuously, and respect reduced motion.
              if (route === "home") {
                const briefTicker = page.locator("#main .signal-ticker.market-tape");
                if (await briefTicker.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/home: scrolling Market Tape is missing");
                } else {
                  const briefText = await briefTicker.innerText();
                  const briefAnimation = await briefTicker.locator(".signal-ticker-track").evaluate(el => getComputedStyle(el).animationName);
                  const tapeItems = briefTicker.locator(".signal-ticker-set:not([aria-hidden=\"true\"]) .market-tape-item");
                  const tapeCount = await tapeItems.count();
                  const avatarCount = await tapeItems.locator(".market-avatar").count();
                  if (briefAnimation !== "signalTickerRun") report.failures.push(viewport.name+"/"+theme+"/home: Market Tape is not moving");
                  if (!briefText.includes("MARKET TAPE") || tapeCount < 1 || avatarCount !== tapeCount) report.failures.push(viewport.name+"/"+theme+"/home: tape is missing per-market artwork or market rows");
                  if (tapeCount > 0) {
                    const firstItem = tapeItems.first();
                    if (!(await firstItem.locator(".signal-ticker-copy strong").count()) || !(await firstItem.locator(".signal-ticker-detail").innerText()).includes("VOL")) report.failures.push(viewport.name+"/"+theme+"/home: tape item is missing a market title or volume");
                  }
                  await page.emulateMedia({ reducedMotion: "reduce" });
                  const reducedAnimation = await briefTicker.locator(".signal-ticker-track").evaluate(el => getComputedStyle(el).animationName);
                  if (reducedAnimation !== "none") report.failures.push(viewport.name+"/"+theme+"/home: Market Tape ignores reduced-motion preference");
                  await page.emulateMedia({ reducedMotion: "no-preference" });
                }
              }
              // Validate Market Wire pause/resume only on routes where that strip is visible.
              if (route !== "home") {
              const wireToggle = page.locator('#marketWire button[data-wire-action="pause"]');
              if (await wireToggle.count() !== 1) {
                report.failures.push(viewport.name+"/"+theme+"/"+route+": Market Wire pause/resume control is missing");
              } else {
                await wireToggle.click();
                const pausedClass = await page.locator("#marketWire").getAttribute("class");
                const pausedPressed = await page.locator('#marketWire button[data-wire-action="pause"]').getAttribute("aria-pressed");
                if (!pausedClass?.includes("is-paused") || pausedPressed !== "true") report.failures.push(viewport.name+"/"+theme+"/"+route+": pause control did not pause the ticker");
                await page.locator('#marketWire button[data-wire-action="pause"]').click();
                const resumedClass = await page.locator("#marketWire").getAttribute("class");
                const resumedPressed = await page.locator('#marketWire button[data-wire-action="pause"]').getAttribute("aria-pressed");
                if (resumedClass?.includes("is-paused") || resumedPressed !== "false") report.failures.push(viewport.name+"/"+theme+"/"+route+": resume control did not restore ticker motion");
              }
              }
              const screenshot = `artifacts/${viewport.name}-${theme}-${route}.png`;
              await page.screenshot({ path: screenshot, fullPage: true, animations: "disabled" });
              const result = { viewport: viewport.name, theme, route, screenshot, ...metrics, pageErrors: [...pageErrors] };
              report.results.push(result);
              if (metrics.horizontalOverflow) report.failures.push(`${viewport.name}/${route}: horizontal overflow at ${metrics.viewportWidth}px (document ${metrics.documentWidth}px)`);
              if (!metrics.getAppButtonVisible || metrics.getAppButtonTarget !== "https://app.seer.pm/") report.failures.push(viewport.name+"/"+theme+"/"+route+": Get the app CTA is missing, hidden, or targets the wrong route");
              if (!metrics.marketWireHasGradient) report.failures.push(viewport.name+"/"+theme+"/"+route+": Market Wire lost its themed surface treatment");
              if (route === "home" && !metrics.signalTickerHasGradient) report.failures.push(viewport.name+"/"+theme+"/home: source briefing ticker lost its themed surface treatment");
              if (metrics.activeRoute !== route) report.failures.push(`${viewport.name}/${theme}/${route}: active navigation route was ${metrics.activeRoute}`);
              if (metrics.theme !== theme) report.failures.push(`${viewport.name}/${theme}/${route}: theme state mismatch (${metrics.theme})`);
              if (!metrics.heading) report.failures.push(`${viewport.name}/${theme}/${route}: missing page heading`);
              if (!["left","start"].includes(metrics.headingAlign) || (!["left","start"].includes(metrics.introAlign) && metrics.introAlign !== "missing") || metrics.nonLeftAlignedCopy.length) report.failures.push("Copy alignment issue on " + viewport.name + "/" + theme + "/" + route + ": " + JSON.stringify(metrics.nonLeftAlignedCopy));
              if (pageErrors.length) report.failures.push(`${viewport.name}/${theme}/${route}: browser errors: ${pageErrors.join("; ")}`);
              if (!metrics.bodyFontLoaded || !metrics.displayFontLoaded || !metrics.monoFontLoaded) report.warnings.push(`${viewport.name}/${theme}/${route}: one or more requested font families did not confirm as loaded`);
              if (!metrics.footerOutsideWorkspace) report.failures.push(viewport.name+"/"+theme+"/"+route+": footer is inside the sidebar/content workspace");
              if (route === "home" && (metrics.heroSignalCount !== 1 || metrics.interfaceArtCount !== 6)) report.failures.push(viewport.name+"/"+theme+"/home: expected hero signal artwork and six interface illustrations");
              if (route === "app" && metrics.explorerControlCount !== 4) report.failures.push(viewport.name+"/"+theme+"/app: expected search, category, network and sort controls");
              if (route === "app" && metrics.explorerIndexStatus === "live" && metrics.explorerPageLabel) {
                const pageParts = metrics.explorerPageLabel.match(/(\d+)\s*\/\s*(\d+)/);
                if (pageParts && Number(pageParts[1]) < Number(pageParts[2]) && metrics.explorerVisibleCardCount !== 12) report.failures.push(viewport.name+"/"+theme+"/app: a full live page should show 12 server-returned records, found "+metrics.explorerVisibleCardCount);
                if (metrics.explorerVisibleCardCount !== metrics.explorerWatchlistButtonCount) report.failures.push(viewport.name+"/"+theme+"/app: each market card needs its own save-to-watchlist control");
              }
              if (route === "home" && metrics.marketPulseItemCount !== 4) report.failures.push(viewport.name+"/"+theme+"/home: the market pulse must show four source records");
              if (route === "home" && metrics.signalDeskCount !== 1) report.failures.push(viewport.name+"/"+theme+"/home: the source-backed Signal Desk briefing is missing");
              if (route === "home" && metrics.signalStoryCount !== 3) report.failures.push(viewport.name+"/"+theme+"/home: the Signal Desk should contain exactly three evidence-backed story panels");
              if (!metrics.marketWireVisible) report.failures.push(viewport.name+"/"+theme+"/"+route+": the Market Wire is missing from the shared shell");
              if (!metrics.marketWireStatus.includes("AUTO-REFRESH 60S")) report.failures.push(viewport.name+"/"+theme+"/"+route+": Market Wire refresh cadence/status is missing");
              if (metrics.marketWireItemCount < 1) report.failures.push(viewport.name+"/"+theme+"/"+route+": Market Wire has no rendered snapshot items");
              if (!metrics.marketWireAnimation.includes("marketWireRun") && !metrics.prefersReducedMotion) report.failures.push(viewport.name+"/"+theme+"/"+route+": Market Wire motion is not running when motion is allowed");
              if (route === "home" && !["live","fallback"].includes(metrics.heroMarketStatus)) report.failures.push(viewport.name+"/"+theme+"/home: hero signal never left its loading state");
              if (route === "app" && !["live","fallback"].includes(metrics.explorerIndexStatus)) report.failures.push(viewport.name+"/"+theme+"/app: full-index explorer never left its loading state before screenshot");
              if (route === "app" && metrics.explorerIndexStatus === "live" && !metrics.explorerPageLabel) report.failures.push(viewport.name+"/"+theme+"/app: live results loaded without pagination state");
              if (metrics.interfaceNavCount !== 6 || metrics.interfaceNavTargets.length !== 6 || metrics.currentFooterRoute !== route) report.failures.push(`${viewport.name}/${theme}/${route}: footer must show all six directly-accessible routes with the current route marked`);
              if (route === "app") {
                await page.locator("#marketSearch").fill("Ethereum");
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, { timeout: 20000 }).catch(() => {});
                const searchMode = await page.locator("#explorerStatus").getAttribute("data-status");
                if (searchMode === "live") {
                  const pagerPresent = await page.locator("#pageStatus").count() === 1 && await page.locator("#nextMarkets").count() === 1;
                  if (!pagerPresent) report.failures.push(viewport.name+"/"+theme+"/app: live search has no pagination controls");
                  const nextButton = page.locator("#nextMarkets");
                  if (await nextButton.count() && await nextButton.isEnabled()) {
                    await nextButton.click();
                    await page.waitForFunction(() => document.querySelector("#explorerStatus")?.dataset.status === "live" && document.querySelector("#pageStatus")?.innerText.trim().startsWith("2"), null, { timeout: 20000 }).catch(() => {});
                    const pageTwo = (await page.locator("#pageStatus").innerText().catch(() => "")).trim().startsWith("2");
                    if (!pageTwo) report.failures.push(viewport.name+"/"+theme+"/app: next-page control did not advance the live index");
                  }
                } else {
                  report.warnings.push(viewport.name+"/"+theme+"/app: full-index search fell back ("+(searchMode || "no final status")+")");
                }
              }
              if (route === "app") {
                // Exercise both density modes and make sure terminal-row actions resolve the exact source record.
                const terminalToggle = page.locator('#main button[data-explorer-view="table"]');
                if (await terminalToggle.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/app: terminal-table view toggle is missing");
                } else {
                  await terminalToggle.click();
                  const terminalRows = page.locator(".explorer-ledger tbody tr");
                  const terminalCount = await terminalRows.count();
                  if (terminalCount < 1) report.failures.push(viewport.name+"/"+theme+"/app: terminal-table view rendered no market rows");
                  const terminalInspect = page.locator('.explorer-ledger button[data-market-action="inspect"]').first();
                  if (await terminalInspect.count() === 1) {
                    const terminalTitle = (await terminalInspect.locator("xpath=ancestor::tr").locator(".explorer-ledger-market strong").innerText()).trim();
                    await terminalInspect.click();
                    const terminalDetail = await page.waitForFunction((wanted) => document.querySelector("#marketDetail h2")?.innerText.trim() === wanted, terminalTitle, {timeout:10000}).then(()=>true).catch(()=>false);
                    if (!terminalDetail) report.failures.push(viewport.name+"/"+theme+"/app: terminal-row Inspect did not open the matching market record");
                    const closeTerminal = page.locator('#marketDetail button[data-market-action="close-detail"]');
                    if (await closeTerminal.count()) await closeTerminal.click();
                  } else if (terminalCount > 0) {
                    report.failures.push(viewport.name+"/"+theme+"/app: terminal rows are missing Inspect actions");
                  }
                  await page.locator("#explorerView-cards").click();
                  if (await page.locator(".explorer-market-grid .market").count() < 1) report.failures.push(viewport.name+"/"+theme+"/app: switching back from terminal table did not restore market cards");
                }
                // Exercise the actual record inspector and device-local watchlist, not just their markup.
                await page.evaluate(() => localStorage.removeItem("seer-six-watchlist-v1"));
                await page.reload({ waitUntil: "domcontentloaded" });
                await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, { timeout: 20000 }).catch(() => {});
                const inspect = page.locator('#main button[data-market-action="inspect"]').first();
                if (await inspect.count()) {
                  await inspect.click();
                  const detailVisible = await page.locator("#marketDetail").count() === 1;
                  if (!detailVisible) report.failures.push(viewport.name+"/"+theme+"/app: Inspect record did not open the market inspector");
                  if (detailVisible) {
                    const hasPrice = await page.locator("#marketDetail .market-detail-price").count() === 1;
                    const hasSourceFacts = await page.locator("#marketDetail .market-detail-facts").count() === 1;
                    const traceVisible = await page.locator("#marketDetail .market-trace").count() === 1;
                    const traceChart = await page.locator("#marketDetail .market-trace-chart").count();
                    const traceEmpty = await page.locator("#marketDetail .market-trace-empty").count();
                    const traceNote = await page.locator("#marketDetail .market-trace-note").count() === 1;
                    if (!hasPrice || !hasSourceFacts) report.failures.push(viewport.name+"/"+theme+"/app: market inspector is missing price or source facts");
                    if (!traceVisible || !traceNote || traceChart + traceEmpty !== 1) report.failures.push(viewport.name+"/"+theme+"/app: observed price trace is missing or has neither chart nor honest empty state");
                    const traceLabel = await page.locator("#marketDetail .market-trace-chart svg").getAttribute("aria-label").catch(() => null);
                    if (traceChart === 1 && !traceLabel?.includes("successful snapshots")) report.failures.push(viewport.name+"/"+theme+"/app: observed price chart is missing its provenance label");
                    await page.locator('#marketDetail button[data-market-action="close-detail"]').click();

                    // Seed QA-only prior observations and verify the chart branch using a clean browser reload.
                    const traceKeys = await page.locator('#main button[data-market-action="inspect"]').evaluateAll(buttons => buttons.map(button => button.getAttribute("data-market-id")).filter(Boolean));
                    if (traceKeys.length) {
                      await page.evaluate(keys => {
                        const now = Date.now();
                        const samples = [];
                        for (const key of keys) {
                          samples.push({ key, title: "QA observation fixture", chain: "QA fixture", p: 37, observedAt: new Date(now - 120000).toISOString() });
                          samples.push({ key, title: "QA observation fixture", chain: "QA fixture", p: 42.5, observedAt: new Date(now - 60000).toISOString() });
                        }
                        localStorage.setItem("seer-six-price-trace-v1", JSON.stringify(samples));
                      }, traceKeys);
                      await page.reload({ waitUntil: "domcontentloaded" });
                      await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, { timeout: 20000 }).catch(() => {});
                      const chartInspect = page.locator('#main button[data-market-action="inspect"]').first();
                      if (await chartInspect.count()) {
                        await chartInspect.click();
                        const chartCount = await page.locator("#marketDetail .market-trace-chart").count();
                        const emptyCount = await page.locator("#marketDetail .market-trace-empty").count();
                        const chartPolyline = await page.locator("#marketDetail .market-trace-chart svg polyline").count();
                        const chartLabel = await page.locator("#marketDetail .market-trace-chart svg").getAttribute("aria-label").catch(() => null);
                        const chartMeta = await page.locator("#marketDetail .market-trace-meta").innerText().catch(() => "");
                        if (chartCount !== 1 || emptyCount !== 0) report.failures.push(viewport.name+"/"+theme+"/app: two-snapshot trace fixture did not render the chart branch");
                        if (chartPolyline !== 1 || !chartLabel?.includes("successful snapshots") || !chartMeta.includes("OBSERVED CHANGE")) report.failures.push(viewport.name+"/"+theme+"/app: observed price chart is missing its line, provenance, or change metadata");
                        await page.locator('#marketDetail button[data-market-action="close-detail"]').click();
                      } else {
                        report.failures.push(viewport.name+"/"+theme+"/app: could not reopen inspector for chart-path test");
                      }
                    } else {
                      report.failures.push(viewport.name+"/"+theme+"/app: no market keys were available for observed-trace chart fixture");
                    }
                  }
                } else {
                  report.failures.push(viewport.name+"/"+theme+"/app: no Inspect record action was rendered");
                }
                const save = page.locator('#main button.market-save[data-market-action="save"]').first();
                if (await save.count()) {
                  await save.click();
                  const isSaved = await page.locator('#main button.market-save[data-market-action="save"]').first().getAttribute("aria-pressed");
                  if (isSaved !== "true") report.failures.push(viewport.name+"/"+theme+"/app: saving a market did not update the save control");
                  await page.locator("#main .watchlist-toggle").click();
                  await page.waitForFunction(() => document.querySelector("#explorerStatus")?.dataset.status === "saved", null, { timeout: 5000 }).catch(() => {});
                  const watchlistStatus = await page.locator("#explorerStatus").getAttribute("data-status");
                  const savedCards = await page.locator(".explorer-market-grid .market").count();
                  if (watchlistStatus !== "saved" || savedCards !== 1) report.failures.push(viewport.name+"/"+theme+"/app: the local watchlist did not show the saved market");
                  await page.locator("#main .watchlist-toggle").click();
                  await page.waitForFunction(() => ["live","fallback"].includes(document.querySelector("#explorerStatus")?.dataset.status || ""), null, { timeout: 20000 }).catch(() => {});
                } else {
                  report.failures.push(viewport.name+"/"+theme+"/app: no Save market action was rendered");
                }
              }
              if (route === "app") {
                // Each Explorer prediction card needs circular Seer-style artwork or the branded fallback.
                const explorerCards = page.locator("#main .explorer-market-grid .market-record");
                const explorerCardCount = await explorerCards.count();
                const cardAvatars = await explorerCards.locator(".market-card-heading .market-avatar").count();
                if (explorerCardCount > 0 && cardAvatars !== explorerCardCount) {
                  report.failures.push(viewport.name+"/"+theme+"/app: every prediction card must have circular market artwork or the branded fallback");
                }
                const cardTitles = await explorerCards.locator(".market-card-title").count();
                if (explorerCardCount > 0 && cardTitles !== explorerCardCount) {
                  report.failures.push(viewport.name+"/"+theme+"/app: prediction titles must sit beside their market artwork");
                }
                const compareButtons = page.locator('#main button[data-market-action="compare"]');
                if (await compareButtons.count() >= 2) {
                  await compareButtons.nth(0).click();
                  const comparePrompt = await page.locator("#marketCompare").count() === 1;
                  if (!comparePrompt) report.failures.push(viewport.name+"/"+theme+"/app: selecting a market did not open the compare workbench");
                  await page.locator('#main button[data-market-action="compare"]').nth(1).click();
                  const comparedCount = await page.locator("#marketCompare .compare-market-column").count();
                  if (comparedCount !== 2) report.failures.push(viewport.name+"/"+theme+"/app: selecting two markets did not render two comparison columns (found "+comparedCount+")");
                  await page.locator('#marketCompare button[data-market-action="remove-compare"]').first().click();
                  const oneLeftPrompt = await page.locator("#marketCompare").innerText().catch(() => "");
                  if (!oneLeftPrompt.includes("Add one more market to compare")) report.failures.push(viewport.name+"/"+theme+"/app: removing one comparison did not return to the one-market prompt");
                  await page.locator('#marketCompare button[data-market-action="clear-compare"]').click();
                  if (await page.locator("#marketCompare").count() !== 0) report.failures.push(viewport.name+"/"+theme+"/app: Clear comparison did not close the workbench");
                } else {
                  report.failures.push(viewport.name+"/"+theme+"/app: fewer than two compare actions were rendered");
                }
              }

              if (route === "opportunity") {
                const lab = page.locator("#opportunityLab");
                if (await lab.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/opportunity: Decision Lab is missing");
                } else {
                  const marketPriceText = await page.locator("#oppMarketPrice").innerText({ timeout: 5000 }).catch(() => "Not available");
                  const marketPrice = Number.parseFloat(marketPriceText);
                  if (!Number.isFinite(marketPrice)) {
                    report.failures.push(viewport.name+"/"+theme+"/opportunity: Decision Lab does not show a usable market price");
                  } else {
                    const belief = marketPrice <= 85 ? marketPrice + 10 : marketPrice - 10;
                    await page.locator("#oppBeliefInput").evaluate((el, value) => {
                      el.value = String(value);
                      el.dispatchEvent(new Event("input", { bubbles: true }));
                    }, belief);
                    await page.locator("#oppSideYesBtn").click();
                    const yesEdge = Number.parseFloat((await page.locator("#oppEdgeValue").innerText()).replace(" pp", ""));
                    await page.locator("#oppSideNoBtn").click();
                    const noEdge = Number.parseFloat((await page.locator("#oppEdgeValue").innerText()).replace(" pp", ""));
                    const yesQuote = Number.parseFloat(await page.locator("#oppSideYesBtn").getAttribute("data-entry-price") || "");
                    const noQuote = Number.parseFloat(await page.locator("#oppSideNoBtn").getAttribute("data-entry-price") || "");
                    const expectedYesEdge = belief - yesQuote;
                    const expectedNoEdge = (100-belief) - noQuote;
                    if (!Number.isFinite(yesEdge) || !Number.isFinite(noEdge) || !Number.isFinite(yesQuote) || !Number.isFinite(noQuote) || Math.abs(yesEdge-expectedYesEdge)>0.15 || Math.abs(noEdge-expectedNoEdge)>0.15) {
                      report.failures.push(viewport.name+"/"+theme+"/opportunity: chosen-outcome edge did not match the independent estimate and selected outcome quote");
                    }
                    // Select with exact source quotes: display rounding can show a positive sub-cent quote as 0%.
                    if (Number.isFinite(yesQuote) && yesQuote > 0) {
                      await page.locator("#oppSideYesBtn").click();
                    } else if (Number.isFinite(noQuote) && noQuote > 0) {
                      await page.locator("#oppSideNoBtn").click();
                    } else {
                      report.failures.push(viewport.name+"/"+theme+"/opportunity: neither side has a positive exact source quote for the sizing assertion");
                    }
                    await page.locator("#oppStakeInput").fill("250");
                    const sharesText = await page.locator("#oppSharesValue").innerText();
                    const payoutText = await page.locator("#oppPayoutValue").innerText();
                    const pnlText = await page.locator("#oppExpectedValue").innerText();
                    if (sharesText === "—" || payoutText === "—" || !pnlText.startsWith("$")) {
                      report.failures.push(viewport.name+"/"+theme+"/opportunity: position sizing outputs did not update after input on a positive-priced side");
                    }
                    const selector = page.locator("#oppMarketSelect");
                    if (await selector.locator("option").count() > 1) {
                      const targetValue = await selector.locator("option").nth(1).getAttribute("value");
                      await selector.selectOption({ index: 1 });
                      const recovered = await page.waitForFunction(() => {
                        const lab = document.querySelector("#opportunityLab");
                        return !!lab && !!lab.querySelector("#oppMarketSelect") &&
                          !!lab.querySelector("#oppMarketPrice") &&
                          !!lab.querySelector("#oppScenarioContext");
                      }, null, { timeout: 5000 }).then(() => true).catch(() => false);
                      if (!recovered) {
                        report.failures.push(viewport.name+"/"+theme+"/opportunity: changing the source market removed or stranded the Decision Lab");
                      } else {
                        const activeValue = await page.locator("#oppMarketSelect").inputValue().catch(() => "");
                        const after = await page.locator("#oppMarketPrice").innerText().catch(() => "");
                        const contextCount = await page.locator("#oppScenarioContext").count();
                        if (!activeValue || !after || contextCount !== 1) {
                          report.failures.push(viewport.name+"/"+theme+"/opportunity: selected source market did not recover to a coherent scenario");
                        }
                        // If the available source set changed during the test, the UI may choose a valid fallback;
                        // the active selection must still exist in the rendered option list.
                        const activeOptionCount = await page.locator("#oppMarketSelect option").evaluateAll((opts, value) =>
                          opts.filter(option => option.value === value).length, activeValue).catch(() => 0);
                        if (activeOptionCount !== 1) report.failures.push(viewport.name+"/"+theme+"/opportunity: selected market has no matching option after the refresh");
                      }
                    }
                  }
                }
              }

              if (route === "home") {
                const getApp = page.locator("#getAppButton");
                if (await getApp.count() !== 1) {
                  report.failures.push(viewport.name+"/"+theme+"/home: Get the app CTA is missing");
                } else {
                  const destination = await getApp.getAttribute("href");
                  const target = await getApp.getAttribute("target");
                  const label = (await getApp.innerText()).replace(/\s+/g, " ").trim();
                  if (label !== "Visit Seer ↗") report.failures.push(viewport.name+"/"+theme+"/home: top-right CTA label should differ from the competitor's Open App label");
                  if (destination !== "https://app.seer.pm/" || target !== "_blank") {
                    report.failures.push(viewport.name+"/"+theme+"/home: Visit Seer CTA must open the official Seer app in a new tab");
                  } else {
                    const [popup] = await Promise.all([
                      page.context().waitForEvent("page", { timeout: 10000 }),
                      getApp.click()
                    ]).catch(() => [null]);
                    if (!popup) {
                      report.failures.push(viewport.name+"/"+theme+"/home: Get the app CTA did not open the official Seer app");
                    } else {
                      await popup.waitForLoadState("domcontentloaded", { timeout: 12000 }).catch(() => {});
                      if (!popup.url().startsWith("https://app.seer.pm/")) {
                        report.failures.push(viewport.name+"/"+theme+"/home: Get the app opened unexpected destination "+popup.url());
                      }
                      await popup.close().catch(() => {});
                    }
                  }
                }
              }

              if (route === "deep") {
                const landscapeRows = page.locator(".liquidity-landscape .landscape-row");
                const rowCount = await landscapeRows.count();
                if (metrics.marketFeedStatus === "live" && rowCount === 0) {
                  report.failures.push(viewport.name+"/"+theme+"/deep: live Deep Forecasts data did not populate the liquidity landscape");
                } else if (rowCount > 0) {
                  const reportedLabels = await page.locator(".liquidity-landscape .landscape-meta b").allInnerTexts();
                  const knownBars = page.locator(".liquidity-landscape .landscape-rail:not(.is-unreported) > i");
                  const widths = await knownBars.evaluateAll(nodes => nodes.map(node => Number.parseFloat(node.style.width)).filter(Number.isFinite));
                  if (reportedLabels.some(label => label.trim().startsWith("$")) && (!widths.length || !widths.some(width => width > 0) || Math.max(...widths) < 99.5)) {
                    report.failures.push(viewport.name+"/"+theme+"/deep: reported liquidity did not render as correctly normalized bars");
                  }
                  const unavailable = await page.locator(".liquidity-landscape .landscape-rail.is-unreported").count();
                  const unavailableLabels = reportedLabels.filter(label => label.trim() === "Not reported").length;
                  if (unavailable !== unavailableLabels) report.failures.push(viewport.name+"/"+theme+"/deep: unreported liquidity was not represented honestly");
                }
              }

              const nextRoute = routes[(routes.indexOf(route) + 1) % routes.length];
              const nextLink = page.locator(`#siteFooter .interface-link[data-suite-page="${nextRoute}"]`);
              await nextLink.click();
              const footerNavigationWorks = await page.locator("#main").getAttribute("data-page") === nextRoute;
              if (!footerNavigationWorks) report.failures.push(`${viewport.name}/${theme}/${route}: footer link did not navigate to ${nextRoute}`);
              if (route === "risk") {
                // The footer has returned to home: assert the visible market tape is present, populated and moving.
                const homeTape = page.locator("#main .signal-ticker.market-tape");
                if (await homeTape.count() !== 1) {
                  report.failures.push(`${viewport.name}/${theme}: home Market Tape is missing after footer navigation`);
                } else {
                  const animation = await homeTape.locator(".signal-ticker-track").evaluate(el => getComputedStyle(el).animationName);
                  const items = homeTape.locator('.signal-ticker-set:not([aria-hidden="true"]) .market-tape-item');
                  const count = await items.count();
                  const avatars = await items.locator(".market-avatar").count();
                  if (animation !== "signalTickerRun") report.failures.push(`${viewport.name}/${theme}: home Market Tape stopped after route navigation`);
                  if (count < 1 || avatars !== count) report.failures.push(`${viewport.name}/${theme}: home Market Tape is missing per-market avatars`);
                }
              }
              if (metrics.marketFeedStatus !== "live") report.warnings.push(`${viewport.name}/${theme}/${route}: live API status was ${metrics.marketFeedStatus}; check CORS/API availability`);
              }
            }
            await context.close();
          }

          fs.writeFileSync("artifacts/report.json", JSON.stringify(report, null, 2));
          console.log(JSON.stringify({ testedAt: report.testedAt, checks: report.results.length, failures: report.failures, warnings: report.warnings, routes: report.results.map(({viewport, theme, route, heading, headingFontFamily, bodyFontLoaded, displayFontLoaded, monoFontLoaded, interfaceNavCount, currentFooterRoute, footerOutsideWorkspace, heroSignalCount, interfaceArtCount, explorerControlCount, explorerVisibleCardCount, explorerWatchlistButtonCount, marketPulseItemCount, signalDeskCount, signalStoryCount, marketWireVisible, marketWireItemCount, marketWireAnimation, marketWireStatus, prefersReducedMotion, explorerIndexStatus, explorerPageLabel, heroMarketStatus, horizontalOverflow, marketFeedStatus}) => ({viewport, theme, route, heading, headingFontFamily, bodyFontLoaded, displayFontLoaded, monoFontLoaded, interfaceNavCount, currentFooterRoute, footerOutsideWorkspace, heroSignalCount, interfaceArtCount, explorerControlCount, explorerVisibleCardCount, explorerWatchlistButtonCount, marketPulseItemCount, marketWireVisible, marketWireItemCount, marketWireAnimation, marketWireStatus, prefersReducedMotion, explorerIndexStatus, explorerPageLabel, heroMarketStatus, horizontalOverflow, marketFeedStatus})) }, null, 2));
          await browser.close();
          if (report.failures.length) process.exit(1);
          NODE

      - name: Upload desktop/mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seer-six-dark-light-browser-visual-check
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
