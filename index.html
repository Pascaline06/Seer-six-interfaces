
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#101013">
<meta name="description" content="Seer Six: six decision interfaces for exploring market signals, conditional forecasts, opportunity selection and comparative risk.">
<meta property="og:title" content="Seer Six — Markets for better decisions">
<meta property="og:description" content="Explore the signal. Inspect the evidence. Understand the limits.">
<meta property="og:type" content="website">
<title>Seer Six — Every opinion has a price</title>
<style>

:root{
  color-scheme:dark;
  --bg:#101013;
  --surface:#17171c;
  --panel:#1b1b21;
  --panel-raised:#222229;
  --line:#34343f;
  --text:#f3f1f8;
  --muted:#bbb8c7;
  --dim:#898595;
  --violet:#b7a0ff;
  --violet-strong:#8b5cf6;
  --purple:#6c2bd9;
  --green:#77ddb0;
  --amber:#f4ca83;
  --red:#ff9eaa;
  --content-gap:22px;
  --card-radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.7;
  font-synthesis:none;text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.skip-link{position:absolute;left:12px;top:-70px;z-index:30;background:var(--violet);color:#101013;border-radius:8px;padding:10px 14px;font-weight:700}
.skip-link:focus{top:12px}
.shell{min-height:100vh}
.top{
  position:sticky;top:0;z-index:10;height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 clamp(20px,4.5vw,72px);
  background:rgba(16,16,19,.94);border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-size:0}
.logo{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;overflow:hidden}
.logo img{display:block;width:30px;height:30px;object-fit:contain}
.wordmark{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;letter-spacing:-1.05px;line-height:1;color:var(--text)}
.brand-note{margin-left:3px;color:var(--dim);font-size:11px;letter-spacing:.02em;font-weight:500}
.topright{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
.chain{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:-.03em;color:var(--muted)}
.live{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px #8b5cf677}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:rgba(34,34,41,.6);font-size:11px;line-height:1.35;white-space:nowrap}
.pill.violet{color:#e2d7ff;background:#6c2bd91c;border-color:#a78bfa55}
.pill.green{color:var(--green)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--text);font-size:12px;font-weight:600}
.theme-toggle:hover{border-color:var(--violet)}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1760px;margin:0 auto;min-height:calc(100vh - 72px)}
.side{padding:34px 16px;border-right:1px solid var(--line)}
.side-label,.eyebrow,.category,.crumb,.statlabel,th{font-size:11px;font-weight:700;letter-spacing:.115em;text-transform:uppercase}
.side-label{padding:8px 12px 14px;color:var(--dim)}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;min-height:45px;
  padding:11px 12px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--muted);text-align:left;font-size:13px;
  font-weight:600;transition:color .16s,background .16s,border-color .16s;
}
.nav button:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.nav button.active{background:linear-gradient(100deg,#6c2bd92f,#6c2bd90b);border-color:#a78bfa4a;box-shadow:inset 2px 0 var(--violet);color:#e8ddff}
.num{width:23px;flex:0 0 23px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.nav button.active .num{color:var(--violet)}
.side-note{margin:38px 4px 0;padding:17px 16px;border:1px solid #a78bfa30;border-radius:12px;background:linear-gradient(145deg,#6c2bd919,#1b1b2100);font-size:13px;line-height:1.8;color:var(--muted)}
.side-note .eyebrow{color:var(--violet)}
.side-note p{margin:11px 0 0}
.main{min-width:0;padding:clamp(36px,4.6vw,72px) clamp(24px,5vw,82px) 42px}
.crumb{margin:0 0 26px;color:var(--dim);font-size:11px}
.eyebrow{color:var(--violet);font-size:11px;letter-spacing:.14em}
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;margin:0 0 42px}
.headrow>div{min-width:0}
.headrow>.pill{margin-top:7px}
.headrow .button{flex:0 0 auto;margin-top:9px;align-self:flex-start}
.heading,h1,h2,h3,.sectionhead h2,.market h3,.interface-nav-title{
  font-family:"Bricolage Grotesque",sans-serif;font-synthesis:none;
}
.heading{
  max-width:900px;margin:14px 0 21px;color:var(--text);
  font-size:clamp(42px,4.6vw,66px);font-weight:600;letter-spacing:-.02em;line-height:1.045;
  text-wrap:balance;
}
.intro{max-width:65ch;margin:0;color:var(--muted);font-size:17px;line-height:1.85;font-weight:400}
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:11px 16px;border:1px solid #484653;border-radius:10px;
  background:var(--panel-raised);color:var(--text);font-size:13px;font-weight:650;letter-spacing:0;
  transition:background .16s,border-color .16s,transform .16s;
}
.button:hover{transform:translateY(-1px);border-color:var(--violet)}
.button.primary{background:var(--purple);border-color:#8756f3;color:white}
.button.primary:hover{background:#7c3aed;border-color:#9d79fa}
.grid{display:grid;gap:var(--content-gap);min-width:0}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:32px 0 43px}
.panel{
  min-width:0;padding:25px 26px;border:1px solid var(--line);
  border-radius:var(--card-radius);background:var(--panel);
}
.stats .panel{padding:24px 25px;position:relative;overflow:hidden}
.stats .panel:after{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--violet-strong),transparent 78%);content:""}
.statlabel{color:var(--muted);font-size:11px;letter-spacing:.1em}
.statvalue,.prob,.outcome,.optionprob,td.num,.mono{
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
}
.statvalue{margin:15px 0 9px;font-size:clamp(26px,2.5vw,37px);font-weight:600;letter-spacing:-.06em;line-height:1.2;color:var(--text)}
.statfoot{color:var(--muted);font-size:12px;line-height:1.65}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:46px 0 19px}
.sectionhead h2{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.01em;font-weight:600}
.sectionhead p{max-width:62ch;margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
.markets{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.market{display:flex;flex-direction:column;gap:17px;min-height:224px;padding:24px;border-radius:14px;transition:border-color .17s,transform .17s,background .17s}
.market:hover{transform:translateY(-2px);border-color:#a78bfa80}
.markettop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.category{color:var(--violet);font-size:10px;letter-spacing:.12em}
.market h3{max-width:42ch;margin:0;font-size:17px;font-weight:600;line-height:1.5;letter-spacing:-.005em;color:var(--text)}
.probrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prob{font-size:37px;font-weight:600;letter-spacing:-.065em;color:var(--text);line-height:1.25}
.positive{color:var(--green)}
.muted{color:var(--muted)}
.bar{height:6px;margin-top:11px;overflow:hidden;border-radius:999px;background:#393642}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple),var(--violet))}
.marketfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:7px;color:var(--muted);font-size:12px;line-height:1.6}
.two{grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr);gap:22px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chart{position:relative;height:228px;margin-top:17px;overflow:hidden;border-radius:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#34343f 54px,#34343f 55px)}
.chart svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:15px;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:560px;border-collapse:collapse}
th{padding:16px 15px;background:#ffffff04;color:var(--dim);text-align:left;font-size:10px;letter-spacing:.1em}
td{padding:16px 15px;border-bottom:1px solid #ffffff12;color:var(--text);font-size:14px;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:#a78bfa0a}
.evidence{display:grid;gap:18px}
.evidenceitem{padding:4px 0 4px 16px;border-left:2px solid var(--violet-strong)}
.evidenceitem strong{display:block;color:var(--text);font-size:14px;font-weight:700;line-height:1.55}
.evidenceitem span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.75}
.notice{margin:24px 0;padding:16px 18px;border:1px solid #f4ca8340;border-radius:11px;background:#f4ca8309;color:#e1cca7;font-size:13px;line-height:1.8}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:650}
.field select,.field input{width:100%;min-height:46px;padding:12px 14px;border:1px solid #494654;border-radius:9px;background:#101013;color:var(--text);font-size:14px}
.field select:focus,.field input:focus{outline:2px solid var(--violet);outline-offset:2px}
input[type="range"]{padding:0!important;border:0!important;background:transparent!important;accent-color:var(--violet);cursor:ew-resize}
.outcome{font-size:34px;font-weight:600;letter-spacing:-.06em}
.optionrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.optionrow:last-child{border-bottom:0}
.optionrow strong{display:block;font-size:15px;font-weight:650;line-height:1.5}
.optionrow small{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.7}
.optionprob{font-size:26px;font-weight:600;letter-spacing:-.055em;text-align:right}
.site-footer{
  max-width:1760px;width:100%;margin:0 auto;padding:30px clamp(24px,5vw,82px) 22px;
  border-top:1px solid var(--line);background:var(--bg);
}
.site-footer-inner{display:grid;grid-template-columns:minmax(180px,.75fr) minmax(0,2fr);align-items:center;gap:34px}
.footer-brand-lockup{display:inline-flex;align-items:center;gap:9px}
.footer-brand-lockup img{width:27px;height:27px;object-fit:contain;display:block}
.footer-brand-lockup .wordmark{font-size:24px}
.footer-tagline{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.interface-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:7px 24px;padding:0;border:0}
.interface-link{display:inline-flex;align-items:center;min-height:38px;padding:7px 0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:color .16s}
.interface-link:hover{color:var(--text)}
.interface-link.current{color:var(--text);text-decoration:underline;text-decoration-color:var(--violet);text-decoration-thickness:2px;text-underline-offset:7px}
.interface-link:focus-visible{outline-offset:2px}
.site-footer-bottom{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px 22px;margin-top:22px;padding-top:15px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.7}
.site-footer-bottom span:last-child{max-width:72ch}

body[data-theme="light"]{
  color-scheme:light;--bg:#f7f7f9;--surface:#fff;--panel:#fff;--panel-raised:#f2f0f7;
  --line:#dfdde7;--text:#201b2b;--muted:#5c566b;--dim:#756f83;
  --violet:#6531c9;--violet-strong:#7845df;--purple:#6c2bd9;background:var(--bg);color:var(--text)
}
body[data-theme="light"] .top{background:rgba(255,255,255,.94);border-color:var(--line)}
body[data-theme="light"] .chain{color:var(--muted)}
body[data-theme="light"] .logo img{filter:brightness(0)}
body[data-theme="light"] .pill{background:#f3f1f8;border-color:#dfdde7;color:#5c566b}
body[data-theme="light"] .pill.violet{background:#eee7ff;border-color:#d6c7ff;color:#5125a8}
body[data-theme="light"] .theme-toggle{background:#fff;border-color:var(--line);color:var(--text)}
body[data-theme="light"] .side{background:#f7f7f9;border-color:var(--line)}
body[data-theme="light"] .nav button{color:var(--muted)}
body[data-theme="light"] .nav button:hover{background:#efedf5;border-color:#dfdde7;color:var(--text)}
body[data-theme="light"] .nav button.active{background:#eee7ff;border-color:#d6c7ff;color:#5125a8;box-shadow:inset 2px 0 #6c2bd9}
body[data-theme="light"] .side-note{background:#fff;border-color:#dfd6f5;color:var(--muted)}
body[data-theme="light"] .heading,body[data-theme="light"] .sectionhead h2,body[data-theme="light"] .market h3,body[data-theme="light"] .optionrow strong,body[data-theme="light"] .statvalue,body[data-theme="light"] .prob,body[data-theme="light"] .evidenceitem strong{color:var(--text)}
body[data-theme="light"] .intro,body[data-theme="light"] .muted,body[data-theme="light"] .statfoot,body[data-theme="light"] .marketfoot,body[data-theme="light"] .sectionhead p,body[data-theme="light"] .evidenceitem span{color:var(--muted)}
body[data-theme="light"] .button{background:#fff;border-color:#d9d6e2;color:#292333}
body[data-theme="light"] .button.primary{background:#6c2bd9;border-color:#6c2bd9;color:#fff}
body[data-theme="light"] .panel,body[data-theme="light"] .market{background:#fff;border-color:var(--line);box-shadow:0 5px 20px #21123807}
body[data-theme="light"] .stats .panel:after{background:linear-gradient(90deg,#7845df,transparent 80%)}
body[data-theme="light"] .bar{background:#e6e1ef}
body[data-theme="light"] .chart{background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#e5e1ec 54px,#e5e1ec 55px)}
body[data-theme="light"] .tablewrap{border-color:var(--line)}
body[data-theme="light"] th{background:#f5f3f8;color:#615a70}
body[data-theme="light"] td{border-bottom-color:#e9e6ef;color:#292333}
body[data-theme="light"] tbody tr:hover{background:#6c2bd908}
body[data-theme="light"] .field select,body[data-theme="light"] .field input{background:#fff;border-color:#d9d6e2;color:var(--text)}
body[data-theme="light"] .notice{background:#fff9ed;border-color:#efdfbd;color:#735927}
body[data-theme="light"] .site-footer{border-color:var(--line);background:var(--bg)}
body[data-theme="light"] .footer-brand-lockup img{filter:brightness(0)}
body[data-theme="light"] .site-footer-bottom{border-color:var(--line)}
body[data-theme="light"] .interface-link{color:#5c566b}
body[data-theme="light"] .interface-link:hover,body[data-theme="light"] .interface-link.current{color:#201b2b}
@media(max-width:1200px){
 .layout{grid-template-columns:215px minmax(0,1fr)}
 .main{padding-inline:clamp(24px,3.5vw,46px)}
}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .top{height:68px}
 .brand-note,.topright .chain{display:none}
 .side{position:sticky;top:68px;z-index:8;min-height:0;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);background:rgba(16,16,19,.96);backdrop-filter:blur(16px)}
 .side-label,.side-note{display:none}
 .nav{flex-direction:row;gap:5px;overflow-x:auto;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav button{width:auto;min-width:max-content;min-height:40px;padding:9px 11px;font-size:12px}
 .num{display:none}
 .main{padding-top:40px}
 .heading{font-size:clamp(40px,6.2vw,55px)}
 .intro{font-size:16px;line-height:1.8}
 .headrow{gap:18px;margin-bottom:34px}
 .stats{gap:13px;margin:24px 0 34px}
 .stats .panel{padding:19px}
 .panel{padding:22px}
 .market{padding:21px}
 .sectionhead{margin-top:38px}
 .two{grid-template-columns:1fr}
}
@media(max-width:560px){
 body{font-size:15px}
 .top{height:62px;padding-inline:14px}
 .wordmark{font-size:22px}
 .logo,.logo img{width:26px;height:26px}
 .logo{flex-basis:26px}
 .topright{gap:7px}
 .topright .pill{font-size:9px;padding:5px 7px}
 .theme-toggle{min-height:31px;padding:5px 8px;font-size:11px}
 .theme-toggle span{display:none}
 .side{top:62px;padding:7px 8px}
 .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
 .nav button{justify-content:flex-start;min-width:0;min-height:36px;white-space:normal;padding:7px 6px;font-size:10px;line-height:1.25;gap:5px}
 .main{padding:30px 16px 28px}
 .crumb{margin-bottom:19px}
 .heading{margin:12px 0 17px;font-size:clamp(35px,9.7vw,44px);line-height:1.09;letter-spacing:-.015em}
 .intro{font-size:15px;line-height:1.8}
 .headrow{gap:12px;margin-bottom:28px}
 .headrow .button{margin-top:2px}
 .stats,.markets,.three{grid-template-columns:1fr}
 .stats{gap:11px;margin:23px 0 32px}
 .stats .panel{padding:17px 18px}
 .statvalue{margin:11px 0 6px;font-size:28px}
 .sectionhead{align-items:flex-start;flex-direction:column;gap:6px;margin:34px 0 15px}
 .sectionhead h2{font-size:20px}
 .grid{gap:14px}
 .panel,.market{padding:19px;border-radius:13px}
 .market{min-height:0;gap:15px}
 .market h3{font-size:16px}
 .prob{font-size:32px}
 .marketfoot{flex-wrap:wrap;font-size:11px}
 .chart{height:190px}
 .formrow{grid-template-columns:1fr}
 .optionrow{gap:12px;padding:16px 0}
 .optionrow strong{font-size:14px}
 .optionrow small{font-size:12px;line-height:1.6}
 .optionprob,.outcome{font-size:22px}
 .site-footer{padding:24px 17px 18px}
 .site-footer-inner{grid-template-columns:1fr;gap:20px}
 .footer-brand-lockup .wordmark{font-size:22px}
 .footer-tagline{margin-top:5px;font-size:12px}
 .interface-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-content:start;gap:0 18px;padding:8px 0}
 .interface-link{min-width:0;min-height:40px;white-space:normal;padding:10px 0;font-size:12px}
 .interface-link:nth-child(-n+4){border-bottom:1px solid var(--line)}
 .site-footer-bottom{display:block;margin-top:12px;padding-top:12px;font-size:10px}
 .site-footer-bottom span{display:block;margin-top:5px}
 body[data-theme="light"] .interface-link:nth-child(-n+4){border-bottom-color:var(--line)}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* Electric Foundation art direction — purposeful texture and signal visuals, while preserving every original interface section. */
:root{--bg:#141223;--surface:#19172a;--panel:#1c1a30;--panel-raised:#242139;--line:#39334f;--text:#efe9fc;--muted:#b9b1cc;--dim:#8d86a3;--violet:#c0a7ff;--violet-strong:#a18aff;--purple:#7d33ff}
body{background:radial-gradient(ellipse at 78% -10%,rgba(125,51,255,.13),transparent 42%),radial-gradient(ellipse at 2% 40%,rgba(87,63,150,.07),transparent 38%),var(--bg)}

/* SEER MARKET WIRE — moving, source-backed snapshot tape */

/* Observed repricing ledger: source snapshot differences, never inferred trades */
.market-wire .wire-tools-actions{flex-wrap:wrap}
.market-wire .wire-tools-actions .wire-history-toggle{color:var(--muted);border-color:#a18aff38}
.market-wire .wire-tools-actions .wire-history-toggle[aria-expanded="true"]{color:var(--text);background:#7d33ff15;border-color:#a18aff70}
.wire-ledger{grid-column:1/-1;min-width:0;border-top:1px solid var(--line);background:linear-gradient(110deg,rgba(125,51,255,.055),transparent 58%);padding:14px 16px 13px}
.wire-ledger-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:9px}
.wire-ledger-title{font:700 10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--text)}
.wire-ledger-note{margin-top:5px;font:500 9px "JetBrains Mono",monospace;color:var(--dim);line-height:1.6}
.wire-ledger-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.wire-ledger-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#ffffff03}

.wire-ledger-values .up{color:var(--green,#77ddb0)}
.wire-ledger-values .down{color:var(--amber,#f4c477)}

.market-wire-set{display:flex;flex:none;align-items:stretch}
.wire-item{display:flex;align-items:center;gap:9px;min-height:65px;padding:10px 17px;border-right:1px solid var(--line);white-space:nowrap}
.wire-chain{font:600 9px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--violet);text-transform:uppercase}
.wire-title{max-width:195px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px}
.wire-price{font:700 13px "JetBrains Mono",monospace;color:var(--text);font-variant-numeric:tabular-nums}
.wire-metric{font:500 9px "JetBrains Mono",monospace;color:var(--dim);font-variant-numeric:tabular-nums}
.wire-item.wire-item-updated{animation:wireReprice 1.35s ease-out}
.wire-empty{padding:18px;color:var(--muted);font-size:11px;white-space:nowrap}
.market-wire-tools{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:10px 13px;border-left:1px solid var(--line);min-width:0}
.wire-tools-meta{display:flex;align-items:center;justify-content:space-between;gap:7px;font:500 8px "JetBrains Mono",monospace;letter-spacing:.035em;color:var(--dim);white-space:nowrap}
.wire-tools-actions{display:flex;align-items:center;gap:6px}
.wire-tools-actions button{min-height:28px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#ffffff04;color:var(--muted);font:600 10px "DM Sans",sans-serif;cursor:pointer;white-space:nowrap;transition:color .16s,border-color .16s,background .16s}
.wire-tools-actions button:hover{color:var(--text);border-color:#a18aff70;background:#7d33ff12}
.wire-tools-actions button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wire-tools-actions .wire-refresh{color:var(--violet);border-color:#a18aff40}
.wire-refresh:disabled{opacity:.5;cursor:wait}
.signal-desk{margin:22px 0 28px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(115deg,rgba(125,51,255,.09),rgba(27,26,43,.82) 46%,rgba(119,221,176,.035));box-shadow:inset 0 1px rgba(255,255,255,.035),0 16px 35px rgba(0,0,0,.08)}
.signal-desk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:19px 21px 16px;border-bottom:1px solid var(--line)}
.signal-desk-kicker{display:flex;align-items:center;gap:8px;color:var(--violet);font:700 9px "JetBrains Mono",monospace;letter-spacing:.15em;text-transform:uppercase}
.signal-desk-head h2{margin:7px 0 0;font:600 clamp(20px,2.2vw,27px)/1.22 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;color:var(--text)}
.signal-desk-stamp{flex:0 0 auto;color:var(--dim);font:500 8px "JetBrains Mono",monospace;letter-spacing:.07em;text-align:right}
.signal-desk-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0}
.signal-story{position:relative;min-width:0;padding:18px 20px 20px;border-right:1px solid var(--line);animation:signalStoryReveal .42s ease both}
.signal-story:nth-child(2){animation-delay:.06s}.signal-story:nth-child(3){animation-delay:.12s}.signal-story:last-child{border-right:0}
.signal-story-lead{background:linear-gradient(145deg,rgba(125,51,255,.095),transparent 76%);border-top:2px solid var(--violet-strong);padding-top:16px}
.signal-story:not(.signal-story-lead){border-top:2px solid #ffffff08}
.signal-story-kicker{display:flex;align-items:center;gap:7px;min-height:18px;color:var(--dim);font:600 8px "JetBrains Mono",monospace;letter-spacing:.11em;text-transform:uppercase}
.signal-story-kicker .dot{width:5px;height:5px;margin:0}
.signal-story-value{margin:12px 0 10px;color:var(--text);font:600 clamp(25px,2.4vw,34px)/1.08 "JetBrains Mono",monospace;letter-spacing:-.07em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.signal-story-value.up{color:var(--green)}.signal-story-value.down{color:var(--red)}
.signal-story h3{margin:0;color:var(--text);font:600 15px/1.45 "DM Sans",sans-serif;letter-spacing:-.015em;overflow-wrap:anywhere}
.signal-story p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.7}
.signal-story-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font:500 8px "JetBrains Mono",monospace;letter-spacing:.045em;text-transform:uppercase}
.signal-desk-action{display:inline-flex;align-items:center;gap:7px;margin-top:13px;padding:7px 0;border:0;background:transparent;color:var(--violet);font:700 10px "DM Sans",sans-serif}
.signal-desk-action:hover{color:var(--text)}
.signal-desk-action:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.signal-story-empty .signal-story-value{color:var(--dim);letter-spacing:-.02em;font-size:20px}
body[data-theme="light"] .signal-desk{background:linear-gradient(115deg,#f1eaff,#fff 48%,#f1fbf7);border-color:#dcd1ef;box-shadow:0 12px 28px rgba(55,30,90,.06)}
body[data-theme="light"] .signal-story-lead{background:linear-gradient(145deg,#eee4ff,transparent 78%)}
@keyframes signalStoryReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:820px){.signal-desk-grid{grid-template-columns:1fr 1fr}.signal-story-lead{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}.signal-story:nth-child(2){border-right:0}.signal-story:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line)}}
@media(max-width:560px){.signal-desk-head{align-items:flex-start;flex-direction:column;gap:9px;padding:17px 16px 14px}.signal-desk-stamp{text-align:left}.signal-desk-grid{grid-template-columns:1fr}.signal-story,.signal-story-lead,.signal-story:nth-child(2),.signal-story:nth-child(3){grid-column:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}.signal-story:last-child{border-bottom:0}.signal-story-value{font-size:27px}}
@media(prefers-reduced-motion:reduce){.signal-story{animation:none!important;transform:none!important;opacity:1!important}}
@keyframes marketWireRun{to{transform:translateX(-50%)}}
@keyframes wireLed{to{opacity:.52;box-shadow:0 0 0 3px #77ddb00e,0 0 4px #77ddb033}}
@keyframes wireReprice{0%{background:rgba(192,167,255,.19)}100%{background:transparent}}
body[data-theme="light"] .market-wire{background:linear-gradient(105deg,#f0e9ff,#fff 40%,#f9f6ff);border-color:#d9cafa;box-shadow:0 10px 28px rgba(65,35,105,.06)}
body[data-theme="light"] .wire-tools-actions button{background:#fff8}
@media(max-width:1100px){.market-wire{grid-template-columns:125px minmax(0,1fr)}.market-wire-tools{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;border-left:0;border-top:1px solid var(--line);padding:8px 12px}.wire-item{min-height:57px;padding:9px 13px}}
@media(max-width:600px){.market-wire{grid-template-columns:1fr;margin-bottom:17px}.market-wire-head{flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line);padding:10px 13px}.market-wire-tools{align-items:flex-start;flex-direction:column;gap:7px}.wire-item{gap:7px;padding:9px 11px}.wire-title{max-width:155px}.wire-metric{font-size:8px}.wire-tools-meta{white-space:normal;line-height:1.5}}
@media(prefers-reduced-motion:reduce){.market-wire-track,.market-wire.is-live .wire-status-led,.wire-item.wire-item-updated{animation:none!important;will-change:auto}}


/* Editorial motion layer: the desk moves because its source-backed briefing is refreshed. */
.signal-desk{position:relative;background:linear-gradient(115deg,rgba(125,51,255,.12),rgba(27,26,43,.82) 43%,rgba(119,221,176,.05));}
.signal-desk::before{content:"";display:block;position:absolute;z-index:1;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(192,167,255,.95) 24%,rgba(119,221,176,.6) 78%,transparent);pointer-events:none}
.signal-desk-head{background:linear-gradient(100deg,rgba(125,51,255,.075),transparent 65%)}
.signal-ticker{position:relative;display:grid;grid-template-columns:134px minmax(0,1fr);align-items:stretch;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(125,51,255,.105),rgba(27,26,43,.12) 44%,rgba(119,221,176,.045))}
.signal-ticker-label{display:flex;align-items:center;gap:8px;padding:12px 14px;border-right:1px solid var(--line);background:rgba(125,51,255,.075);color:var(--text);font:800 9px "JetBrains Mono",monospace;letter-spacing:.13em;white-space:nowrap}
.signal-ticker-label small{margin-left:auto;color:var(--dim);font:500 7px "JetBrains Mono",monospace;letter-spacing:.08em}
.signal-ticker-live-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(119,221,176,.75);animation:signalTickerPulse 1.7s ease-in-out infinite}
.signal-ticker-viewport{min-width:0;overflow:hidden;align-self:stretch;mask-image:linear-gradient(90deg,transparent,black 2%,black 98%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,black 2%,black 98%,transparent)}
.signal-ticker-track{display:flex;width:max-content;min-height:48px;align-items:stretch;will-change:transform;animation:signalTickerRun 39s linear infinite}
.signal-ticker:hover .signal-ticker-track,.signal-ticker:focus-within .signal-ticker-track{animation-play-state:paused}
.signal-ticker-set{display:flex;flex:none;align-items:stretch}
.signal-ticker-item{display:flex;align-items:center;gap:9px;max-width:none;padding:9px 19px;border-right:1px solid var(--line);white-space:nowrap}
.signal-ticker-kind{color:var(--violet);font:700 8px "JetBrains Mono",monospace;letter-spacing:.1em}
.signal-ticker-item strong{max-width:290px;overflow:hidden;text-overflow:ellipsis;color:var(--text);font:600 10px "DM Sans",sans-serif}
.signal-ticker-detail{color:var(--muted);font:500 8px "JetBrains Mono",monospace}
.signal-story{transition:background .2s ease,box-shadow .2s ease}
.signal-story:hover{background-color:rgba(192,167,255,.045);box-shadow:inset 0 1px rgba(192,167,255,.08)}
.signal-story-empty .signal-story-value{color:var(--green);letter-spacing:-.055em;font-size:clamp(25px,2.4vw,34px)}
@keyframes signalTickerRun{to{transform:translateX(-50%)}}
@keyframes signalTickerPulse{0%,100%{opacity:1;box-shadow:0 0 11px rgba(119,221,176,.72)}50%{opacity:.45;box-shadow:0 0 2px rgba(119,221,176,.2)}}
@media(max-width:820px){.signal-ticker{grid-template-columns:1fr}.signal-ticker-label{padding:9px 14px;border-right:0;border-bottom:1px solid var(--line)}.signal-ticker-label small{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.signal-ticker-track,.signal-ticker-live-dot{animation:none!important;transform:none!important;will-change:auto}.signal-story{transition:none!important}}


/* Evidence trace — compact chart of observations actually captured in this browser. */
.market-trace{margin-top:15px;padding:16px 17px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(120deg,rgba(125,51,255,.075),rgba(27,26,43,.24) 60%,rgba(119,221,176,.025))}
.market-trace-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.market-trace-head h3{margin:5px 0 0;color:var(--text);font:600 15px/1.25 "Bricolage Grotesque",sans-serif;letter-spacing:-.015em}
.market-trace-count{padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font:600 8px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.market-trace-chart{margin-top:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(183,160,255,.04),transparent)}
.market-trace-chart svg{display:block;width:100%;height:auto;max-height:108px}
.market-trace-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.market-trace-meta>span{display:flex;flex-direction:column;gap:4px;color:var(--dim);font:600 8px "JetBrains Mono",monospace;letter-spacing:.07em}
.market-trace-meta b{font-size:12px;color:var(--text);font-weight:700;letter-spacing:0}
.market-trace-meta small{color:var(--dim);font-size:8px;font-weight:400;letter-spacing:0}
.market-trace-meta .up{color:var(--green)}.market-trace-meta .down{color:var(--red)}
.market-trace-empty{margin-top:12px;padding:16px;border:1px dashed var(--line);border-radius:9px;background:rgba(255,255,255,.012)}
.market-trace-empty strong{display:block;color:var(--green);font:600 19px "JetBrains Mono",monospace;letter-spacing:-.04em}
.market-trace-empty p{margin:6px 0 13px;color:var(--muted);font-size:11px;line-height:1.6}
.market-trace-rail{display:flex;align-items:center;gap:5px;height:12px}
.market-trace-rail span{height:3px;flex:1;border-radius:4px;background:var(--line)}
.market-trace-rail span:first-child{background:var(--violet);opacity:.45}
.market-trace-rail span:last-child{background:var(--green);opacity:.85;animation:signalTickerPulse 1.7s ease-in-out infinite}
.market-trace-empty small{display:block;margin-top:8px;color:var(--dim);font:500 8px "JetBrains Mono",monospace}
.market-trace-note{margin:10px 0 0;color:var(--dim);font-size:9px;line-height:1.55}
body[data-theme="light"] .market-trace{background:linear-gradient(120deg,#f5f0ff,#fff 60%,#f2fbf6);border-color:#dcd1ef}
body[data-theme="light"] .market-trace-empty{background:#ffffff7a}
@media(max-width:560px){.market-trace{padding:13px}.market-trace-meta{gap:7px}.market-trace-meta>span{font-size:7px}.market-trace-meta b{font-size:11px}.market-trace-empty strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){.market-trace-rail span:last-child{animation:none!important}}

</style>

const wireState={paused:false,ledgerOpen:false,history:readMarketWireHistory(),changedIds:new Set(),hasComparedSnapshot:false,lastSweep:null,refreshTimer:null};
function readMarketPriceTrace(){
 try{
  const saved=JSON.parse(localStorage.getItem("seer-six-price-trace-v1")||"[]");
  return Array.isArray(saved)?saved.filter(x=>x&&typeof x.key==="string"&&x.key&&x.observedAt&&!Number.isNaN(Date.parse(x.observedAt))&&Number.isFinite(Number(x.p))&&Number(x.p)>=0&&Number(x.p)<=100).slice(-1200):[];
 }catch{return []}
}
const marketTrace={samples:readMarketPriceTrace(),perMarketLimit:40};
function recordMarketPriceSnapshots(records){
 const observedAt=new Date().toISOString();
 for(const m of records||[]){
  const p=Number(m&&m.p),key=marketKey(m);
  if(!key||!Number.isFinite(p)||p<0||p>100)continue;
  let previous=null;
  for(let i=marketTrace.samples.length-1;i>=0;i--){if(marketTrace.samples[i].key===key){previous=marketTrace.samples[i];break;}}
  const elapsed=previous?Date.parse(observedAt)-Date.parse(previous.observedAt):Infinity;
  if(previous&&elapsed<45000&&Math.abs(p-Number(previous.p))<0.05)continue;
  marketTrace.samples.push({key,title:String(m.title||"Untitled market"),chain:String(m.chain||m.type||"Market"),p,observedAt});
 }
 const counts=new Map(),kept=[];
 for(const sample of [...marketTrace.samples].reverse()){
  const count=counts.get(sample.key)||0;
  if(count<marketTrace.perMarketLimit){kept.push(sample);counts.set(sample.key,count+1);}
 }
 marketTrace.samples=kept.reverse().slice(-1200);
 try{localStorage.setItem("seer-six-price-trace-v1",JSON.stringify(marketTrace.samples))}catch{}
}

const explorerFeed={status:"idle",count:0,pages:1,updatedAt:null,error:"",requestId:0};

const futarchyFeed={status:"idle",count:0,updatedAt:null,error:""};
let futarchyMarkets=[];

const htmlEscape=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const numberValue=value=>Number.isFinite(Number(value))?Number(value):0;
const compactUSD=value=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",notation:"compact",maximumFractionDigits:1}).format(numberValue(value));
const chainLabel=id=>({100:"Gnosis",10:"Optimism",8453:"Base",1:"Ethereum"}[Number(id)]||("Chain "+id));
const seerMarketHref=m=>m&&m.chainId&&((m.url||m.fullId))?"https://app.seer.pm/markets/"+encodeURIComponent(m.chainId)+"/"+encodeURIComponent(m.url||m.fullId):"";
function normalizeOutcomeProbability(raw){const n=Number(raw);if(!Number.isFinite(n))return null;return Math.max(0,Math.min(100,n>=0&&n<=1?n*100:n))}
function outcomeName(value){if(typeof value==="string"||typeof value==="number")return String(value);if(value&&typeof value==="object")return String(value.name||value.title||value.outcome||value.label||"Outcome");return "Outcome"}
function normalizeLiveMarket(m){
 const odds=Array.isArray(m.odds)?m.odds:[];
 const first=odds.find(v=>v!==null&&Number.isFinite(Number(v)));
 const probability=first===undefined?null:normalizeOutcomeProbability(first);
 const opened=Number(m.openingTs||0);
 const time=opened?new Date(opened*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}):"Not specified";
 const rawCategory=Array.isArray(m.categories)&&m.categories.length?m.categories[0]:"";
 const category=rawCategory&&String(rawCategory).toUpperCase()!=="MISC"?rawCategory:(m.type==="Futarchy"?"Futarchy":"Prediction market");
 const outcomes=Array.isArray(m.outcomes)?m.outcomes:[];
 const outcomePrices=outcomes.map((o,i)=>({name:outcomeName(o),p:i<odds.length?normalizeOutcomeProbability(odds[i]):null})).filter(o=>o.name);
 const parent=m.parentMarket||m.parentMarketId||m.parent?.id||m.conditionalParentMarket||"";
 return {id:String(m.id||"").slice(0,10)+"…",fullId:String(m.id||""),type:category,title:String(m.marketName||"Untitled market"),p:probability,volume:compactUSD(m.volumeUSD),depth:compactUSD(m.liquidityUSD),change:null,time,status:m.payoutReported?"Resolved":"Listed",chainId:Number(m.chainId||0),chain:chainLabel(m.chainId),url:String(m.url||""),liquidityUSD:numberValue(m.liquidityUSD),volumeUSD:numberValue(m.volumeUSD),outcomes,outcomePrices,verification:({verified:"Verified",verifying:"Verifying",challenged:"Challenged",not_verified:"Not verified"}[m.verification?.status]||"Not verified"),parentMarket:String(parent||""),parentOutcome:String(m.parentOutcome??m.parentOutcomeIndex??m.parent?.outcome??""),isConditional:Boolean(parent),isLive:true};
}

function marketWireTime(date){return date?date.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"WAITING FOR FIRST SNAPSHOT"}
function renderMarketWire(){
 const host=document.getElementById("marketWire");if(!host)return;
 const records=markets.filter(m=>m&&m.title).slice(0,12);
 const live=marketFeed.status==="live";
 const status=marketFeed.refreshing?"SYNCING":live?(marketFeed.error?"LAST GOOD SNAPSHOT":"CONNECTED"):marketFeed.status==="loading"?"CONNECTING":"PREVIEW DATA";
 const statusClass=marketFeed.refreshing||marketFeed.status==="loading"?"is-loading":live?(marketFeed.error?"is-stale":"is-live"):"is-preview";
 const items=records.length?records.map(m=>{
  const key=marketKey(m),price=m.p===null||m.p===undefined?"—":Math.round(m.p)+"%";
  return '<span class="wire-item '+(wireState.changedIds.has(key)?"wire-item-updated":"")+'"><span class="wire-chain">'+htmlEscape(m.chain||m.type||"Market")+'</span><span class="wire-title" title="'+htmlEscape(m.title)+'">'+htmlEscape(m.title)+'</span><strong class="wire-price">'+price+'</strong><span class="wire-metric">VOL '+htmlEscape(m.volume||"—")+'</span><span class="wire-metric">LIQ '+htmlEscape(m.depth||"—")+'</span></span>';
 }).join(""):'<span class="wire-empty">No market records have been returned yet.</span>';
 const snapshot=marketFeed.updatedAt?"UPDATED "+marketWireTime(marketFeed.updatedAt):"NO VERIFIED SNAPSHOT";
 const sweep=wireState.lastSweep?(wireState.hasComparedSnapshot?wireState.lastSweep.checked+" checked · "+(wireState.lastSweep.changed?wireState.lastSweep.changed+" repriced":"no repricing"):""+wireState.lastSweep.checked+" records · first comparison pending"):"Awaiting first sync";
 const pausedLabel=wireState.paused?"▶ Resume ticker":"Ⅱ Pause ticker";
 const historyButtonLabel="↕ Movements ("+wireState.history.length+")";
 const historyRows=wireState.history.slice(0,8).map(ev=>{
  const delta=Number(ev.toP)-Number(ev.fromP),sign=delta>0?"+":"";
  const cls=delta>=0?"up":"down",time=marketWireTime(new Date(ev.observedAt));
  return '<div class="wire-ledger-row"><div style="min-width:0"><div class="wire-ledger-market" title="'+htmlEscape(ev.title)+'">'+htmlEscape(ev.title)+'</div><div class="wire-ledger-time">'+htmlEscape(ev.chain||"Seer market")+' · observed '+htmlEscape(time)+'</div></div><div class="wire-ledger-values"><span class="from">'+Number(ev.fromP).toFixed(1)+'%</span><span class="arrow">→</span><strong class="'+cls+'">'+Number(ev.toP).toFixed(1)+'%</strong><span class="'+cls+'">'+sign+delta.toFixed(1)+' pp</span></div></div>';
 }).join("");
 const historyPanel=wireState.ledgerOpen?'<section class="wire-ledger" aria-label="Observed repricing history"><div class="wire-ledger-head"><div><div class="wire-ledger-title">OBSERVED REPRICING</div><div class="wire-ledger-note">Browser-local record of before/after prices returned by successful Seer API snapshots · not an execution or trade history</div></div><div class="wire-ledger-note">LATEST '+Math.min(8,wireState.history.length)+' / '+wireState.history.length+'</div></div>'+(historyRows?'<div class="wire-ledger-list">'+historyRows+'</div>':'<div class="wire-ledger-empty"><strong>No repricing observed yet.</strong>This log only records a market when two successful Seer responses differ by at least 0.2 percentage points. It never invents trades or fills.</div>')+'</section>':"";
 host.className="market-wire "+statusClass+(wireState.paused?" is-paused":"");
 host.setAttribute("aria-label","Seer market wire. "+status+". "+sweep+"."+(marketFeed.error?" Refresh warning: "+marketFeed.error+".":""));
 host.innerHTML=`<div class="market-wire-head"><div class="market-wire-brand"><i class="wire-status-led"></i><span>SEER WIRE</span></div><small>${status} · AUTO-REFRESH 60S</small></div><div class="market-wire-viewport" aria-label="Market snapshot tape"><div class="market-wire-track"><div class="market-wire-set">${items}</div><div class="market-wire-set" aria-hidden="true">${items}</div></div></div><div class="market-wire-tools"><div class="wire-tools-meta"><span>${snapshot}</span><span title="${htmlEscape(marketFeed.error||sweep)}">${htmlEscape(marketFeed.error?"REFRESH WARNING":sweep)}</span></div><div class="wire-tools-actions"><button class="wire-history-toggle" type="button" data-wire-action="history" aria-expanded="${wireState.ledgerOpen}">${historyButtonLabel}</button><button class="wire-refresh" type="button" data-wire-action="refresh" ${marketFeed.refreshing?"disabled":""} aria-label="Refresh market snapshot now">${marketFeed.refreshing?"↻ Syncing…":"↻ Refresh"}</button><button type="button" data-wire-action="pause" aria-pressed="${wireState.paused}">${pausedLabel}</button></div></div>${historyPanel}`;
}
async function loadLiveMarkets(){
 if(marketFeed.refreshing)return;
 marketFeed.refreshing=true;marketFeed.lastAttemptAt=new Date();renderMarketWire();
 try{
  const response=await fetch("https://app.seer.pm/.netlify/functions/markets-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chainsList:marketFeed.chains.map(String),marketStatusList:["open","answer_not_final","in_dispute"],limit:12,page:1,orderBy:"liquidityUSD",orderDirection:"desc",showConditionalMarkets:false})});
  if(!response.ok)throw new Error("Seer market endpoint returned HTTP "+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.markets))throw new Error("The Seer endpoint returned an unexpected market response");
  const live=payload.markets.map(normalizeLiveMarket).filter(m=>m.fullId&&m.title);
  if(!live.length)throw new Error("The Seer endpoint returned no market records");
  const previous=new Map(markets.filter(m=>m&&m.isLive).map(m=>[marketKey(m),m]));
  const changed=[];
  for(const m of live){const old=previous.get(marketKey(m));if(old&&old.p!==null&&old.p!==undefined&&m.p!==null&&m.p!==undefined&&Math.abs(Number(m.p)-Number(old.p))>=0.2){changed.push({market:m,old});}}
  wireState.changedIds=new Set(changed.map(x=>marketKey(x.market)));
  wireState.lastSweep={checked:live.length,changed:changed.length,at:new Date()};
  wireState.hasComparedSnapshot=previous.size>0;
  if(changed.length){
   const observedAt=new Date().toISOString();

function renderSignalDesk(){

  ?'<article class="signal-story signal-story-lead"><div class="signal-story-kicker"><i class="dot pulse-live-dot"></i>Observed repricing</div><div class="signal-story-value '+moveClass+'">'+(observedDelta>0?"+":"")+observedDelta.toFixed(1)+' pp</div><h3>'+htmlEscape(latest.title)+'</h3><p>Returned price changed from '+Number(latest.fromP).toFixed(1)+'% to '+Number(latest.toP).toFixed(1)+'% across successful snapshots. This is an observed quote difference, not a trade or an explanation for the move.</p><div class="signal-story-foot"><span>'+htmlEscape(latest.chain||"Seer market")+'</span><span>'+htmlEscape(marketWireTime(new Date(latest.observedAt)))+'</span></div><button class="signal-desk-action" type="button" onclick="go(\'app\')">Open market explorer <span aria-hidden="true">→</span></button></article>'

  :'<article class="signal-story"><div class="signal-story-kicker">Reported liquidity leader</div><div class="signal-story-value">—</div><h3>No priced sample available.</h3><p>A headline will appear when the source returns market records.</p></article>';
 const volumeCard=volumeLeader
  ?'<article class="signal-story"><div class="signal-story-kicker">Highest reported volume</div><div class="signal-story-value">'+htmlEscape(volumeLeader.volume||"—")+'</div><h3>'+htmlEscape(volumeLeader.title)+'</h3><p>Largest volume figure in the current returned sample. The source field is not labelled as a 24-hour trade tape, so no intraday claim is inferred.</p><div class="signal-story-foot"><span>'+htmlEscape(volumeLeader.chain||"Unknown network")+'</span><span>'+(live?"API record":"Preview sample")+'</span></div><button class="signal-desk-action" type="button" onclick="go(\'app\')">Open market explorer <span aria-hidden="true">→</span></button></article>'
  :'<article class="signal-story"><div class="signal-story-kicker">Highest reported volume</div><div class="signal-story-value">—</div><h3>No volume record available.</h3><p>The source has not returned enough information to rank activity.</p></article>';

 const briefItems='<span class="signal-ticker-item"><span class="signal-ticker-kind">'+(live?"SOURCE SNAPSHOT":"PREVIEW SAMPLE")+'</span><strong>'+records.length+' returned records</strong><span class="signal-ticker-detail">'+pricedCount+' with a returned outcome price</span></span>'+movementTicker+(liquidityLeader?'<span class="signal-ticker-item"><span class="signal-ticker-kind">LIQUIDITY LEADER</span><strong>'+htmlEscape(liquidityLeader.title)+'</strong><span class="signal-ticker-detail">'+htmlEscape(liquidityLeader.depth||"—")+' reported liquidity</span></span>':"")+(volumeLeader?'<span class="signal-ticker-item"><span class="signal-ticker-kind">VOLUME LEADER</span><strong>'+htmlEscape(volumeLeader.title)+'</strong><span class="signal-ticker-detail">'+htmlEscape(volumeLeader.volume||"—")+' returned volume</span></span>':"");

function setExplorerFilter(kind,value){
 if(kind==="search")state.search=String(value||"");
 else if(kind==="filter")state.filter=String(value||"All markets");
 else if(kind==="sort")state.sort=["liquidityUSD","volumeUSD","openingTs"].includes(value)?value:"liquidityUSD";
 else if(kind==="network")state.network=["all","100","10","8453","1"].includes(value)?value:"all";
 state.explorerPage=1;
 if(state.watchlistOnly){render();return;}
 explorerFeed.requestId++;explorerFeed.status="loading";explorerFeed.error="";
 render();
 if(explorerSearchTimer)clearTimeout(explorerSearchTimer);
 explorerSearchTimer=setTimeout(()=>loadExplorerMarkets(),kind==="search"?360:0);
}
function setExplorerPage(page){
 const max=explorerFeed.pages||1;
 state.explorerPage=Math.max(1,Math.min(max,Number(page)||1));
 explorerFeed.status="loading";explorerFeed.error="";
 render();loadExplorerMarkets();
}
function resetExplorerFilters(){
 state.search="";state.filter="All markets";state.network="all";state.sort="liquidityUSD";state.explorerPage=1;
 explorerFeed.requestId++;explorerFeed.status="loading";explorerFeed.error="";render();loadExplorerMarkets();
}
async function loadExplorerMarkets(){
 if(state.watchlistOnly)return;
 const requestId=++explorerFeed.requestId;
 explorerFeed.status="loading";explorerFeed.error="";
 if(explorerSearchTimer){clearTimeout(explorerSearchTimer);explorerSearchTimer=null;}
 const chains=state.network==="all"?marketFeed.chains.map(String):[state.network];
 const body={chainsList:chains,marketStatusList:["open","answer_not_final","in_dispute"],limit:12,page:state.explorerPage,orderBy:state.sort,orderDirection:"desc",showConditionalMarkets:false};
 if(state.search.trim())body.marketName=state.search.trim();
 if(state.filter!=="All markets")body.categoryList=[state.filter];
 if(state.page==="app")render();
 try{
  const response=await fetch("https://app.seer.pm/.netlify/functions/markets-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!response.ok)throw new Error("Seer search returned HTTP "+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.markets))throw new Error("Unexpected market-search response");
  if(requestId!==explorerFeed.requestId)return;
  explorerMarkets=payload.markets.map(normalizeLiveMarket).filter(m=>m.fullId&&m.title);
  recordMarketPriceSnapshots(explorerMarkets);
  explorerFeed.status="live";explorerFeed.count=Number(payload.count)||0;explorerFeed.pages=Math.max(1,Number(payload.pages)||Math.ceil(explorerFeed.count/12)||1);explorerFeed.updatedAt=new Date();explorerFeed.error="";
  if(state.explorerPage>explorerFeed.pages){state.explorerPage=explorerFeed.pages;loadExplorerMarkets();return;}
 }catch(error){
  if(requestId!==explorerFeed.requestId)return;
  explorerFeed.status="fallback";explorerFeed.error=error&&error.message?error.message:"The full market index could not be loaded";explorerFeed.count=markets.length;explorerFeed.pages=1;explorerMarkets=[];
 }
 if(state.page==="app")render();
}const forecasts=[{name:"Submission A · Open-source tooling",p:72,low:60,high:81,signal:"Strongest forecast"},{name:"Submission B · Public-goods analytics",p:61,low:47,high:72,signal:"Competitive"},{name:"Submission C · Developer education",p:48,low:34,high:62,signal:"High uncertainty"},{name:"Submission D · Infrastructure research",p:39,low:25,high:54,signal:"High uncertainty"}];
function renderDeep(){
 const records=sortedSpecialistMarkets(markets).slice(0,6);
 const priced=records.filter(m=>m.p!==null&&m.p!==undefined);
 const lead=priced[0]||records[0]||null;
 const maxPrice=priced.reduce((best,m)=>!best||Number(m.p)>Number(best.p)?m:best,null);
 const live=marketFeed.status==="live";
 const list=records.length?records.map((m,i)=>'<div class="forecast-live-row"><div class="forecast-rank">0'+(i+1)+'</div><div class="forecast-live-copy"><strong>'+htmlEscape(m.title)+'</strong><span>'+htmlEscape(m.chain||"Unknown network")+' · '+htmlEscape(m.type||"Market")+' · Volume '+htmlEscape(m.volume||"—")+' · Liquidity '+htmlEscape(m.depth||"—")+'</span></div><div class="forecast-live-price">'+(m.p===null||m.p===undefined?"—":Math.round(m.p)+"%")+'</div></div>').join(""):'<div class="notice">No market records are available yet.</div>';
 return '<div class="crumb">SEER / DEEP FORECASTS</div><div class="headrow"><div><div class="eyebrow">03 / Multi-outcome intelligence</div><h1 class="heading">Look beyond the leading outcome.</h1><p class="intro">Inspect the prices Seer actually returned, compare current outcomes, and examine the volume and liquidity behind each signal. A market price is not the same thing as a calibrated forecast.</p></div><span class="pill violet">Deep</span></div>'+renderPageVisual("deep","FORECAST SIGNAL / 03","Several outcomes can be plausible.","Read prices alongside source depth, outcome coverage and evidence limits.")+'<div class="grid stats">'+stat("Records in this view",String(records.length),live?"Current Seer market response":"Clearly labelled demo fallback")+stat("Highest returned price",maxPrice&&maxPrice.p!==null&&maxPrice.p!==undefined?Math.round(maxPrice.p)+"%":"—",maxPrice?maxPrice.title.slice(0,46):"No priced record")+stat("Data connection",live?"Connected":"Fallback",live?"Seer markets-search response":"Not live data")+'</div><div class="grid two"><section class="panel deep-live-panel"><div class="sectionhead" style="margin-top:0"><div><h2>Live market signal field</h2><p>Records sorted by reported liquidity</p></div><span class="pill '+(live?"pill-live":"")+'">'+(live?"Live records":"Demo sample")+'</span></div><div class="forecast-live-list">'+list+'</div><p class="muted specialist-source-note">'+(live?"Prices and liquidity are from the current Seer API response.":"The source did not return live data; this list is a demo sample, not a current quote.")+'</p></section><section class="panel deep-distribution-panel"><div class="sectionhead" style="margin-top:0"><div><h2>Returned outcome prices</h2><p>'+(lead?htmlEscape(lead.title):"No reference record")+'</p></div><span class="pill">Source fields only</span></div>'+(lead?marketOutcomeDistribution(lead):'<div class="notice">No reference record is available.</div>')+'<div class="evidence"><div class="evidenceitem"><strong>Price</strong><span>Read the percentage as a market quote for the returned outcome, not a guarantee.</span></div><div class="evidenceitem"><strong>Liquidity</strong><span>Thin reported liquidity can make a displayed price less useful as an execution reference.</span></div><div class="evidenceitem"><strong>Missing values</strong><span>No uncertainty range is displayed unless the API returns enough information to calculate it.</span></div></div></section></div>'+section("Evaluator evidence","Use a price to focus the review, then investigate the underlying evidence.")+'<div class="grid three">'+[["Track record","Verify delivery against commitments using independent evidence."],["Adoption","Distinguish active use from sign-ups, impressions or self-reported reach."],["Execution risk","Review dependencies, maintenance, security and delivery feasibility."]].map((x,i)=>'<div class="panel"><div class="category">REVIEW LENS 0'+(i+1)+'</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join("")+'</div>'+evidenceRail("Forecast evidence & data limits");
}

function renderFutarchy(){
 const reference=currentFutarchyReference();
 const candidates=sortedSpecialistMarkets(markets);
 const conditional=futarchyFeed.status==="live"?futarchyMarkets.filter(m=>m.isConditional||m.parentMarket):[];
 const parentGroups={};conditional.forEach(m=>{const k=m.parentMarket||"unlinked";if(!parentGroups[k])parentGroups[k]=[];parentGroups[k].push(m)});
 const paired=Object.entries(parentGroups).filter(x=>x[0]!=="unlinked"&&x[1].length>1);
 const conditionalRows=conditional.slice(0,8).map((m,i)=>'<div class="forecast-live-row"><div class="forecast-rank">0'+(i+1)+'</div><div class="forecast-live-copy"><strong>'+htmlEscape(m.title)+'</strong><span>'+htmlEscape(m.chain)+' · Parent '+htmlEscape(m.parentMarket.slice(0,14)||"not returned")+' · '+htmlEscape(m.verification)+'</span></div><div class="forecast-live-price">'+(m.p===null||m.p===undefined?"—":Math.round(m.p)+"%")+'</div></div>').join("");
 const adjusted=reference&&reference.p!==null&&reference.p!==undefined?Math.round(Math.max(0,Math.min(100,Number(reference.p)+(state.pass?1:-1)*Number(state.scenarioDelta||0))))+"%":"—";
 const opts=candidates.map(m=>'<option value="'+htmlEscape(marketKey(m))+'" '+(reference&&marketKey(m)===marketKey(reference)?"selected":"")+'>'+htmlEscape(m.title.slice(0,90))+'</option>').join("");
 return '<div class="crumb">SEER / FUTARCHY</div><div class="headrow"><div><div class="eyebrow">04 / Conditional outcomes</div><h1 class="heading">Price the consequences,<br>not just the vote.</h1><p class="intro">Start from a current Seer market quote, then make the consequence assumption explicit. Actual conditional-market records are listed separately when the API returns them; the what-if adjustment below is not a Seer forecast.</p></div><span class="pill violet">Futarchy</span></div>'+renderPageVisual("futarchy","CONDITIONAL PATHS / 04","One proposal. Two possible states.","Separate an actual conditional-market quote from the human assumption about how a proposal may shift it.")+'<div class="grid stats">'+stat("Reference markets",String(candidates.length),marketFeed.status==="live"?"Current Seer response":"Demo fallback")+stat("Conditional records",String(conditional.length),futarchyFeed.status==="live"?"Conditional query completed":futarchyFeed.status==="loading"?"Loading conditional query":"No live conditional records")+stat("Scenario adjustment",(Number(state.scenarioDelta)>0?"+":"")+Number(state.scenarioDelta||0)+" pp","User-defined what-if input")+'</div><section class="panel futarchy-workbench"><div class="sectionhead" style="margin-top:0"><div><div class="category">SCENARIO BUILDER / LIVE REFERENCE</div><h2>Anchor the what-if to a market quote</h2><p>Select a returned Seer record, then adjust the assumed shift. Only the baseline price is sourced from Seer.</p></div><span class="pill '+(marketFeed.status==="live"?"pill-live":"")+'">'+(marketFeed.status==="live"?"Live baseline":"Demo baseline")+'</span></div><div class="field"><label for="futarchyMarketSelect">Reference market</label><select id="futarchyMarketSelect" onchange="state.futarchyMarketId=this.value;render()">'+opts+'</select></div><div class="scenario-controls"><div class="scenario-toggle"><button class="button '+(state.pass?"primary":"secondary")+'" onclick="state.pass=true;render()">If proposal passes</button><button class="button '+(!state.pass?"primary":"secondary")+'" onclick="state.pass=false;render()">If proposal fails</button></div><div class="field"><label for="scenarioDelta">Assumed price shift: <strong id="scenarioDeltaLabel">'+(Number(state.scenarioDelta)>0?"+":"")+Number(state.scenarioDelta||0)+' percentage points</strong></label><input type="range" id="scenarioDelta" min="0" max="25" step="1" value="'+Number(state.scenarioDelta||0)+'" oninput="state.scenarioDelta=Number(this.value);document.getElementById(\'scenarioDeltaLabel\').textContent=(this.value>0?\'+\':\'\')+this.value+\' percentage points\';updateFutarchyScenario()"></div></div><div class="scenario-value-grid"><div class="scenario-value-card"><span>Current Seer reference price</span><strong>'+(reference&&reference.p!==null&&reference.p!==undefined?Math.round(reference.p)+"%":"—")+'</strong><small>'+htmlEscape(reference?reference.title:"No market selected")+'</small></div><div class="scenario-value-card adjusted"><span>What-if adjusted value</span><strong id="futarchyScenarioValue">'+adjusted+'</strong><small id="futarchyScenarioLabel">'+(reference&&reference.p!==null&&reference.p!==undefined?((state.pass?"Pass":"Fail")+" assumption applied to a "+Math.round(reference.p)+"% market price."):"The selected record has no returned price.")+'</small></div></div><p class="notice">This is sensitivity analysis, not an actual conditional price or predicted causal effect. Change the assumption to test how sensitive the decision is to the chosen shift.</p></section><section class="panel conditional-live-panel"><div class="sectionhead" style="margin-top:0"><div><h2>Returned conditional markets</h2><p>Records from a separate query that includes conditional markets</p></div><span class="pill">'+(futarchyFeed.status==="loading"?"Fetching":futarchyFeed.status==="live"?"API response":"No live result")+'</span></div>'+(conditional.length?'<div class="forecast-live-list">'+conditionalRows+'</div>':'<div class="notice">'+htmlEscape(futarchyFeed.status==="loading"?"The conditional-market query is running.":futarchyFeed.status==="fallback"?("No conditional records could be loaded: "+futarchyFeed.error):"The Seer API has not returned identifiable parent-linked conditional markets for this request. The scenario builder above remains explicitly hypothetical.")+'</div>')+(paired.length?'<div class="notice">Potential parent-linked groups: '+paired.map(x=>htmlEscape(x[1][0].title)+' ('+x[1].length+' records)').join(" · ")+'</div>':'')+'</section>'+section("Questions to resolve before voting","Use a conditional price as input, not the complete governance decision.")+'<div class="grid three">'+[["Metric definition","Specify the measurable success outcome before comparing scenarios."],["Comparable windows","Use consistent time frames, data sources and resolution rules."],["Opportunity cost","Consider budget trade-offs, implementation quality and external conditions."]].map((x,i)=>'<div class="panel"><div class="category">GOVERNANCE CHECK 0'+(i+1)+'</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join("")+'</div>'+evidenceRail("Conditional-market evidence");
}

function renderOpportunity(){
 const records=sortedSpecialistMarkets(markets);
 const top=records.slice(0,8);
 const activity=top.map(m=>({m,score:marketActivityScore(m,records)}));
 const rows=activity.map((x,i)=>'<tr><td><div class="opportunity-market-title"><span class="forecast-rank">0'+(i+1)+'</span><div><strong>'+htmlEscape(x.m.title)+'</strong><small>'+htmlEscape(x.m.chain)+' · '+htmlEscape(x.m.type)+'</small></div></div></td><td><strong class="table-price">'+(x.m.p===null||x.m.p===undefined?"—":Math.round(x.m.p)+"%")+'</strong></td><td>'+htmlEscape(x.m.volume||"—")+'</td><td>'+htmlEscape(x.m.depth||"—")+'</td><td><div class="activity-score"><strong>'+x.score+'</strong><span><i style="width:'+x.score+'%"></i></span></div></td><td><span class="pill">'+htmlEscape(x.m.verification||"Not verified")+'</span></td><td><button class="market-action-link" type="button" data-market-action="inspect" data-market-id="'+htmlEscape(marketKey(x.m))+'">Inspect ↗</button></td></tr>').join("");
 const maxScore=activity.length?Math.max(...activity.map(x=>x.score)):0;
 const live=marketFeed.status==="live";
 return '<div class="crumb">SEER / OPPORTUNITY MARKETS</div><div class="headrow"><div><div class="eyebrow">05 / Market discovery</div><h1 class="heading">Find the signal.<br>Keep the review fair.</h1><p class="intro">Surface active markets with real reported depth and volume. This ranks market activity in the current response; it does not predict whether a grant, applicant or proposal should win.</p></div><span class="pill violet">Opportunities</span></div>'+renderPageVisual("opportunity","REVIEW FIELD / 05","Activity helps focus attention.","Use source coverage and liquidity to decide what to inspect next, not who deserves a decision.")+'<div class="grid stats">'+stat("Markets in sample",String(records.length),live?"Current Seer response":"Demo fallback")+stat("Top activity index",String(maxScore)+"/100","Relative to current sample")+stat("Final authority","Human","No automatic ranking of people")+'</div><section class="panel opportunity-live-panel"><div class="sectionhead" style="margin-top:0"><div><h2>Market activity ledger</h2><p>Most liquid records in the loaded result set, with source links and verification status</p></div><span class="pill '+(live?"pill-live":"")+'">'+(live?"Live Seer records":"Demo sample")+'</span></div><div class="tablewrap"><table><thead><tr><th>Market</th><th>Implied price</th><th>Volume</th><th>Liquidity</th><th>Activity index</th><th>Verification</th><th>Inspect</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="muted specialist-source-note">Activity index = 60% relative reported liquidity + 40% relative volume among the current returned records. It is a display heuristic created by this interface—not a Seer field and not a selection probability.</p></section>'+section("Reviewer safeguards","Market popularity and liquidity are not measures of submission quality.")+'<div class="grid three">'+[["Blind review","Keep market activity separate from initial independent assessment."],["Conflict checks","Declare conflicts and investigate coordinated activity."],["Audit trail","Record rubric scores, rationale and the final human decision."]].map((x,i)=>'<div class="panel"><div class="category">SAFEGUARD 0'+(i+1)+'</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join("")+'</div><div class="notice">'+(live?"Market fields in the ledger are derived from the live Seer API.":"The ledger currently uses a demo sample because the live API is unavailable.")+' Activity ranks must not be used to judge people or predict actual grant outcomes.</div>'+evidenceRail("Opportunity signal integrity");
}

function renderRisk(){
 const records=sortedSpecialistMarkets(markets).slice(0,8);
 const maxL=Math.max(1,...records.map(m=>marketMoneyMetric(m,"liquidity")));
 const maxV=Math.max(1,...records.map(m=>marketMoneyMetric(m,"volume")));
 const rows=records.map((m,i)=>{const liq=marketMoneyMetric(m,"liquidity"),vol=marketMoneyMetric(m,"volume");const depth=100*Math.min(1,liq/maxL),turnover=100*Math.min(1,vol/maxV);const severity=m.p===null||m.p===undefined?null:Math.min(100,Math.max(0,Math.round(Math.abs(50-Number(m.p))*2)));return '<article class="panel risk-market-record"><div class="risk-market-top"><span class="forecast-rank">0'+(i+1)+'</span><span class="pill">'+htmlEscape(m.chain)+'</span></div><h3>'+htmlEscape(m.title)+'</h3><div class="risk-quote-row"><span>Returned price</span><strong>'+(m.p===null||m.p===undefined?"—":Math.round(m.p)+"%")+'</strong></div><div class="risk-dimension"><div class="probrow"><span>Relative reported liquidity</span><strong>'+Math.round(depth)+'/100</strong></div><div class="bar"><span style="width:'+depth+'%;background:var(--green)"></span></div></div><div class="risk-dimension"><div class="probrow"><span>Relative reported volume</span><strong>'+Math.round(turnover)+'/100</strong></div><div class="bar"><span style="width:'+turnover+'%;background:var(--cyan,var(--violet))"></span></div></div><div class="risk-dimension"><div class="probrow"><span>Distance from a 50% price</span><strong>'+(severity===null?"Not available":severity+"/100")+'</strong></div><div class="bar"><span style="width:'+(severity===null?0:severity)+'%;background:var(--amber)"></span></div></div><div class="risk-record-foot"><span>Volume '+htmlEscape(m.volume||"—")+'</span><span>Liquidity '+htmlEscape(m.depth||"—")+'</span></div><button class="market-action-link" data-market-action="inspect" data-market-id="'+htmlEscape(marketKey(m))+'" type="button">Inspect record ↗</button></article>'}).join("");
 const pA=state.riskA,pB=state.riskB;
 const gap=Math.abs(Number(pA)-Number(pB));
 return '<div class="crumb">SEER / RISK PRICING</div><div class="headrow"><div><div class="eyebrow">06 / Comparative risk</div><h1 class="heading">Risk is multidimensional.</h1><p class="intro">Read live price, reported depth and activity side by side. The API does not supply a security-risk score or loss severity, so this view keeps observable market dimensions separate and identifies derived values as relative indicators.</p></div><span class="pill violet">Risk pricing</span></div>'+renderPageVisual("risk","EXPOSURE MAP / 06","Liquidity is part of the risk picture.","A market price without sufficient depth can be a fragile signal. These dimensions are not a protocol security audit.")+'<div class="grid stats">'+stat("Markets inspected",String(records.length),marketFeed.status==="live"?"Current Seer response":"Demo fallback")+stat("Highest reported liquidity",records[0]?records[0].depth:"—","Sorted from the loaded set")+stat("Risk model","Decomposed","No synthetic security score")+'</div><div class="grid markets risk-live-grid">'+(rows||'<div class="notice">No records available.</div>')+'</div>'+section("Sensitivity sandbox","Compare your own two risk assumptions without mistaking them for Seer market fields.")+'<div class="grid two"><section class="panel"><div class="field"><label for="riskA">Assumption A · user-defined score: <strong id="riskALabel">'+pA+'/100</strong></label><input type="range" id="riskA" min="0" max="100" value="'+pA+'" oninput="state.riskA=this.value;updateRisk()"></div><div class="field" style="margin-top:22px"><label for="riskB">Assumption B · user-defined score: <strong id="riskBLabel">'+pB+'/100</strong></label><input type="range" id="riskB" min="0" max="100" value="'+pB+'" oninput="state.riskB=this.value;updateRisk()"></div><p class="muted" style="font-size:11px;margin-top:20px">These sliders are user-defined inputs and do not alter Seer records.</p></section><section class="panel" id="riskResult"><div class="category">USER-DEFINED ASSUMPTION GAP</div><div class="outcome" id="riskGap">'+gap+' points</div><p class="muted" id="riskText">'+(gap>=25?"Material gap between the two input assumptions.":"Narrow gap between the two input assumptions.")+'</p><div class="notice">This difference is not a market-implied risk metric. Inspect live liquidity, volume, prices and resolution status independently.</div></section></div>'+evidenceRail("Risk evidence & comparability");
}

function updateRisk(){const a=Number(state.riskA),b=Number(state.riskB),g=Math.abs(a-b);const gapNode=document.getElementById("riskGap"),textNode=document.getElementById("riskText"),aNode=document.getElementById("riskALabel"),bNode=document.getElementById("riskBLabel");if(gapNode)gapNode.textContent=g+" points";if(textNode)textNode.textContent=g>=25?"Material gap between the two input assumptions.":"Narrow gap between the two input assumptions.";if(aNode)aNode.textContent=a+"/100";if(bNode)bNode.textContent=b+"/100";}

function go(page) {
  const validPages = ["home", "app", "deep", "futarchy", "opportunity", "risk"];

  if (!validPages.includes(page)) return;

  state.page = page;
  const nextHash = "#/" + page;

  if (location.hash !== nextHash) {
    history.pushState({ page }, "", nextHash);
  }

  render();
  if(page==="app")loadExplorerMarkets();if(page==="futarchy")loadFutarchyMarkets();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  const pageTitles={home:"Overview",app:"Market explorer",deep:"Deep forecasts",futarchy:"Futarchy",opportunity:"Opportunity markets",risk:"Risk pricing"};
  document.title="Seer Six — "+(pageTitles[state.page]||"Markets for better decisions");
  document.getElementById("main").dataset.page=state.page;
  const focusedId = document.activeElement && document.activeElement.id === "marketSearch" ? "marketSearch" : null;
  const caret = focusedId ? document.activeElement.selectionStart : null;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
  const views={home:renderHome,app:renderApp,deep:renderDeep,futarchy:renderFutarchy,opportunity:renderOpportunity,risk:renderRisk};
  const interfaceItems=[["home","Overview"],["app","Market explorer"],["deep","Deep forecasts"],["futarchy","Futarchy"],["opportunity","Opportunities"],["risk","Risk pricing"]];
  const logoSrc=document.querySelector(".top .logo img")?.getAttribute("src")||"";
  const footerMarkup=`<div class="site-footer-inner"><div class="footer-brand"><a class="footer-brand-lockup" href="#/home" aria-label="Seer Six home" onclick="go('home');return false"><img src="${logoSrc}" alt=""><span class="wordmark">seer</span></a><p class="footer-tagline">Every opinion has a price.<br>One protocol, six decision interfaces.</p></div><nav class="interface-nav" aria-label="Seer interfaces">${interfaceItems.map(([key,title])=>`<a class="interface-link ${key===state.page?"current":""}" href="#/${key}" data-suite-page="${key}" ${key===state.page?'aria-current="page"':""}>${title}</a>`).join("")}</nav></div><div class="site-footer-bottom"><span>SEER SIX / INTERFACE CONCEPT</span><span>${marketFeed.status==="live"?"Seer API market records · specialist scenarios remain illustrative":"Demo fallback until live market data is available"} · Not financial or governance advice</span></div>`;
  document.getElementById("main").innerHTML=views[state.page]();
  document.getElementById("siteFooter").innerHTML=footerMarkup;
  if(focusedId){
    const next=document.getElementById(focusedId);
    if(next){next.focus();if(typeof caret==="number")next.setSelectionRange(caret,caret);}
  }
}
document.getElementById("main").addEventListener("click",e=>{const b=e.target.closest("button[data-market-action]");if(!b)return;const action=b.dataset.marketAction;if(action==="save")toggleMarketWatchlist(b.dataset.marketId);else if(action==="inspect")toggleMarketDetail(b.dataset.marketId);else if(action==="compare")toggleMarketCompare(b.dataset.marketId);else if(action==="remove-compare"){state.compareMarkets=state.compareMarkets.filter(m=>marketKey(m)!==b.dataset.marketId);state.compareNotice="";render();}else if(action==="clear-compare"){state.compareMarkets=[];state.compareNotice="";render();}else if(action==="close-detail"){state.selectedMarketId=null;render();}});
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("siteFooter").addEventListener("click",e=>{const b=e.target.closest("a[data-suite-page]");if(b){e.preventDefault();go(b.dataset.suitePage)}});
render();
initializeMarketWire();
loadLiveMarkets();

function toggleTheme(){const next=document.body.dataset.theme==="light"?"dark":"light";document.body.dataset.theme=next;const b=document.getElementById("themeToggle");if(b){b.innerHTML=next==="light"?"☾ <span>Dark</span>":"☼ <span>Light</span>";b.setAttribute("aria-label","Switch to "+(next==="light"?"dark":"light")+" theme");b.title="Switch to "+(next==="light"?"dark":"light")+" theme";}}

function syncRoute() {
  const page = location.hash.replace(/^#\/?/, "");
  const validPages = [
    "home", "app", "deep",
    "futarchy", "opportunity", "risk"
  ];

  state.page = validPages.includes(page) ? page : "home";
  render();
  if(state.page==="app")loadExplorerMarkets();
  if(state.page==="futarchy")loadFutarchyMarkets();
}

window.addEventListener("popstate", syncRoute);
window.addEventListener("hashchange", syncRoute);

syncRoute();

</script>
