
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f5f0ff">
<meta name="description" content="Seer Six: six decision interfaces for exploring market signals, conditional forecasts, opportunity selection and comparative risk.">
<meta property="og:title" content="Seer Six — Markets for better decisions">
<meta property="og:description" content="Explore the signal. Inspect the evidence. Understand the limits.">
<meta property="og:type" content="website">
<title>Seer Six — Every opinion has a price</title>
<style>

:root{
  color-scheme:dark;
  --bg:#101013;
  --surface:#17171c;
  --panel:#1b1b21;
  --panel-raised:#222229;
  --line:#34343f;
  --text:#f3f1f8;
  --muted:#bbb8c7;
  --dim:#898595;
  --violet:#b7a0ff;
  --violet-strong:#8b5cf6;
  --purple:#6c2bd9;
  --green:#77ddb0;
  --amber:#f4ca83;
  --red:#ff9eaa;
  --content-gap:22px;
  --card-radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.7;
  font-synthesis:none;text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.skip-link{position:absolute;left:12px;top:-70px;z-index:30;background:var(--violet);color:#101013;border-radius:8px;padding:10px 14px;font-weight:700}
.skip-link:focus{top:12px}
.shell{min-height:100vh}
.top{
  position:sticky;top:0;z-index:10;height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 clamp(20px,4.5vw,72px);
  background:rgba(16,16,19,.94);border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-size:0}
.logo{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;overflow:hidden}
.logo img{display:block;width:30px;height:30px;object-fit:contain}
.wordmark{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:700;letter-spacing:-1.05px;line-height:1;color:var(--text)}
.brand-note{margin-left:3px;color:var(--dim);font-size:11px;letter-spacing:.02em;font-weight:500}
.topright{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
.chain{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:-.03em;color:var(--muted)}
.live{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px #8b5cf677}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:rgba(34,34,41,.6);font-size:11px;line-height:1.35;white-space:nowrap}
.pill.violet{color:#e2d7ff;background:#6c2bd91c;border-color:#a78bfa55}
.pill.green{color:var(--green)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--text);font-size:12px;font-weight:600}
.theme-toggle:hover{border-color:var(--violet)}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1760px;margin:0 auto;min-height:calc(100vh - 72px)}
.side{padding:34px 16px;border-right:1px solid var(--line)}
.side-label,.eyebrow,.category,.crumb,.statlabel,th{font-size:11px;font-weight:700;letter-spacing:.115em;text-transform:uppercase}
.side-label{padding:8px 12px 14px;color:var(--dim)}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;min-height:45px;
  padding:11px 12px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--muted);text-align:left;font-size:13px;
  font-weight:600;transition:color .16s,background .16s,border-color .16s;
}
.nav button:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.nav button.active{background:linear-gradient(100deg,#6c2bd92f,#6c2bd90b);border-color:#a78bfa4a;box-shadow:inset 2px 0 var(--violet);color:#e8ddff}
.num{width:23px;flex:0 0 23px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.nav button.active .num{color:var(--violet)}
.side-note{margin:38px 4px 0;padding:17px 16px;border:1px solid #a78bfa30;border-radius:12px;background:linear-gradient(145deg,#6c2bd919,#1b1b2100);font-size:13px;line-height:1.8;color:var(--muted)}
.side-note .eyebrow{color:var(--violet)}
.side-note p{margin:11px 0 0}
.main{min-width:0;padding:clamp(36px,4.6vw,72px) clamp(24px,5vw,82px) 42px}
.crumb{margin:0 0 26px;color:var(--dim);font-size:11px}
.eyebrow{color:var(--violet);font-size:11px;letter-spacing:.14em}
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;margin:0 0 42px}
.headrow>div{min-width:0}
.headrow>.pill{margin-top:7px}
.headrow .button{flex:0 0 auto;margin-top:9px;align-self:flex-start}
.heading,h1,h2,h3,.sectionhead h2,.market h3,.interface-nav-title{
  font-family:"Bricolage Grotesque",sans-serif;font-synthesis:none;
}
.heading{
  max-width:900px;margin:14px 0 21px;color:var(--text);
  font-size:clamp(42px,4.6vw,66px);font-weight:600;letter-spacing:-.02em;line-height:1.045;
  text-wrap:balance;
}
.intro{max-width:65ch;margin:0;color:var(--muted);font-size:17px;line-height:1.85;font-weight:400}
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:11px 16px;border:1px solid #484653;border-radius:10px;
  background:var(--panel-raised);color:var(--text);font-size:13px;font-weight:650;letter-spacing:0;
  transition:background .16s,border-color .16s,transform .16s;
}
.button:hover{transform:translateY(-1px);border-color:var(--violet)}
.button.primary{background:var(--purple);border-color:#8756f3;color:white}
.button.primary:hover{background:#7c3aed;border-color:#9d79fa}
.grid{display:grid;gap:var(--content-gap);min-width:0}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:32px 0 43px}
.panel{
  min-width:0;padding:25px 26px;border:1px solid var(--line);
  border-radius:var(--card-radius);background:var(--panel);
}
.stats .panel{padding:24px 25px;position:relative;overflow:hidden}
.stats .panel:after{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--violet-strong),transparent 78%);content:""}
.statlabel{color:var(--muted);font-size:11px;letter-spacing:.1em}
.statvalue,.prob,.outcome,.optionprob,td.num,.mono{
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
}
.statvalue{margin:15px 0 9px;font-size:clamp(26px,2.5vw,37px);font-weight:600;letter-spacing:-.06em;line-height:1.2;color:var(--text)}
.statfoot{color:var(--muted);font-size:12px;line-height:1.65}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:46px 0 19px}
.sectionhead h2{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.01em;font-weight:600}
.sectionhead p{max-width:62ch;margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
.markets{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.market{display:flex;flex-direction:column;gap:17px;min-height:224px;padding:24px;border-radius:14px;transition:border-color .17s,transform .17s,background .17s}
.market:hover{transform:translateY(-2px);border-color:#a78bfa80}
.markettop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.category{color:var(--violet);font-size:10px;letter-spacing:.12em}
.market h3{max-width:42ch;margin:0;font-size:17px;font-weight:600;line-height:1.5;letter-spacing:-.005em;color:var(--text)}
.probrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prob{font-size:37px;font-weight:600;letter-spacing:-.065em;color:var(--text);line-height:1.25}
.positive{color:var(--green)}
.muted{color:var(--muted)}
.bar{height:6px;margin-top:11px;overflow:hidden;border-radius:999px;background:#393642}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple),var(--violet))}
.marketfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:7px;color:var(--muted);font-size:12px;line-height:1.6}
.two{grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr);gap:22px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chart{position:relative;height:228px;margin-top:17px;overflow:hidden;border-radius:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#34343f 54px,#34343f 55px)}
.chart svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:15px;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:560px;border-collapse:collapse}
th{padding:16px 15px;background:#ffffff04;color:var(--dim);text-align:left;font-size:10px;letter-spacing:.1em}
td{padding:16px 15px;border-bottom:1px solid #ffffff12;color:var(--text);font-size:14px;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:#a78bfa0a}
.evidence{display:grid;gap:18px}
.evidenceitem{padding:4px 0 4px 16px;border-left:2px solid var(--violet-strong)}
.evidenceitem strong{display:block;color:var(--text);font-size:14px;font-weight:700;line-height:1.55}
.evidenceitem span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.75}
.notice{margin:24px 0;padding:16px 18px;border:1px solid #f4ca8340;border-radius:11px;background:#f4ca8309;color:#e1cca7;font-size:13px;line-height:1.8}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:650}
.field select,.field input{width:100%;min-height:46px;padding:12px 14px;border:1px solid #494654;border-radius:9px;background:#101013;color:var(--text);font-size:14px}
.field select:focus,.field input:focus{outline:2px solid var(--violet);outline-offset:2px}
input[type="range"]{padding:0!important;border:0!important;background:transparent!important;accent-color:var(--violet);cursor:ew-resize}
.outcome{font-size:34px;font-weight:600;letter-spacing:-.06em}
.optionrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.optionrow:last-child{border-bottom:0}
.optionrow strong{display:block;font-size:15px;font-weight:650;line-height:1.5}
.optionrow small{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.7}
.optionprob{font-size:26px;font-weight:600;letter-spacing:-.055em;text-align:right}
.site-footer{
  max-width:1760px;width:100%;margin:0 auto;padding:30px clamp(24px,5vw,82px) 22px;
  border-top:1px solid var(--line);background:var(--bg);
}
.site-footer-inner{display:grid;grid-template-columns:minmax(180px,.75fr) minmax(0,2fr);align-items:center;gap:34px}
.footer-brand-lockup{display:inline-flex;align-items:center;gap:9px}
.footer-brand-lockup img{width:27px;height:27px;object-fit:contain;display:block}
.footer-brand-lockup .wordmark{font-size:24px}
.footer-tagline{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.interface-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:7px 24px;padding:0;border:0}
.interface-link{display:inline-flex;align-items:center;min-height:38px;padding:7px 0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:color .16s}
.interface-link:hover{color:var(--text)}
.interface-link.current{color:var(--text);text-decoration:underline;text-decoration-color:var(--violet);text-decoration-thickness:2px;text-underline-offset:7px}
.interface-link:focus-visible{outline-offset:2px}
.site-footer-bottom{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px 22px;margin-top:22px;padding-top:15px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.7}
.site-footer-bottom span:last-child{max-width:72ch}

body[data-theme="light"]{
  color-scheme:light;--bg:#f7f7f9;--surface:#fff;--panel:#fff;--panel-raised:#f2f0f7;
  --line:#dfdde7;--text:#201b2b;--muted:#5c566b;--dim:#756f83;
  --violet:#6531c9;--violet-strong:#7845df;--purple:#6c2bd9;background:var(--bg);color:var(--text)
}
body[data-theme="light"] .top{background:rgba(255,255,255,.94);border-color:var(--line)}
body[data-theme="light"] .chain{color:var(--muted)}
body[data-theme="light"] .logo img{filter:brightness(0)}
body[data-theme="light"] .pill{background:#f3f1f8;border-color:#dfdde7;color:#5c566b}
body[data-theme="light"] .pill.violet{background:#eee7ff;border-color:#d6c7ff;color:#5125a8}
body[data-theme="light"] .theme-toggle{background:#fff;border-color:var(--line);color:var(--text)}
body[data-theme="light"] .side{background:#f7f7f9;border-color:var(--line)}
body[data-theme="light"] .nav button{color:var(--muted)}
body[data-theme="light"] .nav button:hover{background:#efedf5;border-color:#dfdde7;color:var(--text)}
body[data-theme="light"] .nav button.active{background:#eee7ff;border-color:#d6c7ff;color:#5125a8;box-shadow:inset 2px 0 #6c2bd9}
body[data-theme="light"] .side-note{background:#fff;border-color:#dfd6f5;color:var(--muted)}
body[data-theme="light"] .heading,body[data-theme="light"] .sectionhead h2,body[data-theme="light"] .market h3,body[data-theme="light"] .optionrow strong,body[data-theme="light"] .statvalue,body[data-theme="light"] .prob,body[data-theme="light"] .evidenceitem strong{color:var(--text)}
body[data-theme="light"] .intro,body[data-theme="light"] .muted,body[data-theme="light"] .statfoot,body[data-theme="light"] .marketfoot,body[data-theme="light"] .sectionhead p,body[data-theme="light"] .evidenceitem span{color:var(--muted)}
body[data-theme="light"] .button{background:#fff;border-color:#d9d6e2;color:#292333}
body[data-theme="light"] .button.primary{background:#6c2bd9;border-color:#6c2bd9;color:#fff}
body[data-theme="light"] .panel,body[data-theme="light"] .market{background:#fff;border-color:var(--line);box-shadow:0 5px 20px #21123807}
body[data-theme="light"] .stats .panel:after{background:linear-gradient(90deg,#7845df,transparent 80%)}
body[data-theme="light"] .bar{background:#e6e1ef}
body[data-theme="light"] .chart{background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#e5e1ec 54px,#e5e1ec 55px)}
body[data-theme="light"] .tablewrap{border-color:var(--line)}
body[data-theme="light"] th{background:#f5f3f8;color:#615a70}
body[data-theme="light"] td{border-bottom-color:#e9e6ef;color:#292333}
body[data-theme="light"] tbody tr:hover{background:#6c2bd908}
body[data-theme="light"] .field select,body[data-theme="light"] .field input{background:#fff;border-color:#d9d6e2;color:var(--text)}
body[data-theme="light"] .notice{background:#fff9ed;border-color:#efdfbd;color:#735927}
body[data-theme="light"] .site-footer{border-color:var(--line);background:var(--bg)}
body[data-theme="light"] .footer-brand-lockup img{filter:brightness(0)}
body[data-theme="light"] .site-footer-bottom{border-color:var(--line)}
body[data-theme="light"] .interface-link{color:#5c566b}
body[data-theme="light"] .interface-link:hover,body[data-theme="light"] .interface-link.current{color:#201b2b}
@media(max-width:1200px){
 .layout{grid-template-columns:215px minmax(0,1fr)}
 .main{padding-inline:clamp(24px,3.5vw,46px)}
}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .top{height:68px}
 .brand-note,.topright .chain{display:none}
 .side{position:sticky;top:68px;z-index:8;min-height:0;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);background:rgba(16,16,19,.96);backdrop-filter:blur(16px)}
 .side-label,.side-note{display:none}
 .nav{flex-direction:row;gap:5px;overflow-x:auto;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav button{width:auto;min-width:max-content;min-height:40px;padding:9px 11px;font-size:12px}
 .num{display:none}
 .main{padding-top:40px}
 .heading{font-size:clamp(40px,6.2vw,55px)}
 .intro{font-size:16px;line-height:1.8}
 .headrow{gap:18px;margin-bottom:34px}
 .stats{gap:13px;margin:24px 0 34px}
 .stats .panel{padding:19px}
 .panel{padding:22px}
 .market{padding:21px}
 .sectionhead{margin-top:38px}
 .two{grid-template-columns:1fr}
}
@media(max-width:560px){
 body{font-size:15px}
 .top{height:62px;padding-inline:14px}
 .wordmark{font-size:22px}
 .logo,.logo img{width:26px;height:26px}
 .logo{flex-basis:26px}
 .topright{gap:7px}
 .topright .pill{font-size:9px;padding:5px 7px}
 .theme-toggle{min-height:31px;padding:5px 8px;font-size:11px}
 .theme-toggle span{display:none}
 .side{top:62px;padding:7px 8px}
 .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
 .nav button{justify-content:flex-start;min-width:0;min-height:36px;white-space:normal;padding:7px 6px;font-size:10px;line-height:1.25;gap:5px}
 .main{padding:30px 16px 28px}
 .crumb{margin-bottom:19px}
 .heading{margin:12px 0 17px;font-size:clamp(35px,9.7vw,44px);line-height:1.09;letter-spacing:-.015em}
 .intro{font-size:15px;line-height:1.8}
 .headrow{gap:12px;margin-bottom:28px}
 .headrow .button{margin-top:2px}
 .stats,.markets,.three{grid-template-columns:1fr}
 .stats{gap:11px;margin:23px 0 32px}
 .stats .panel{padding:17px 18px}
 .statvalue{margin:11px 0 6px;font-size:28px}
 .sectionhead{align-items:flex-start;flex-direction:column;gap:6px;margin:34px 0 15px}
 .sectionhead h2{font-size:20px}
 .grid{gap:14px}
 .panel,.market{padding:19px;border-radius:13px}
 .market{min-height:0;gap:15px}
 .market h3{font-size:16px}
 .prob{font-size:32px}
 .marketfoot{flex-wrap:wrap;font-size:11px}
 .chart{height:190px}
 .formrow{grid-template-columns:1fr}
 .optionrow{gap:12px;padding:16px 0}
 .optionrow strong{font-size:14px}
 .optionrow small{font-size:12px;line-height:1.6}
 .optionprob,.outcome{font-size:22px}
 .site-footer{padding:24px 17px 18px}
 .site-footer-inner{grid-template-columns:1fr;gap:20px}
 .footer-brand-lockup .wordmark{font-size:22px}
 .footer-tagline{margin-top:5px;font-size:12px}
 .interface-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));justify-content:start;gap:0 18px;padding:8px 0}
 .interface-link{min-width:0;min-height:40px;white-space:normal;padding:10px 0;font-size:12px}
 .interface-link:nth-child(-n+4){border-bottom:1px solid var(--line)}
 .site-footer-bottom{display:block;margin-top:12px;padding-top:12px;font-size:10px}
 .site-footer-bottom span{display:block;margin-top:5px}
 body[data-theme="light"] .interface-link:nth-child(-n+4){border-bottom-color:var(--line)}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* Electric Foundation art direction — purposeful texture and signal visuals, while preserving every original interface section. */
:root{--bg:#141223;--surface:#19172a;--panel:#1c1a30;--panel-raised:#242139;--line:#39334f;--text:#efe9fc;--muted:#b9b1cc;--dim:#8d86a3;--violet:#c0a7ff;--violet-strong:#a18aff;--purple:#7d33ff}
body{background:radial-gradient(ellipse at 78% -10%,rgba(125,51,255,.13),transparent 42%),radial-gradient(ellipse at 2% 40%,rgba(87,63,150,.07),transparent 38%),var(--bg)}

.market-wire-set{display:flex;flex:none;align-items:stretch}

.signal-desk{margin:22px 0 28px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(115deg,rgba(125,51,255,.09),rgba(27,26,43,.82) 46%,rgba(119,221,176,.035));box-shadow:inset 0 1px rgba(255,255,255,.035),0 16px 35px rgba(0,0,0,.08)}

@keyframes marketWireRun{to{transform:translateX(-50%)}}

@media(max-width:1100px){.market-wire{grid-template-columns:125px minmax(0,1fr)}.market-wire-tools{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;border-left:0;border-top:1px solid var(--line);padding:8px 12px}.wire-item{min-height:57px;padding:9px 13px}}
@media(max-width:600px){.market-wire{grid-template-columns:1fr;margin-bottom:17px}.market-wire-head{flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line);padding:10px 13px}.market-wire-tools{align-items:flex-start;flex-direction:column;gap:7px}.wire-item{gap:7px;padding:9px 11px}.wire-title{max-width:155px}.wire-metric{font-size:8px}.wire-tools-meta{white-space:normal;line-height:1.5}}

/* Editorial motion layer: the desk moves because its source-backed briefing is refreshed. */
.signal-desk{position:relative;background:linear-gradient(115deg,rgba(125,51,255,.12),rgba(27,26,43,.82) 43%,rgba(119,221,176,.05));}
.signal-desk::before{content:"";display:block;position:absolute;z-index:1;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(192,167,255,.95) 24%,rgba(119,221,176,.6) 78%,transparent);pointer-events:none}
.signal-desk-head{background:linear-gradient(100deg,rgba(125,51,255,.075),transparent 65%)}
.signal-ticker{position:relative;display:grid;grid-template-columns:134px minmax(0,1fr);align-items:stretch;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(125,51,255,.105),rgba(27,26,43,.12) 44%,rgba(119,221,176,.045))}
.signal-ticker-label{display:flex;align-items:center;gap:8px;padding:12px 14px;border-right:1px solid var(--line);background:rgba(125,51,255,.075);color:var(--text);font:800 9px "JetBrains Mono",monospace;letter-spacing:.13em;white-space:nowrap}
.signal-ticker-label small{margin-left:auto;color:var(--dim);font:500 7px "JetBrains Mono",monospace;letter-spacing:.08em}
.signal-ticker-live-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(119,221,176,.75);animation:signalTickerPulse 1.7s ease-in-out infinite}
.signal-ticker-viewport{min-width:0;overflow:hidden;align-self:stretch;mask-image:linear-gradient(90deg,transparent,black 2%,black 98%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,black 2%,black 98%,transparent)}
.signal-ticker-track{display:flex;width:max-content;min-height:48px;align-items:stretch;will-change:transform;animation:signalTickerRun 39s linear infinite}
.signal-ticker:hover .signal-ticker-track,.signal-ticker:focus-within .signal-ticker-track{animation-play-state:paused}
.signal-ticker-set{display:flex;flex:none;align-items:stretch}
.signal-ticker-item{display:flex;align-items:center;gap:9px;max-width:none;padding:9px 19px;border-right:1px solid var(--line);white-space:nowrap}
.signal-ticker-kind{color:var(--violet);font:700 8px "JetBrains Mono",monospace;letter-spacing:.1em}
.signal-ticker-item strong{max-width:290px;overflow:hidden;text-overflow:ellipsis;color:var(--text);font:600 10px "DM Sans",sans-serif}
.signal-ticker-detail{color:var(--muted);font:500 8px "JetBrains Mono",monospace}
.signal-story{transition:background .2s ease,box-shadow .2s ease}
.signal-story:hover{background-color:rgba(192,167,255,.045);box-shadow:inset 0 1px rgba(192,167,255,.08)}
.signal-story-empty .signal-story-value{color:var(--green);letter-spacing:-.055em;font-size:clamp(25px,2.4vw,34px)}
@keyframes signalTickerRun{to{transform:translateX(-50%)}}
@keyframes signalTickerPulse{0%,100%{opacity:1;box-shadow:0 0 11px rgba(119,221,176,.72)}50%{opacity:.45;box-shadow:0 0 2px rgba(119,221,176,.2)}}
@media(max-width:820px){.signal-ticker{grid-template-columns:1fr}.signal-ticker-label{padding:9px 14px;border-right:0;border-bottom:1px solid var(--line)}.signal-ticker-label small{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.signal-ticker-track,.signal-ticker-live-dot{animation:none!important;transform:none!important;will-change:auto}.signal-story{transition:none!important}}


/* Evidence trace — compact chart of observations actually captured in this browser. */
.market-trace{margin-top:15px;padding:16px 17px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(120deg,rgba(125,51,255,.075),rgba(27,26,43,.24) 60%,rgba(119,221,176,.025))}
.market-trace-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.market-trace-head h3{margin:5px 0 0;color:var(--text);font:600 15px/1.25 "Bricolage Grotesque",sans-serif;letter-spacing:-.015em}
.market-trace-count{padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font:600 8px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.market-trace-chart{margin-top:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(183,160,255,.04),transparent)}
.market-trace-chart svg{display:block;width:100%;height:auto;max-height:108px}
.market-trace-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.market-trace-meta>span{display:flex;flex-direction:column;gap:4px;color:var(--dim);font:600 8px "JetBrains Mono",monospace;letter-spacing:.07em}
.market-trace-meta b{font-size:12px;color:var(--text);font-weight:700;letter-spacing:0}

.market-trace-meta .up{color:var(--green)}.market-trace-meta .down{color:var(--red)}

.market-trace-empty strong{display:block;color:var(--green);font:600 19px "JetBrains Mono",monospace;letter-spacing:-.04em}
.market-trace-empty p{margin:6px 0 13px;color:var(--muted);font-size:11px;line-height:1.6}
.market-trace-rail{display:flex;align-items:center;gap:5px;height:12px}
.market-trace-rail span{height:3px;flex:1;border-radius:4px;background:var(--line)}
.market-trace-rail span:first-child{background:var(--violet);opacity:.45}
.market-trace-rail span:last-child{background:var(--green);opacity:.85;animation:signalTickerPulse 1.7s ease-in-out infinite}
.market-trace-empty small{display:block;margin-top:8px;color:var(--dim);font:500 8px "JetBrains Mono",monospace}
.market-trace-note{margin:10px 0 0;color:var(--dim);font-size:9px;line-height:1.55}
body[data-theme="light"] .market-trace{background:linear-gradient(120deg,#f5f0ff,#fff 60%,#f2fbf6);border-color:#dcd1ef}
body[data-theme="light"] .market-trace-empty{background:#ffffff7a}
@media(max-width:560px){.market-trace{padding:13px}.market-trace-meta{gap:7px}.market-trace-meta>span{font-size:7px}.market-trace-meta b{font-size:11px}.market-trace-empty strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){.market-trace-rail span:last-child{animation:none!important}}


/* Opportunity Decision Lab — source-priced scenario, never an order ticket. */
.opportunity-lab{margin:18px 0 24px;overflow:hidden;border-color:color-mix(in srgb,var(--violet) 24%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 7%,var(--panel)),var(--panel) 52%,color-mix(in srgb,var(--green) 4%,var(--panel)))}
.opportunity-lab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:23px 24px 18px;border-bottom:1px solid var(--line)}
.opportunity-lab-head h2{margin:5px 0 5px;font-size:clamp(20px,2vw,26px);letter-spacing:-.035em}
.opportunity-lab-head p{margin:0;color:var(--muted);font-size:12px;max-width:64ch}
.lab-live-mark{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:600 8px "JetBrains Mono",monospace;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}

.lab-field{margin-bottom:20px}
.lab-field:last-child{margin-bottom:0}
.lab-field label,.lab-field .field-label{display:block;margin-bottom:8px;color:var(--muted);font:600 9px "JetBrains Mono",monospace;letter-spacing:.11em;text-transform:uppercase}
.lab-select,.lab-number{display:block;width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);background:var(--surface);outline:none;font:500 12px "DM Sans",sans-serif}
.lab-select:focus-visible,.lab-number:focus-visible,.lab-range:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.lab-side-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lab-side-button{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);color:var(--muted);font:700 11px "JetBrains Mono",monospace;transition:background .16s,border-color .16s,color .16s}
.lab-side-button span{font:500 8px "DM Sans",sans-serif;color:var(--dim)}

.lab-range-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lab-range-value{color:var(--text);font:700 15px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.lab-range{display:block;width:100%;margin:11px 0 0;accent-color:var(--violet);cursor:pointer}
.lab-hint{margin:8px 0 0;color:var(--dim);font-size:10px;line-height:1.55}
.lab-section-title{margin:0 0 14px;color:var(--muted);font:700 9px "JetBrains Mono",monospace;letter-spacing:.13em;text-transform:uppercase}
.lab-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.lab-metric{min-width:0;min-height:94px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--panel) 88%,transparent);transition:border-color .2s,background .2s}
.lab-metric-key{display:block;color:var(--dim);font:600 8px "JetBrains Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.lab-metric strong{display:block;margin-top:10px;color:var(--text);font:600 clamp(17px,2vw,23px) "JetBrains Mono",monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lab-metric small{display:block;margin-top:5px;color:var(--dim);font-size:9px;line-height:1.45}

.market-card-heading-copy{flex:1;min-width:0}
.market-card-heading .market-card-meta{margin-top:2px}
.market-avatar img{background:var(--panel-raised)}


/* Keep the market tape's subtle signal gradient in both themes. */
body[data-theme="light"] .signal-ticker.market-tape{background:linear-gradient(90deg,rgba(125,51,255,.055),#f5f3f8 44%,rgba(119,221,176,.075))}


/* Outcome-side controls: source-backed quotes, clearly marked as paper analysis. */
.market-side-picker{margin:0;padding:13px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(135deg,#7d33ff0b,transparent 65%)}
.market-side-picker-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
.market-side-picker-head>span{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.market-side-picker-head small{font:500 9px "JetBrains Mono",monospace;color:var(--dim);text-align:right}
.market-side-picker-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.market-side-choice{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px 10px;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);text-align:left;transition:transform .15s,border-color .15s,background .15s}
.market-side-choice>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}
.market-side-choice strong{font:600 15px "JetBrains Mono",monospace}
.market-side-choice i{grid-column:1/-1;font-style:normal;color:var(--dim);font-size:10px}
.market-side-choice.market-side-yes{border-color:#77ddb04a}
.market-side-choice.market-side-yes>span,.market-side-choice.market-side-yes>strong{color:var(--green)}
.market-side-choice.market-side-no{border-color:#ff9eaa4a}
.market-side-choice.market-side-no>span,.market-side-choice.market-side-no>strong{color:var(--red)}
.market-side-choice:not(:disabled):hover{transform:translateY(-1px);border-color:var(--violet);background:var(--panel-raised)}
.market-side-choice:disabled{cursor:not-allowed;opacity:.42}
.market-side-unavailable{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.market-detail,.compare-workbench{scroll-margin-top:94px}
@media(max-width:560px){.market-side-picker{padding:10px}.market-side-picker-options{gap:7px}.market-side-choice{padding:10px}.market-side-picker-head{align-items:flex-start;flex-direction:column;gap:3px}}


/* Premium art direction refresh: deeper surfaces, richer accents, less uniformity. */
:root{
  --bg:#0d1020;
  --surface:#111629;
  --panel:#171d32;
  --panel-raised:#202943;
  --line:#303b58;
  --text:#f2f6ff;
  --muted:#b4bfd8;
  --dim:#8390ad;
  --violet:#c8b5ff;
  --violet-strong:#9a7dff;
  --purple:#795dff;
  --signal-cyan:#67e6ee;
  --signal-blue:#84aaff;
  --signal-mint:#8ce3bb;
  --signal-gold:#ffc777;
  --signal-rose:#ff9ab5;
}
body{
  background:
    radial-gradient(ellipse at 83% -12%,rgba(116,88,255,.17),transparent 39%),
    radial-gradient(ellipse at -8% 37%,rgba(32,148,174,.09),transparent 36%),
    linear-gradient(180deg,#0d1020 0%,#0d1120 48%,#101426 100%);
  color:var(--text);
}
.top{
  background:rgba(13,16,32,.88);
  border-bottom-color:rgba(143,164,212,.16);
  box-shadow:0 8px 30px rgba(0,0,0,.09);
}
.side{
  background:linear-gradient(180deg,rgba(121,93,255,.065),rgba(20,28,49,.12) 52%,transparent);
  border-right-color:rgba(143,164,212,.15);
}
.main:before{
  width:100%;
  background:
    radial-gradient(ellipse at 83% 8%,rgba(121,93,255,.105),transparent 48%),
    radial-gradient(ellipse at 4% 42%,rgba(60,203,214,.035),transparent 40%),
    repeating-linear-gradient(137deg,transparent 0 42px,rgba(239,246,255,.012) 43px 44px);
}
.panel{
  border-color:rgba(143,164,212,.18);
  background:linear-gradient(145deg,rgba(29,36,61,.96),rgba(21,27,46,.99) 74%);
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 16px 42px rgba(0,0,0,.13);
}
.sectionhead{gap:22px}
.sectionhead h2{letter-spacing:-.025em}
.stats .panel{
  background:linear-gradient(145deg,rgba(31,40,68,.96),rgba(21,27,46,.98) 78%);
}
.stats .panel:nth-child(2){
  background:linear-gradient(145deg,rgba(20,48,61,.91),rgba(21,27,46,.98) 80%);
}
.stats .panel:nth-child(3){
  background:linear-gradient(145deg,rgba(48,36,73,.85),rgba(21,27,46,.98) 80%);
}
.stats .panel:after{height:2px;background:linear-gradient(90deg,var(--violet-strong),rgba(103,230,238,.4),transparent 92%)}

.stats .panel:nth-child(3):after{background:linear-gradient(90deg,var(--signal-gold),rgba(255,154,181,.35),transparent 92%)}
.market-record{
  background:linear-gradient(150deg,rgba(29,35,59,.99),rgba(19,25,43,.99) 68%)!important;

/* Market Tape is a distinct instrument panel, not another muted strip. */
.signal-ticker.market-tape{
  position:relative;
  grid-template-columns:148px minmax(0,1fr);
  overflow:hidden;
  background:linear-gradient(108deg,#102c3d 0%,#123b48 25%,#142c40 54%,#1b2340 77%,#282044 100%)!important;
  border-top:1px solid rgba(103,230,238,.28);
  border-bottom:1px solid rgba(103,230,238,.24);
  box-shadow:inset 0 1px rgba(224,252,255,.06),inset 0 -1px rgba(103,230,238,.04),0 8px 24px rgba(3,12,26,.14);
}
.signal-ticker.market-tape:before{
  content:"";position:absolute;z-index:2;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#67e6ee 0%,#8ce3bb 34%,#84aaff 70%,#c8b5ff 100%);
  pointer-events:none;
}
.signal-ticker.market-tape .signal-ticker-label{
  position:relative;
  background:linear-gradient(180deg,rgba(9,39,52,.8),rgba(13,47,59,.8))!important;
  border-right:1px solid rgba(103,230,238,.24);
  color:#e6fcff;
  font-weight:800;
}
.signal-ticker.market-tape .signal-ticker-label small{color:#8fe6e9}
.signal-ticker.market-tape .signal-ticker-live-dot{
  background:#78f2d0;box-shadow:0 0 0 4px rgba(120,242,208,.09),0 0 14px rgba(120,242,208,.5);
}
.signal-ticker.market-tape .signal-ticker-viewport{
  background:linear-gradient(90deg,rgba(103,230,238,.045),transparent 25%,rgba(132,170,255,.035));
}
.signal-ticker.market-tape .market-tape-item{
  min-height:58px;
  border-right:1px solid rgba(138,214,231,.19);
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,0));
}

const wireState={paused:false,ledgerOpen:false,history:readMarketWireHistory(),changedIds:new Set(),hasComparedSnapshot:false,lastSweep:null,refreshTimer:null};
function readMarketPriceTrace(){
 try{
  const saved=JSON.parse(localStorage.getItem("seer-six-price-trace-v1")||"[]");
  return Array.isArray(saved)?saved.filter(x=>x&&typeof x.key==="string"&&x.key&&x.observedAt&&!Number.isNaN(Date.parse(x.observedAt))&&Number.isFinite(Number(x.p))&&Number(x.p)>=0&&Number(x.p)<=100).slice(-1200):[];
 }catch{return []}
}
const marketTrace={samples:readMarketPriceTrace(),perMarketLimit:40};
function recordMarketPriceSnapshots(records){
 const observedAt=new Date().toISOString();
 for(const m of records||[]){
  const p=Number(m&&m.p),key=marketKey(m);
  if(!m||m.p===null||m.p===undefined||m.p===""||!key||!Number.isFinite(p)||p<0||p>100)continue;
  let previous=null;
  for(let i=marketTrace.samples.length-1;i>=0;i--){if(marketTrace.samples[i].key===key){previous=marketTrace.samples[i];break;}}
  const elapsed=previous?Date.parse(observedAt)-Date.parse(previous.observedAt):Infinity;
  if(previous&&elapsed<45000&&Math.abs(p-Number(previous.p))<0.05)continue;
  marketTrace.samples.push({key,title:String(m.title||"Untitled market"),chain:String(m.chain||m.type||"Market"),p,observedAt});
 }
 const counts=new Map(),kept=[];
 for(const sample of [...marketTrace.samples].reverse()){
  const count=counts.get(sample.key)||0;
  if(count<marketTrace.perMarketLimit){kept.push(sample);counts.set(sample.key,count+1);}
 }
 marketTrace.samples=kept.reverse().slice(-1200);
 try{localStorage.setItem("seer-six-price-trace-v1",JSON.stringify(marketTrace.samples))}catch{}
}

const htmlEscape=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const numberValue=value=>Number.isFinite(Number(value))?Number(value):0;
const reportedNumber=value=>value===null||value===undefined||(typeof value==="string"&&value.trim()==="")?null:(Number.isFinite(Number(value))?Number(value):null);
const compactUSD=value=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",notation:"compact",maximumFractionDigits:1}).format(numberValue(value));
const chainLabel=id=>({100:"Gnosis",10:"Optimism",8453:"Base",1:"Ethereum"}[Number(id)]||("Chain "+id));
const seerMarketHref=m=>m&&m.chainId&&((m.url||m.fullId))?"https://app.seer.pm/markets/"+encodeURIComponent(m.chainId)+"/"+encodeURIComponent(m.url||m.fullId):"";
function normalizeOutcomeProbability(raw){const n=Number(raw);if(!Number.isFinite(n))return null;return Math.max(0,Math.min(100,n>=0&&n<=1?n*100:n))}
function outcomeName(value){if(typeof value==="string"||typeof value==="number")return String(value);if(value&&typeof value==="object")return String(value.name||value.title||value.outcome||value.label||"Outcome");return "Outcome"}
function normalizeLiveMarket(m){
 const odds=Array.isArray(m.odds)?m.odds:[];
 const first=odds.find(v=>v!==null&&Number.isFinite(Number(v)));
 const probability=first===undefined?null:normalizeOutcomeProbability(first);
 const opened=Number(m.openingTs||0);
 const time=opened?new Date(opened*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}):"Not specified";
 const rawCategory=Array.isArray(m.categories)&&m.categories.length?m.categories[0]:"";
 const category=rawCategory&&String(rawCategory).toUpperCase()!=="MISC"?rawCategory:(m.type==="Futarchy"?"Futarchy":"Prediction market");
 const outcomes=Array.isArray(m.outcomes)?m.outcomes:[];
 const outcomePrices=outcomes.map((o,i)=>({name:outcomeName(o),p:i<odds.length?normalizeOutcomeProbability(odds[i]):null})).filter(o=>o.name);
 const parent=m.parentMarket||m.parentMarketId||m.parent?.id||m.conditionalParentMarket||"";
 return {id:String(m.id||"").slice(0,10)+"…",fullId:String(m.id||""),type:category,title:String(m.marketName||"Untitled market"),p:probability,volume:compactUSD(m.volumeUSD),depth:reportedNumber(m.liquidityUSD)===null?"Not reported":compactUSD(m.liquidityUSD),change:null,time,status:m.payoutReported?"Resolved":"Listed",chainId:Number(m.chainId||0),chain:chainLabel(m.chainId),url:String(m.url||""),imageUrl:marketImageUrl(m),images:m.images&&typeof m.images==="object"?m.images:null,liquidityUSD:reportedNumber(m.liquidityUSD),volumeUSD:numberValue(m.volumeUSD),outcomes,outcomePrices,verification:({verified:"Verified",verifying:"Verifying",challenged:"Challenged",not_verified:"Not verified"}[m.verification?.status]||"Not verified"),parentMarket:String(parent||""),parentOutcome:String(m.parentOutcome??m.parentOutcomeIndex??m.parent?.outcome??""),isConditional:Boolean(parent),isLive:true};
}

function marketWireTime(date){return date?date.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"WAITING FOR FIRST SNAPSHOT"}
function renderMarketWire(){
 const host=document.getElementById("marketWire");if(!host)return;
 const records=markets.filter(m=>m&&m.title).slice(0,12);
 const live=marketFeed.status==="live";
 const status=marketFeed.refreshing?"SYNCING":live?(marketFeed.error?"LAST GOOD SNAPSHOT":"CONNECTED"):marketFeed.status==="loading"?"CONNECTING":"PREVIEW DATA";
 const statusClass=marketFeed.refreshing||marketFeed.status==="loading"?"is-loading":live?(marketFeed.error?"is-stale":"is-live"):"is-preview";
 const items=records.length?records.map(m=>{
  const key=marketKey(m),rawP=m.p===null||m.p===undefined?null:Number(m.p),validP=rawP!==null&&Number.isFinite(rawP)&&rawP>=0&&rawP<=100,price=validP?Math.round(rawP)+"%":"—";
  return '<button type="button" class="wire-item '+(wireState.changedIds.has(key)?"wire-item-updated":"")+'" data-wire-action="inspect" data-market-id="'+htmlEscape(key)+'" aria-label="Inspect market: '+htmlEscape(m.title)+', price '+htmlEscape(price)+'">'+marketAvatarHTML(m,27)+'<span class="wire-market-copy"><span class="wire-chain">'+htmlEscape(m.chain||m.type||"Market")+'</span><span class="wire-title" title="'+htmlEscape(m.title)+'">'+htmlEscape(m.title)+'</span></span><strong class="wire-price">'+price+'</strong><span class="wire-metric">VOL '+htmlEscape(m.volume||"—")+'</span><span class="wire-metric">LIQ '+htmlEscape(m.depth||"—")+'</span></button>';
 }).join(""):'<span class="wire-empty">No market records have been returned yet.</span>';
 const snapshot=marketFeed.updatedAt?"LAST SNAPSHOT · "+marketWireTime(marketFeed.updatedAt):"WAITING FOR FIRST SNAPSHOT";
 const sweep=wireState.lastSweep?(wireState.hasComparedSnapshot?wireState.lastSweep.checked+" markets checked · "+(wireState.lastSweep.changed?wireState.lastSweep.changed+" price changes":"no repricing"):""+wireState.lastSweep.checked+" records · first comparison pending"):"Awaiting first sync";
 const pausedLabel=wireState.paused?"▶ Resume motion":"Ⅱ Pause motion";
 const historyButtonLabel="↕ Price changes ("+wireState.history.length+")";
 const historyRows=wireState.history.slice(0,8).map(ev=>{
  const delta=Number(ev.toP)-Number(ev.fromP),sign=delta>0?"+":"";
  const cls=delta>=0?"up":"down",time=marketWireTime(new Date(ev.observedAt));
  return '<div class="wire-ledger-row"><div style="min-width:0"><div class="wire-ledger-market" title="'+htmlEscape(ev.title)+'">'+htmlEscape(ev.title)+'</div><div class="wire-ledger-time">'+htmlEscape(ev.chain||"Seer market")+' · observed '+htmlEscape(time)+'</div></div><div class="wire-ledger-values"><span class="from">'+Number(ev.fromP).toFixed(1)+'%</span><span class="arrow">→</span><strong class="'+cls+'">'+Number(ev.toP).toFixed(1)+'%</strong><span class="'+cls+'">'+sign+delta.toFixed(1)+' pp</span></div></div>';
 }).join("");
 const historyPanel=wireState.ledgerOpen?'<section class="wire-ledger" aria-label="Observed repricing history"><div class="wire-ledger-head"><div><div class="wire-ledger-title">OBSERVED REPRICING</div><div class="wire-ledger-note">Browser-local record of before/after prices returned by successful Seer API snapshots · not an execution or trade history</div></div><div class="wire-ledger-note">LATEST '+Math.min(8,wireState.history.length)+' / '+wireState.history.length+'</div></div>'+(historyRows?'<div class="wire-ledger-list">'+historyRows+'</div>':'<div class="wire-ledger-empty"><strong>No repricing observed yet.</strong>This log only records a market when two successful Seer responses differ by at least 0.2 percentage points. It never invents trades or fills.</div>')+'</section>':"";
 host.className="market-wire "+statusClass+(wireState.paused?" is-paused":"");
 host.setAttribute("aria-label","Seer market wire. "+status+". "+sweep+"."+(marketFeed.error?" Refresh warning: "+marketFeed.error+".":""));
 host.innerHTML=`<div class="market-wire-head"><div class="market-wire-brand"><i class="wire-status-led"></i><span>SEER WIRE</span></div><small>${status} · AUTO-REFRESH 60S</small></div><div class="market-wire-viewport" aria-label="Market snapshot tape"><div class="market-wire-track"><div class="market-wire-set">${items}</div><div class="market-wire-set" aria-hidden="true" inert>${items}</div></div></div><div class="market-wire-tools"><div class="wire-tools-meta"><span>${snapshot}</span><span title="${htmlEscape(marketFeed.error||sweep)}">${htmlEscape(marketFeed.error?"REFRESH WARNING":sweep)}</span></div><div class="wire-tools-actions"><button class="wire-history-toggle" type="button" data-wire-action="history" hidden="${wireState.history.length===0}" aria-expanded="${wireState.ledgerOpen}">${historyButtonLabel}</button><button class="wire-refresh" type="button" data-wire-action="refresh" ${marketFeed.refreshing?"disabled":""} aria-label="Refresh market snapshot now">${marketFeed.refreshing?"↻ Syncing…":"↻ Refresh now"}</button><button type="button" data-wire-action="pause" aria-pressed="${wireState.paused}" title="Pauses visual motion only; market data still refreshes">${pausedLabel}</button></div></div>${historyPanel}`;
}
async function loadLiveMarkets(){
 if(marketFeed.refreshing)return;

function renderLiquidityLandscape(records,live){
 const rows=(records||[])
  .filter(m=>m&&m.p!==null&&m.p!==undefined&&Number.isFinite(Number(m.p)))
  .map(m=>{
   // Prefer the exact numeric value returned by Seer; parse compact labels only as a fallback.
   const exact=m.liquidityUSD;
   const hasExact=exact!==null&&exact!==undefined&&Number.isFinite(Number(exact))&&Number(exact)>=0;
   const raw=String(m.depth||"").replace(/[$,\s]/g,"").toUpperCase();
   const match=raw.match(/^([0-9]+(?:\.[0-9]+)?)([KMB])?$/);
   const multiplier=match?({K:1e3,M:1e6,B:1e9}[match[2]]||1):1;
   const parsed=match?Number(match[1])*multiplier:null;
   const liquidity=hasExact?Number(exact):parsed;
   const rawLabel=String(m.depth||"").trim();
   const hasRawLabel=rawLabel!==""&&rawLabel!=="—"&&rawLabel.toLowerCase()!=="not reported";
   const liquidityLabel=liquidity===null?"Not reported":(hasRawLabel?rawLabel:compactUSD(liquidity));
   return {m,p:Number(m.p),liquidity,liquidityLabel};
  })
  .sort((a,b)=>{
   if(a.liquidity===null)return b.liquidity===null?0:1;
   if(b.liquidity===null)return -1;
   return b.liquidity-a.liquidity;
  })
  .slice(0,6);
 if(!rows.length)return '<section class="panel liquidity-landscape"><div class="sectionhead"><div><h2>Liquidity landscape</h2><p>No priced records available for comparison.</p></div></div><div class="notice">The landscape appears when the source returns priced records.</div></section>';
 const reported=rows.filter(x=>x.liquidity!==null).map(x=>x.liquidity);
 const maxL=Math.max(0,...reported);
 const bars=rows.map((x,i)=>{
  const known=x.liquidity!==null;
  const width=known&&maxL>0?Math.max(0,Math.min(100,(x.liquidity/maxL)*100)):0;
  const railClass=known?"landscape-rail":"landscape-rail is-unreported";
  const railLabel=known?"Reported liquidity "+x.liquidityLabel:"Reported liquidity unavailable";
  const rail=known?'<i aria-hidden="true" style="width:'+width.toFixed(2)+'%"></i>':"";
  return '<div class="landscape-row"><div class="landscape-label"><span class="landscape-index">0'+(i+1)+'</span><strong title="'+htmlEscape(x.m.title)+'">'+htmlEscape(x.m.title)+'</strong><span class="landscape-price">'+Math.round(x.p)+'%</span></div><div class="'+railClass+'" role="img" aria-label="'+htmlEscape(railLabel)+'">'+rail+'</div><div class="landscape-meta"><span>LIQUIDITY <b>'+htmlEscape(x.liquidityLabel)+'</b></span><span>QUOTE <b>'+Math.round(x.p)+'%</b></span></div></div>';
 }).join("");
 return '<section class="panel liquidity-landscape"><div class="sectionhead"><div><div class="category">PRICE × REPORTED LIQUIDITY</div><h2>Liquidity landscape</h2><p>Compare quoted price with reported liquidity across returned records.</p></div><span class="pill">'+(live?"Source response":"Demo sample")+'</span></div><div class="landscape-legend"><span><i class="landscape-dot"></i>Liquidity · normalized to the largest reported value</span><span>Price shown separately</span></div><div class="landscape-list">'+bars+'</div><p class="muted specialist-source-note">Bars are scaled to the largest reported liquidity in this view. Unreported values stay visibly unreported, not zero. This is a snapshot comparison—not historical movement, executable depth, or a trade estimate.</p></section>';
}

function isBinaryOpportunityMarket(m){
 const outcomes=Array.isArray(m&&m.outcomes)?m.outcomes:[];
 const prices=Array.isArray(m&&m.outcomePrices)?m.outcomePrices:[];
 const fallbackRaw=m&&m.p!==null&&m.p!==undefined&&m.p!==""?Number(m.p):NaN;
 const firstRaw=prices[0]&&prices[0].p!==null&&prices[0].p!==undefined&&prices[0].p!==""?Number(prices[0].p):fallbackRaw;
 return outcomes.length===2&&Number.isFinite(firstRaw)&&firstRaw>=0&&firstRaw<=100;
}
function hasNativeBinaryPrices(m){
 const outcomes=Array.isArray(m&&m.outcomes)?m.outcomes:[];
 const values=Array.isArray(m&&m.outcomePrices)?m.outcomePrices:[];
 const price=value=>value&&value.p!==null&&value.p!==undefined&&value.p!==""?Number(value.p):NaN;
 return outcomes.length===2&&values.length>=2&&[price(values[0]),price(values[1])].every(p=>Number.isFinite(p)&&p>=0&&p<=100);
}
function canPaperFrameOutcome(m){
 const outcomes=Array.isArray(m&&m.outcomes)?m.outcomes:[];
 const first=opportunityOutcomePrice(m,0);
 return outcomes.length>=2&&Number.isFinite(first)&&first>=0&&first<=100;
}
function makeBinaryPaperProjection(m){
 if(!canPaperFrameOutcome(m))return null;
 if(m&&m.isDerivedBinaryProjection)return {...m};
 if(hasNativeBinaryPrices(m))return {...m};
 const yes=opportunityOutcomePrice(m,0);
 const sourceNames=(Array.isArray(m.outcomes)?m.outcomes:[]).map((_,i)=>opportunityOutcomeLabel(m,i)).filter(Boolean).slice(0,16);
 return {
  ...compactSavedMarket(m),
  p:yes,
  outcomes:["Yes","No"],
  outcomePrices:[{name:"Yes",p:yes},{name:"No",p:100-yes}],
  isLive:false,
  isSnapshot:true,
  isDerivedBinaryProjection:true,
  sourceWasLive:m.isLive===true||m.sourceWasLive===true,
  derivedOutcomeLabel:opportunityOutcomeLabel(m,0),
  sourceOutcomeNames:sourceNames,
  sourceReportedYesPrice:yes
 };
}
function opportunityOutcomeLabel(m,index){
 const values=Array.isArray(m&&m.outcomes)?m.outcomes:[];
 return values[index]!==undefined?outcomeName(values[index]):(index===0?"Outcome 1":"Outcome 2");
}
function opportunityOutcomePrice(m,index){
 const values=Array.isArray(m&&m.outcomePrices)?m.outcomePrices:[];
 const raw=values[index]&&values[index].p!==null&&values[index].p!==undefined?Number(values[index].p):NaN;
 if(Number.isFinite(raw)&&raw>=0&&raw<=100)return raw;
 if(index===0){const raw=m&&m.p!==null&&m.p!==undefined&&m.p!==""?Number(m.p):NaN;return Number.isFinite(raw)&&raw>=0&&raw<=100?raw:NaN;}
 if(index===1&&isBinaryOpportunityMarket(m)){const first=opportunityOutcomePrice(m,0);return Number.isFinite(first)?100-first:NaN;}
 return NaN;
}
function opportunityScenarioMarket(records){
 const source=Array.isArray(records)?records:sortedSpecialistMarkets(markets);
 let list=source.filter(isBinaryOpportunityMarket);
 if(!list.length)list=demoMarkets.filter(isBinaryOpportunityMarket);
 return list.find(m=>marketKey(m)===String(state.opportunityMarketId))||list.find(m=>Number.isFinite(opportunityOutcomePrice(m,0))&&opportunityOutcomePrice(m,0)>0)||list[0]||null;
}
function opportunityScenarioMetrics(m){
 const side=state.opportunitySide==="no"?"no":"yes";
 const rawPrice=opportunityOutcomePrice(m,0);
 const hasPrice=Number.isFinite(rawPrice)&&rawPrice>=0&&rawPrice<=100;
 const sidePrice=opportunityOutcomePrice(m,side==="no"?1:0);
 const hasSelectedPrice=Number.isFinite(sidePrice)&&sidePrice>=0&&sidePrice<=100;
 const sideBeliefRaw=state.opportunityBelief===null||state.opportunityBelief===undefined?(hasPrice?rawPrice:50):Number(state.opportunityBelief);
 const yesBelief=Math.max(0,Math.min(100,Number.isFinite(sideBeliefRaw)?sideBeliefRaw:50));
 const selectedBelief=side==="no"?100-yesBelief:yesBelief;
 const stakeRaw=Number(state.opportunityStake);
 const stake=Math.max(1,Math.min(1000000,Number.isFinite(stakeRaw)&&stakeRaw>0?stakeRaw:100));
 const entry=sidePrice/100;
 const valid=isBinaryOpportunityMarket(m)&&hasPrice&&hasSelectedPrice&&Number.isFinite(entry)&&entry>0&&entry<=1;
 const shares=valid?stake/entry:null;
 const payout=valid?shares:null;
 const profitIfCorrect=valid?payout-stake:null;
 const expected=valid?payout*(selectedBelief/100)-stake:null;
 const edge=valid?selectedBelief-sidePrice:null;
 return {m,hasPrice,marketPrice:rawPrice,side,sidePrice,yesBelief,selectedBelief,stake,valid,shares,payout,profitIfCorrect,expected,edge};
}
function opportunityUSD(n){return Number.isFinite(Number(n))?new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)):"—"}

 return '<section class="panel opportunity-lab" id="opportunityLab" aria-labelledby="opportunityLabTitle"><div class="opportunity-lab-head"><div><div class="category">DECISION LAB / 05 · THESIS VS MARKET</div><h2 id="opportunityLabTitle">Price your own thesis.</h2><p>Use the displayed market price as an entry reference, then compare it with your own probability estimate. Live records are labelled; fallback samples are not current quotes. This is a paper scenario—not an order ticket.</p>'+(useDemo?'<p class="lab-hint" style="margin-top:10px">No priceable two-outcome record is available in the current source sample. The calculator below uses clearly labelled demo values only; your market ledger remains source-based.</p>':'')+'</div><span class="lab-live-mark"><i></i>'+label+'</span></div>'+derivedFrameNotice+'<div class="opportunity-lab-grid"><div class="opportunity-lab-controls"><div class="lab-field"><label for="oppMarketSelect">Source market</label><select class="lab-select" id="oppMarketSelect" data-opportunity-field="market">'+options+'</select><p class="lab-hint">Choose among the current records in the opportunity ledger. Market selection does not alter the source quote.</p></div><div class="lab-field"><span class="field-label">Hypothetical position</span><div class="lab-side-switch"><button id="oppSideYesBtn" class="lab-side-button" type="button" data-opportunity-side="yes" data-entry-price="'+opportunityOutcomePrice(selected,0)+'" aria-pressed="'+(calc.side==='yes'?'true':'false')+'">'+htmlEscape(firstName)+' <span>Outcome 1</span></button><button id="oppSideNoBtn" class="lab-side-button" type="button" data-opportunity-side="no" data-entry-price="'+opportunityOutcomePrice(selected,1)+'" aria-pressed="'+(calc.side==='no'?'true':'false')+'">'+htmlEscape(secondName)+' <span>Outcome 2</span></button></div></div><div class="lab-field"><label for="oppStakeInput">Position size · USDC assumption</label><input class="lab-number" id="oppStakeInput" name="oppStakeInput" data-opportunity-field="stake" type="number" min="1" max="1000000" step="25" inputmode="decimal" value="'+calc.stake+'"><p class="lab-hint">Sizing input only. No wallet is connected and no capital is moved.</p></div><div class="lab-field"><div class="lab-range-row"><label id="oppBeliefLabel" for="oppBeliefInput" style="margin:0">Your independent estimate for '+htmlEscape(firstName)+'</label><output class="lab-range-value" id="oppBeliefValue">'+estimate.toFixed(0)+'%</output></div><input class="lab-range" id="oppBeliefInput" name="oppBeliefInput" data-opportunity-field="belief" type="range" min="0" max="100" step="1" value="'+estimate+'"><p class="lab-hint">Set your estimate before looking only at the price. The tool compares it with the market-implied YES probability.</p></div></div><div class="opportunity-lab-results"><div class="lab-section-title">Scenario outputs · before fees and slippage</div><div class="lab-result-grid"><div class="lab-metric"><span class="lab-metric-key">Returned outcome 1 price</span><strong id="oppMarketPrice">'+marketPrice+'</strong><small>API outcome price, where available</small></div><div class="lab-metric"><span class="lab-metric-key">Entry · selected side</span><strong id="oppEntryPrice">'+entryPrice+'</strong><small id="oppEntrySide">'+calc.side.toUpperCase()+' shares at '+(calc.side==='no'?'the complementary price':'the returned YES price')+'</small></div><div class="lab-metric"><span class="lab-metric-key">Your edge · selected side</span><strong id="oppEdgeValue" class="'+edgeTone+'">'+edgeText+'</strong><small>Independent estimate minus entry probability</small></div><div class="lab-metric"><span class="lab-metric-key">Shares at entry</span><strong id="oppSharesValue">'+sharesText+'</strong><small>Assumes each winning share pays $1</small></div><div class="lab-metric"><span class="lab-metric-key">Gross payout if correct</span><strong id="oppPayoutValue">'+payoutText+'</strong><small>Before costs; assumes $1 settlement</small></div  const maxL=Math.max(1,...records.map(m=>marketMoneyMetric(m,"liquidity")));
 const maxV=Math.max(1,...records.map(m=>marketMoneyMetric(m,"volume")));
 const rows=records.map((m,i)=>{const liq=marketMoneyMetric(m,"liquidity"),vol=marketMoneyMetric(m,"volume");const depth=100*Math.min(1,liq/maxL),turnover=100*Math.min(1,vol/maxV);const severity=m.p===null||m.p===undefined?null:Math.min(100,Math.max(0,Math.round(Math.abs(50-Number(m.p))*2)));return '<article class="panel risk-market-record"><div class="risk-market-top"><span class="forecast-rank">0'+(i+1)+'</span><span class="pill">'+htmlEscape(m.chain)+'</span></div><h3>'+htmlEscape(m.title)+'</h3><div class="risk-quote-row"><span>Returned price</span><strong>'+(m.p===null||m.p===undefined?"—":Math.round(m.p)+"%")+'</strong></div><div class="risk-dimension"><div class="probrow"><span>Relative reported liquidity</span><strong>'+Math.round(depth)+'/100</strong></div><div class="bar"><span style="width:'+depth+'%;background:var(--green)"></span></div></div><div class="risk-dimension"><div class="probrow"><span>Relative reported volume</span><strong>'+Math.round(turnover)+'/100</strong></div><div class="bar"><span style="width:'+turnover+'%;background:var(--cyan,var(--violet))"></span></div></div><div class="risk-dimension"><div class="probrow"><span>Distance from a 50% price</span><strong>'+(severity===null?"Not available":severity+"/100")+'</strong></div><div class="bar"><span style="width:'+(severity===null?0:severity)+'%;background:var(--amber)"></span></div></div><div class="risk-record-foot"><span>Volume '+htmlEscape(m.volume||"—")+'</span><span>Liquidity '+htmlEscape(m.depth||"—")+'</span></div><button class="market-action-link" data-market-action="inspect" data-market-id="'+htmlEscape(marketKey(m))+'" type="button">Inspect record ↗</button></article>'}).join("");
 const pA=state.riskA,pB=state.riskB;
 const gap=Math.abs(Number(pA)-Number(pB));
 return '<div class="crumb">SEER / RISK PRICING</div><div class="headrow"><div><div class="eyebrow">06 / Comparative risk</div><h1 class="heading">Risk is multidimensional.</h1><p class="intro">Read live price, reported depth and activity side by side. The API does not supply a security-risk score or loss severity, so this view keeps observable market dimensions separate and identifies derived values as relative indicators.</p></div><span class="pill violet">Risk pricing</span></div>'+renderPageVisual("risk","EXPOSURE MAP / 06","Liquidity is part of the risk picture.","A market price without sufficient depth can be a fragile signal. These dimensions are not a protocol security audit.")+'<div class="grid stats">'+stat("Markets inspected",String(records.length),marketFeed.status==="live"?"Current Seer response":"Demo fallback")+stat("Highest reported liquidity",records[0]?records[0].depth:"—","Sorted from the loaded set")+stat("Risk model","Decomposed","No synthetic security score")+'</div><div class="grid markets risk-live-grid">'+(rows||'<div class="notice">No records available.</div>')+'</div>'+(()=>{const selected=[...records,...state.watchlist,...explorerMarkets].find(m=>marketKey(m)===state.selectedMarketId);return selected?renderMarketDetail(selected):""})()+section("Sensitivity sandbox","Compare your own two risk assumptions without mistaking them for Seer market fields.")+'<div class="grid two"><section class="panel"><div class="field"><label for="riskA">Assumption A · user-defined score: <strong id="riskALabel">'+pA+'/100</strong></label><input type="range" id="riskA" min="0" max="100" value="'+pA+'" oninput="state.riskA=this.value;updateRisk()"></div><div class="field" style="margin-top:22px"><label for="riskB">Assumption B · user-defined score: <strong id="riskBLabel">'+pB+'/100</strong></label><input type="range" id="riskB" min="0" max="100" value="'+pB+'" oninput="state.riskB=this.value;updateRisk()"></div><p class="muted" style="font-size:11px;margin-top:20px">These sliders are user-defined inputs and do not alter Seer records.</p></section><section class="panel" id="riskResult"><div class="category">USER-DEFINED ASSUMPTION GAP</div><div class="outcome" id="riskGap">'+gap+' points</div><p class="muted" id="riskText">'+(gap>=25?"Material gap between the two input assumptions.":"Narrow gap between the two input assumptions.")+'</p><div class="notice">This difference is not a market-implied risk metric. Inspect live liquidity, volume, prices and resolution status independently.</div></section></div>'+evidenceRail("Risk evidence & comparability");
}

function updateRisk(){const a=Number(state.riskA),b=Number(state.riskB),g=Math.abs(a-b);const gapNode=document.getElementById("riskGap"),textNode=document.getElementById("riskText"),aNode=document.getElementById("riskALabel"),bNode=document.getElementById("riskBLabel");if(gapNode)gapNode.textContent=g+" points";if(textNode)textNode.textContent=g>=25?"Material gap between the two input assumptions.":"Narrow gap between the two input assumptions.";if(aNode)aNode.textContent=a+"/100";if(bNode)bNode.textContent=b+"/100";}

function go(page) {
  const validPages = ["home", "app", "deep", "futarchy", "opportunity", "risk"];

  if (!validPages.includes(page)) return;

  state.page = page;
  const nextHash = "#/" + page;

  if (location.hash !== nextHash) {
    history.pushState({ page }, "", nextHash);
  }

  render();
  if(page==="app")loadExplorerMarkets();if(page==="futarchy")loadFutarchyMarkets();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  const pageTitles={home:"Overview",app:"Market explorer",deep:"Deep forecasts",futarchy:"Futarchy",opportunity:"Opportunity markets",risk:"Risk pricing"};
  document.title="Seer Six — "+(pageTitles[state.page]||"Markets for better decisions");
  document.getElementById("main").dataset.page=state.page;
  const focusedId = document.activeElement && document.activeElement.id === "marketSearch" ? "marketSearch" : null;
  const caret = focusedId ? document.activeElement.selectionStart : null;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
  const views={home:renderHome,app:renderApp,deep:renderDeep,futarchy:renderFutarchy,opportunity:renderOpportunity,risk:renderRisk};
  const interfaceItems=[["home","Overview"],["app","Market explorer"],["deep","Deep forecasts"],["futarchy","Futarchy"],["opportunity","Opportunities"],["risk","Risk pricing"]];
  const logoSrc=document.querySelector(".top .logo img")?.getAttribute("src")||"";
  const footerMarkup=`<div class="site-footer-inner"><div class="footer-brand"><a class="footer-brand-lockup" href="#/home" aria-label="Seer Six home" onclick="go('home');return false"><img src="${logoSrc}" alt=""><span class="wordmark">seer</span></a><p class="footer-tagline">Every opinion has a price.<br>One protocol, six decision interfaces.</p></div><nav class="interface-nav" aria-label="Seer interfaces">${interfaceItems.map(([key,title])=>`<a class="interface-link ${key===state.page?"current":""}" href="#/${key}" data-suite-page="${key}" ${key===state.page?'aria-current="page"':""}>${title}</a>`).join("")}</nav></div><div class="site-footer-bottom"><span>SEER SIX / INTERFACE CONCEPT</span><span>${marketFeed.status==="live"?"Seer API market records · specialist scenarios remain illustrative":"Demo fallback until live market data is available"} · Not financial or governance advice</span></div>`;
  document.getElementById("main").innerHTML=views[state.page]();
  document.getElementById("siteFooter").innerHTML=footerMarkup;
  if(focusedId){
    const next=document.getElementById(focusedId);
    if(next){next.focus();if(typeof caret==="number")next.setSelectionRange(caret,caret);}
  }
}
document.getElementById("main").addEventListener("click",e=>{const side=e.target.closest("button[data-opportunity-side]");if(side){state.opportunitySide=side.dataset.opportunitySide==="no"?"no":"yes";render();return;}const b=e.target.closest("button[data-market-action]");if(!b)return;const action=b.dataset.marketAction;if(action==="open-wire"){openWireMarket(b.dataset.marketId);return;}if(action==="save")toggleMarketWatchlist(b.dataset.marketId);else if(action==="inspect")toggleMarketDetail(b.dataset.marketId);else if(action==="model-opportunity"){const key=String(b.dataset.marketId||"");const chosen=[...explorerMarkets,...markets].find(m=>marketKey(m)===key);const framed=chosen?makeBinaryPaperProjection(chosen):null;if(framed){state.opportunityMarketId=marketKey(framed);state.opportunityMarketSnapshot=framed;const p=opportunityOutcomePrice(framed,0);state.opportunityBelief=Number.isFinite(p)?p:50;state.opportunitySide="yes";go("opportunity");requestAnimationFrame(()=>document.getElementById("opportunityLab")?.scrollIntoView({behavior:"smooth",block:"start"}));}}else if(action==="analyze-side"){const key=String(b.dataset.marketId||"");const chosen=[...explorerMarkets,...markets,...state.watchlist].find(m=>marketKey(m)===key);const framed=chosen?makeBinaryPaperProjection(chosen):null;if(framed){state.opportunityMarketId=marketKey(framed);state.opportunityMarketSnapshot=framed;state.opportunitySide=b.dataset.outcomeIndex==="1"?"no":"yes";const p=opportunityOutcomePrice(framed,0);state.opportunityBelief=Number.isFinite(p)?p:50;go("opportunity");requestAnimationFrame(()=>document.getElementById("opportunityLab")?.scrollIntoView({behavior:"smooth",block:"start"}));}}else if(action==="compare")toggleMarketCompare(b.dataset.marketId);else if(action==="remove-compare"){state.compareMarkets=state.compareMarkets.filter(m=>marketKey(m)!==b.dataset.marketId);state.compareNotice="";render();}else if(action==="clear-compare"){state.compareMarkets=[];state.compareNotice="";render();}else if(action==="close-detail"){state.selectedMarketId=null;render();}});
document.getElementById("main").addEventListener("input",e=>{const field=e.target.closest("[data-opportunity-field]");if(!field)return;if(field.dataset.opportunityField==="stake")state.opportunityStake=field.value;if(field.dataset.opportunityField==="belief")state.opportunityBelief=Number(field.value);updateOpportunityScenario();});
function refreshOpportunityMarketSelection(requestedKey){const source=[...new Map([...sortedSpecialistMarkets(markets),...explorerMarkets,...(state.opportunityMarketSnapshot?[state.opportunityMarketSnapshot]:[])].filter(m=>m&&m.title).map(m=>[marketKey(m),m])).values()];const sourceEligible=[...new Map(source.filter(canPaperFrameOutcome).map(m=>makeBinaryPaperProjection(m)).filter(Boolean).map(m=>[marketKey(m),m])).values()];const eligible=sourceEligible.length?sourceEligible:demoMarkets.filter(isBinaryOpportunityMarket);const selected=eligible.find(m=>marketKey(m)===String(requestedKey))||opportunityScenarioMarket(eligible);if(!selected){render();return;}state.opportunityMarketId=marketKey(selected);const p=opportunityOutcomePrice(selected,0);state.opportunityBelief=Number.isFinite(p)?p:50;const lab=document.getElementById("opportunityLab");if(lab)lab.outerHTML=renderOpportunityLab(source);else render();}
document.getElementById("main").addEventListener("change",e=>{const field=e.target.closest("[data-opportunity-field]");if(!field||field.dataset.opportunityField!=="market")return;refreshOpportunityMarketSelection(String(field.value||""));});
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("siteFooter").addEventListener("click",e=>{const b=e.target.closest("a[data-suite-page]");if(b){e.preventDefault();go(b.dataset.suitePage)}});
render();
initializeMarketWire();
loadLiveMarkets();

function toggleTheme(){const next=document.body.dataset.theme==="light"?"dark":"light";document.body.dataset.theme=next;const b=document.getElementById("themeToggle");if(b){b.innerHTML=next==="light"?"☾ <span>Dark</span>":"☼ <span>Light</span>";b.setAttribute("aria-label","Switch to "+(next==="light"?"dark":"light")+" theme");b.title="Switch to "+(next==="light"?"dark":"light")+" theme";}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=next==="light"?"#f7f7f9":"#101013";}

function syncRoute() {
  const page = location.hash.replace(/^#\/?/, "");
  const validPages = [
    "home", "app", "deep",
    "futarchy", "opportunity", "risk"
  ];

  state.page = validPages.includes(page) ? page : "home";
  render();
  if(state.page==="app")loadExplorerMarkets();
  if(state.page==="futarchy")loadFutarchyMarkets();
}

window.addEventListener("popstate", syncRoute);
window.addEventListener("hashchange", syncRoute);

syncRoute();

</script>
