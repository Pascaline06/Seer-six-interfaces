
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#101013">
<meta name="description" content="Seer Six: six decision interfaces for exploring market signals, conditional forecasts, opportunity selection and comparative risk.">
<meta property="og:title" content="Seer Six — Markets for better decisions">
<meta property="og:description" content="Explore the signal. Inspect the evidence. Understand the limits.">

<title>Seer Six — Every opinion has a price</title>
<style>

:root{
  color-scheme:dark;
  --bg:#101013;
  --surface:#17171c;
  --panel:#1b1b21;
  --panel-raised:#222229;
  --line:#34343f;
  --text:#f3f1f8;
  --muted:#bbb8c7;
  --dim:#898595;
  --violet:#b7a0ff;
  --violet-strong:#8b5cf6;
  --purple:#6c2bd9;
  --green:#77ddb0;
  --amber:#f4ca83;
  --red:#ff9eaa;
  --content-gap:22px;
  --card-radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Instrument Sans",sans-serif;font-size:16px;line-height:1.7;
  font-synthesis:none;text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.skip-link{position:absolute;left:12px;top:-70px;z-index:30;background:var(--violet);color:#101013;border-radius:8px;padding:10px 14px;font-weight:700}
.skip-link:focus{top:12px}
.shell{min-height:100vh}
.top{
  position:sticky;top:0;z-index:10;height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 clamp(20px,4.5vw,72px);
  background:rgba(16,16,19,.94);border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.brand{min-width:0;display:flex;align-items:center;gap:10px;font-size:0}
.logo{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;overflow:hidden}
.logo img{display:block;width:30px;height:30px;object-fit:contain}
.wordmark{font-family:"Sora",sans-serif;font-size:24px;font-weight:700;letter-spacing:-1.6px;line-height:1;color:var(--text)}
.brand-note{margin-left:3px;color:var(--dim);font-size:11px;letter-spacing:.02em;font-weight:500}
.topright{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
.chain{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:-.03em;color:var(--muted)}
.live{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px #8b5cf677}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:rgba(34,34,41,.6);font-size:11px;line-height:1.35;white-space:nowrap}
.pill.violet{color:#e2d7ff;background:#6c2bd91c;border-color:#a78bfa55}
.pill.green{color:var(--green)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--text);font-size:12px;font-weight:600}
.theme-toggle:hover{border-color:var(--violet)}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1760px;margin:0 auto;min-height:calc(100vh - 72px)}
.side{padding:34px 16px;border-right:1px solid var(--line)}
.side-label,.eyebrow,.category,.crumb,.statlabel,th{font-size:11px;font-weight:700;letter-spacing:.115em;text-transform:uppercase}
.side-label{padding:8px 12px 14px;color:var(--dim)}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;min-height:45px;
  padding:11px 12px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--muted);text-align:left;font-size:13px;
  font-weight:600;transition:color .16s,background .16s,border-color .16s;
}
.nav button:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.nav button.active{background:linear-gradient(100deg,#6c2bd92f,#6c2bd90b);border-color:#a78bfa4a;box-shadow:inset 2px 0 var(--violet);color:#e8ddff}
.num{width:23px;flex:0 0 23px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.nav button.active .num{color:var(--violet)}
.side-note{margin:38px 4px 0;padding:17px 16px;border:1px solid #a78bfa30;border-radius:12px;background:linear-gradient(145deg,#6c2bd919,#1b1b2100);font-size:13px;line-height:1.8;color:var(--muted)}
.side-note .eyebrow{color:var(--violet)}
.side-note p{margin:11px 0 0}
.main{min-width:0;padding:clamp(36px,4.6vw,72px) clamp(24px,5vw,82px) 42px}
.crumb{margin:0 0 26px;color:var(--dim);font-size:11px}
.eyebrow{color:var(--violet);font-size:11px;letter-spacing:.14em}
.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;margin:0 0 42px}
.headrow>div{min-width:0}
.headrow>.pill{margin-top:7px}
.headrow .button{flex:0 0 auto;margin-top:9px;align-self:flex-start}
.heading,h1,h2,h3,.sectionhead h2,.market h3,.interface-nav-title{
  font-family:"Sora",sans-serif;font-synthesis:none;
}
.heading{
  max-width:900px;margin:14px 0 21px;color:var(--text);
  font-size:clamp(42px,4.6vw,66px);font-weight:700;letter-spacing:-.055em;line-height:1.045;
  text-wrap:balance;
}
.intro{max-width:65ch;margin:0;color:var(--muted);font-size:17px;line-height:1.85;font-weight:400}
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
  padding:11px 16px;border:1px solid #484653;border-radius:10px;
  background:var(--panel-raised);color:var(--text);font-size:13px;font-weight:650;letter-spacing:0;
  transition:background .16s,border-color .16s,transform .16s;
}
.button:hover{transform:translateY(-1px);border-color:var(--violet)}
.button.primary{background:var(--purple);border-color:#8756f3;color:white}
.button.primary:hover{background:#7c3aed;border-color:#9d79fa}
.grid{display:grid;gap:var(--content-gap);min-width:0}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:32px 0 43px}
.panel{
  min-width:0;padding:25px 26px;border:1px solid var(--line);
  border-radius:var(--card-radius);background:var(--panel);
}
.stats .panel{padding:24px 25px;position:relative;overflow:hidden}
.stats .panel:after{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--violet-strong),transparent 78%);content:""}
.statlabel{color:var(--muted);font-size:11px;letter-spacing:.1em}
.statvalue,.prob,.outcome,.optionprob,td.num,.mono{
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
}
.statvalue{margin:15px 0 9px;font-size:clamp(26px,2.5vw,37px);font-weight:600;letter-spacing:-.06em;line-height:1.2;color:var(--text)}
.statfoot{color:var(--muted);font-size:12px;line-height:1.65}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:46px 0 19px}
.sectionhead h2{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.04em;font-weight:650}
.sectionhead p{max-width:62ch;margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
.markets{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.market{display:flex;flex-direction:column;gap:17px;min-height:224px;padding:24px;border-radius:14px;transition:border-color .17s,transform .17s,background .17s}
.market:hover{transform:translateY(-2px);border-color:#a78bfa80}
.markettop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.category{color:var(--violet);font-size:10px;letter-spacing:.12em}
.market h3{max-width:42ch;margin:0;font-size:17px;font-weight:650;line-height:1.5;letter-spacing:-.025em;color:var(--text)}
.probrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prob{font-size:37px;font-weight:600;letter-spacing:-.065em;color:var(--text);line-height:1.25}
.positive{color:var(--green)}
.muted{color:var(--muted)}
.bar{height:6px;margin-top:11px;overflow:hidden;border-radius:999px;background:#393642}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple),var(--violet))}
.marketfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:7px;color:var(--muted);font-size:12px;line-height:1.6}
.two{grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr);gap:22px}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chart{position:relative;height:228px;margin-top:17px;overflow:hidden;border-radius:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#34343f 54px,#34343f 55px)}
.chart svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:15px;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:560px;border-collapse:collapse}
th{padding:16px 15px;background:#ffffff04;color:var(--dim);text-align:left;font-size:10px;letter-spacing:.1em}
td{padding:16px 15px;border-bottom:1px solid #ffffff12;color:var(--text);font-size:14px;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:#a78bfa0a}
.evidence{display:grid;gap:18px}
.evidenceitem{padding:4px 0 4px 16px;border-left:2px solid var(--violet-strong)}
.evidenceitem strong{display:block;color:var(--text);font-size:14px;font-weight:700;line-height:1.55}
.evidenceitem span{display:block;margin-top:5px;color:var(--muted);font-size:13px;line-height:1.75}
.notice{margin:24px 0;padding:16px 18px;border:1px solid #f4ca8340;border-radius:11px;background:#f4ca8309;color:#e1cca7;font-size:13px;line-height:1.8}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:650}
.field select,.field input{width:100%;min-height:46px;padding:12px 14px;border:1px solid #494654;border-radius:9px;background:#101013;color:var(--text);font-size:14px}
.field select:focus,.field input:focus{outline:2px solid var(--violet);outline-offset:2px}
input[type="range"]{padding:0!important;border:0!important;background:transparent!important;accent-color:var(--violet);cursor:ew-resize}
.outcome{font-size:34px;font-weight:600;letter-spacing:-.06em}
.optionrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.optionrow:last-child{border-bottom:0}
.optionrow strong{display:block;font-size:15px;font-weight:650;line-height:1.5}
.optionrow small{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.7}
.optionprob{font-size:26px;font-weight:600;letter-spacing:-.055em;text-align:right}
.interface-nav{margin-top:68px;padding-top:24px;border-top:1px solid var(--line)}
.interface-nav-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}
.interface-nav-heading .eyebrow{color:var(--muted);font-size:10px;letter-spacing:.13em}
.interface-nav-caption{color:var(--dim);font-size:12px}
.interface-nav-links{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.interface-nav-link{position:relative;display:grid;grid-template-columns:1fr auto;align-content:center;gap:5px 8px;min-width:0;min-height:78px;padding:13px 12px;border-right:1px solid var(--line);color:var(--muted);background:transparent;transition:color .15s,background .15s}
.interface-nav-link:last-child{border-right:0}
.interface-nav-link:hover{background:#a78bfa0c;color:var(--text)}
.interface-nav-link.current{background:#6c2bd915;color:var(--text);box-shadow:inset 0 2px var(--violet)}
.interface-nav-num{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.03em;color:var(--violet)}
.interface-nav-title{grid-column:1/-1;font-size:12px;font-weight:650;line-height:1.35;letter-spacing:-.02em;overflow-wrap:anywhere}
.interface-nav-arrow{grid-column:2;grid-row:1;font-size:13px;color:var(--dim);justify-self:end}
.interface-nav-link:hover .interface-nav-arrow{color:var(--violet)}
.interface-nav-link:focus-visible{z-index:1;outline-offset:-3px}
.foot{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px 22px;margin-top:26px;padding:16px 0 3px;border-top:0;color:var(--dim);font-size:11px;line-height:1.7}
.foot span:last-child{max-width:70ch}
body[data-theme="light"]{
  color-scheme:light;--bg:#f7f7f9;--surface:#fff;--panel:#fff;--panel-raised:#f2f0f7;
  --line:#dfdde7;--text:#201b2b;--muted:#5c566b;--dim:#756f83;
  --violet:#6531c9;--violet-strong:#7845df;--purple:#6c2bd9;background:var(--bg);color:var(--text)
}
body[data-theme="light"] .top{background:rgba(255,255,255,.94);border-color:var(--line)}
body[data-theme="light"] .chain{color:var(--muted)}
body[data-theme="light"] .logo img{filter:brightness(0)}
body[data-theme="light"] .pill{background:#f3f1f8;border-color:#dfdde7;color:#5c566b}
body[data-theme="light"] .pill.violet{background:#eee7ff;border-color:#d6c7ff;color:#5125a8}
body[data-theme="light"] .theme-toggle{background:#fff;border-color:var(--line);color:var(--text)}
body[data-theme="light"] .side{background:#f7f7f9;border-color:var(--line)}
body[data-theme="light"] .nav button{color:var(--muted)}
body[data-theme="light"] .nav button:hover{background:#efedf5;border-color:#dfdde7;color:var(--text)}
body[data-theme="light"] .nav button.active{background:#eee7ff;border-color:#d6c7ff;color:#5125a8;box-shadow:inset 2px 0 #6c2bd9}
body[data-theme="light"] .side-note{background:#fff;border-color:#dfd6f5;color:var(--muted)}
body[data-theme="light"] .heading,body[data-theme="light"] .sectionhead h2,body[data-theme="light"] .market h3,body[data-theme="light"] .optionrow strong,body[data-theme="light"] .statvalue,body[data-theme="light"] .prob,body[data-theme="light"] .evidenceitem strong{color:var(--text)}
body[data-theme="light"] .intro,body[data-theme="light"] .muted,body[data-theme="light"] .statfoot,body[data-theme="light"] .marketfoot,body[data-theme="light"] .sectionhead p,body[data-theme="light"] .evidenceitem span{color:var(--muted)}
body[data-theme="light"] .button{background:#fff;border-color:#d9d6e2;color:#292333}
body[data-theme="light"] .button.primary{background:#6c2bd9;border-color:#6c2bd9;color:#fff}
body[data-theme="light"] .panel,body[data-theme="light"] .market{background:#fff;border-color:var(--line);box-shadow:0 5px 20px #21123807}
body[data-theme="light"] .stats .panel:after{background:linear-gradient(90deg,#7845df,transparent 80%)}
body[data-theme="light"] .bar{background:#e6e1ef}
body[data-theme="light"] .chart{background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#e5e1ec 54px,#e5e1ec 55px)}
body[data-theme="light"] .tablewrap{border-color:var(--line)}
body[data-theme="light"] th{background:#f5f3f8;color:#615a70}
body[data-theme="light"] td{border-bottom-color:#e9e6ef;color:#292333}
body[data-theme="light"] tbody tr:hover{background:#6c2bd908}
body[data-theme="light"] .field select,body[data-theme="light"] .field input{background:#fff;border-color:#d9d6e2;color:var(--text)}
body[data-theme="light"] .notice{background:#fff9ed;border-color:#efdfbd;color:#735927}
body[data-theme="light"] .interface-nav-link{color:#5c566b}
body[data-theme="light"] .interface-nav-link:hover{background:#6c2bd909;color:#201b2b}
body[data-theme="light"] .interface-nav-link.current{background:#eee7ff;color:#5125a8;box-shadow:inset 0 2px #6c2bd9}
body[data-theme="light"] .interface-nav-link.current .interface-nav-num{color:#5125a8}
@media(max-width:1200px){
 .layout{grid-template-columns:215px minmax(0,1fr)}
 .main{padding-inline:clamp(24px,3.5vw,46px)}
 .interface-nav-links{grid-template-columns:repeat(3,minmax(0,1fr))}
 .interface-nav-link:nth-child(3){border-right:0}
 .interface-nav-link:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media(max-width:850px){
 .layout{grid-template-columns:1fr}
 .top{height:68px}
 .brand-note,.topright .chain{display:none}
 .side{position:sticky;top:68px;z-index:8;min-height:0;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);background:rgba(16,16,19,.96);backdrop-filter:blur(16px)}
 .side-label,.side-note{display:none}
 .nav{flex-direction:row;gap:5px;overflow-x:auto;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav button{width:auto;min-width:max-content;min-height:40px;padding:9px 11px;font-size:12px}
 .num{display:none}
 .main{padding-top:40px}
 .heading{font-size:clamp(40px,6.2vw,55px)}
 .intro{font-size:16px;line-height:1.8}
 .headrow{gap:18px;margin-bottom:34px}
 .stats{gap:13px;margin:24px 0 34px}
 .stats .panel{padding:19px}
 .panel{padding:22px}
 .market{padding:21px}
 .sectionhead{margin-top:38px}
 .two{grid-template-columns:1fr}
}
@media(max-width:560px){
 body{font-size:15px}
 .top{height:62px;padding-inline:14px}
 .wordmark{font-size:22px}
 .logo,.logo img{width:26px;height:26px}
 .logo{flex-basis:26px}
 .topright{gap:7px}
 .topright .pill{font-size:9px;padding:5px 7px}
 .theme-toggle{min-height:31px;padding:5px 8px;font-size:11px}
 .theme-toggle span{display:none}
 .side{top:62px;padding:7px 8px}
 .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
 .nav button{justify-content:flex-start;min-width:0;min-height:36px;white-space:normal;padding:7px 6px;font-size:10px;line-height:1.25;gap:5px}
 .main{padding:30px 16px 28px}
 .crumb{margin-bottom:19px}
 .heading{margin:12px 0 17px;font-size:clamp(35px,9.7vw,44px);line-height:1.09;letter-spacing:-.045em}
 .intro{font-size:15px;line-height:1.8}
 .headrow{gap:12px;margin-bottom:28px}
 .headrow .button{margin-top:2px}
 .stats,.markets,.three{grid-template-columns:1fr}
 .stats{gap:11px;margin:23px 0 32px}
 .stats .panel{padding:17px 18px}
 .statvalue{margin:11px 0 6px;font-size:28px}
 .sectionhead{align-items:flex-start;flex-direction:column;gap:6px;margin:34px 0 15px}
 .sectionhead h2{font-size:20px}
 .grid{gap:14px}
 .panel,.market{padding:19px;border-radius:13px}
 .market{min-height:0;gap:15px}
 .market h3{font-size:16px}
 .prob{font-size:32px}
 .marketfoot{flex-wrap:wrap;font-size:11px}
 .chart{height:190px}
 .formrow{grid-template-columns:1fr}
 .optionrow{gap:12px;padding:16px 0}
 .optionrow strong{font-size:14px}
 .optionrow small{font-size:12px;line-height:1.6}
 .optionprob,.outcome{font-size:22px}
 .interface-nav{margin-top:46px;padding-top:19px}
 .interface-nav-heading{align-items:flex-start;flex-direction:column;gap:4px;margin-bottom:11px}
 .interface-nav-caption{font-size:11px}
 .interface-nav-links{grid-template-columns:repeat(2,minmax(0,1fr))}
 .interface-nav-link{min-height:67px;padding:10px 11px;border-right:1px solid var(--line)}
 .interface-nav-link:nth-child(3){border-right:1px solid var(--line)}
 .interface-nav-link:nth-child(2n){border-right:0}
 .interface-nav-link:nth-child(-n+4){border-bottom:1px solid var(--line)}
 .interface-nav-title{font-size:12px}
 .foot{display:block;margin-top:18px;font-size:10px;line-height:1.7}
 .foot span{display:block;margin-top:5px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<script>

const demoMarkets=[
{id:"M-101",type:"Governance",title:"Will the protocol ship its v2 upgrade by December 31?",p:68,volume:"$84.2k",depth:"$12.4k",change:"+4.2%",time:"Dec 31, 2026",status:"Open"},
{id:"M-102",type:"Ecosystem",title:"Will active developers increase next quarter?",p:57,volume:"$31.8k",depth:"$8.6k",change:"+1.8%",time:"Jan 31, 2027",status:"Open"},
{id:"M-103",type:"Grants",title:"Will the public-goods program hit its adoption target?",p:42,volume:"$18.1k",depth:"$4.1k",change:"−2.1%",time:"Mar 31, 2027",status:"Open"},

{id:"M-106",type:"Grants",title:"Will the ecosystem fund distribute its full allocation?",p:36,volume:"$9.4k",depth:"$2.1k",change:"−3.5%",time:"Feb 28, 2027",status:"Open"}
];
let markets=demoMarkets;
const marketFeed={status:"loading",count:0,updatedAt:null,error:"",chains:[100,10,8453,1]};
const htmlEscape=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const numberValue=value=>Number.isFinite(Number(value))?Number(value):0;
const compactUSD=value=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",notation:"compact",maximumFractionDigits:1}).format(numberValue(value));
const chainLabel=id=>({100:"Gnosis",10:"Optimism",8453:"Base",1:"Ethereum"}[Number(id)]||("Chain "+id));
const seerMarketHref=m=>m&&m.chainId&&((m.url||m.fullId))?"https://app.seer.pm/markets/"+encodeURIComponent(m.chainId)+"/"+encodeURIComponent(m.url||m.fullId):"";
function normalizeLiveMarket(m){
 const odds=Array.isArray(m.odds)?m.odds:[];
 const first=odds.find(v=>v!==null&&Number.isFinite(Number(v)));
 const raw=first===undefined?null:Number(first);
 const probability=raw===null?null:Math.max(0,Math.min(100,raw>=0&&raw<=1?raw*100:raw));
 const opened=Number(m.openingTs||0);
 const time=opened?new Date(opened*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}):"Not specified";
 const rawCategory=Array.isArray(m.categories)&&m.categories.length?m.categories[0]:"";
 const category=rawCategory&&String(rawCategory).toUpperCase()!=="MISC"?rawCategory:(m.type==="Futarchy"?"Futarchy":"Prediction market");
 return {id:String(m.id||"").slice(0,10)+"…",fullId:String(m.id||""),type:category,title:String(m.marketName||"Untitled market"),p:probability,volume:compactUSD(m.volumeUSD),depth:compactUSD(m.liquidityUSD),change:null,time,status:m.payoutReported?"Resolved":"Listed",chainId:Number(m.chainId||0),chain:chainLabel(m.chainId),url:String(m.url||""),liquidityUSD:numberValue(m.liquidityUSD),volumeUSD:numberValue(m.volumeUSD),outcomes:Array.isArray(m.outcomes)?m.outcomes:[],verification:({verified:"Verified",verifying:"Verifying",challenged:"Challenged",not_verified:"Not verified"}[m.verification?.status]||"Not verified"),isLive:true};
}
async function loadLiveMarkets(){
 try{
  const response=await fetch("https://app.seer.pm/.netlify/functions/markets-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chainsList:marketFeed.chains.map(String),marketStatusList:["open","answer_not_final","in_dispute"],limit:12,page:1,orderBy:"liquidityUSD",orderDirection:"desc",showConditionalMarkets:false})});
  if(!response.ok)throw new Error("Seer market endpoint returned HTTP "+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.markets))throw new Error("The Seer endpoint returned an unexpected market response");
  const live=payload.markets.map(normalizeLiveMarket).filter(m=>m.fullId&&m.title);
  if(!live.length)throw new Error("The Seer endpoint returned no market records");
  markets=live;marketFeed.status="live";marketFeed.count=Number(payload.count)||live.length;marketFeed.updatedAt=new Date();marketFeed.error="";
 }catch(error){
  marketFeed.status="fallback";marketFeed.error=error&&error.message?error.message:"Live market data could not be loaded";
  markets=demoMarkets.map(m=>({...m,isLive:false}));
 }
 render();
}
const fmt=n=>n.toLocaleString("en-US");
function marketCard(m){const p=m.p===null||m.p===undefined?"—":Math.round(m.p)+"%";const pct=m.p===null||m.p===undefined?0:m.p;const href=seerMarketHref(m);return `<article class="panel market"><div class="markettop"><span class="category">${htmlEscape(m.type)}</span><span class="pill">${htmlEscape(m.chain||"Preview")}</span></div><h3>${htmlEscape(m.title)}</h3><div><div class="probrow"><span class="prob">${p}</span><span class="muted" style="font-size:11px">${m.p===null||m.p===undefined?"Price unavailable":"Indicative outcome price"}</span></div><div class="bar"><span style="width:${pct}%"></span></div><div class="muted" style="font-size:11px;margin-top:7px">${m.outcomes?.length?htmlEscape(m.outcomes.slice(0,3).join(" · ")):"Outcome details in market"}</div></div><div class="marketfoot"><span>Volume ${htmlEscape(m.volume||"—")}</span><span>Liquidity ${htmlEscape(m.depth||"—")}</span></div><div class="marketfoot"><span>${m.isLive?"Live Seer record":"Demo fallback"}</span><span>Opened ${htmlEscape(m.time||"date unavailable")}</span></div>${href?`<div class="marketfoot"><a href="${htmlEscape(href)}" target="_blank" rel="noopener noreferrer" style="color:var(--violet)">Open on Seer ↗</a><span>${htmlEscape(m.verification||"")}</span></div>`:""}</article>`}
function section(title,sub="",right=""){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>${right}</div>`}
function stat(label,value,foot){return `<div class="panel"><div class="statlabel">${label}</div><div class="statvalue">${value}</div><div class="statfoot">${foot}</div></div>`}
function evidenceRail(title="Signal integrity"){const source=marketFeed.status==="live"?"Seer markets-search API · live records":marketFeed.status==="loading"?"Connecting to Seer market data…":"Demo fallback · live endpoint unavailable";const updated=marketFeed.updatedAt?"Fetched "+marketFeed.updatedAt.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"Timestamp appears after a successful fetch";return `<section class="panel"><div class="sectionhead" style="margin:0 0 17px"><div><h2>${title}</h2><p>Read the signal in context</p></div><span class="pill violet">Evidence rail</span></div><div class="evidence"><div class="evidenceitem"><strong>Source status</strong><span>${htmlEscape(source)}</span></div><div class="evidenceitem"><strong>Last successful refresh</strong><span>${htmlEscape(updated)} · ${marketFeed.count?marketFeed.count.toLocaleString()+" indexed markets":"market count not confirmed"}</span></div><div class="evidenceitem"><strong>What the signal means</strong><span>Outcome prices are market signals, not guarantees. Liquidity affects how much can be traded near the displayed price.</span></div><div class="evidenceitem"><strong>Data boundary</strong><span>Liquidity and volume come from the market API; the prototype's forecast, futarchy and risk examples remain illustrative.</span></div></div>${marketFeed.status==="fallback"?`<div class="notice">Live data did not load: ${htmlEscape(marketFeed.error)}. Showing clearly labelled demo records instead of presenting them as live.</div>`:""}</section>`}
function chart(){return `<div class="chart"><svg viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="Illustrative market probability history" focusable="false"><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c6ff2" stop-opacity=".25"/><stop offset="1" stop-color="#9c6ff2" stop-opacity="0"/></linearGradient></defs><path d="M0 140 L35 132 L75 146 L110 117 L145 125 L180 99 L220 111 L260 77 L300 92 L340 64 L380 82 L420 56 L460 68 L500 41 L550 51 L600 27 L600 190 L0 190 Z" fill="url(#shade)"/><path d="M0 140 L35 132 L75 146 L110 117 L145 125 L180 99 L220 111 L260 77 L300 92 L340 64 L380 82 L420 56 L460 68 L500 41 L550 51 L600 27" fill="none" stroke="#9c6ff2" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></div><div class="legend"><span><i class="dot" style="background:var(--violet)"></i>Illustrative implied probability</span><span>Not historical Seer data</span></div>`}
function renderHome(){const top=markets[0]||demoMarkets[0];const live=marketFeed.status==="live";const p=top.p===null||top.p===undefined?"—":Math.round(top.p)+"%";return `<div class="crumb">SEER / OVERVIEW</div><div class="headrow"><div><div class="eyebrow">Every opinion has a price</div><h1 class="heading">See what people believe.<br>Understand why it matters.</h1><p class="intro">Explore market signals, compare competing futures and examine the uncertainty behind a price. Designed for people making consequential decisions—not just watching odds move.</p></div><button class="button primary" onclick="go('app')">Explore markets ↗</button></div><div class="grid stats">${stat("Markets indexed",live?marketFeed.count.toLocaleString():"—",live?"Seer API · supported networks":"Awaiting live source")}${stat("Live market sample",live?markets.length:"—",live?"Sorted by reported liquidity":"No live records confirmed")}${stat("Data status",live?"Connected":marketFeed.status==="loading"?"Connecting":"Fallback",live?"Fetched "+marketFeed.updatedAt.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}):"Demo data clearly labelled")}</div><div class="notice">${live?"Live market records are fetched from Seer's public markets-search endpoint. Historical chart points and the other specialist-interface scenarios remain illustrative.":"Market-data connection is "+(marketFeed.status==="loading"?"in progress":"unavailable")+". Demo records below are explicitly labelled; they are not current Seer prices."}</div>${section("Six ways to use a market","One protocol, six distinct decision contexts.")}<div class="grid markets">${[
["01","Overview","The shared decision philosophy and evidence-first entry point.","home"],
["02","Market explorer","Find markets, understand liquidity and inspect price movement.","app"],
["03","Deep forecasts","Compare multi-outcome forecasts and evaluator evidence.","deep"],
["04","Futarchy","Compare expected outcomes under pass and fail scenarios.","futarchy"],
["05","Opportunity markets","Use forecast signals to inform—not replace—review.","opportunity"],
["06","Risk pricing","Compare exposure, loss severity and liquidity across protocols.","risk"]
].map(x=>`<article class="panel market"><div class="markettop"><span class="category">${x[0]} / INTERFACE</span><span class="pill">Decision workflow</span></div><h3>${x[1]}</h3><div class="muted">${x[2]}</div><div style="margin-top:auto"><button class="button" onclick="go('${x[3]}')">Open interface ↗</button></div></article>`).join("")}</div>${section("Market activity",live?"Highest-liquidity record in the current API response":"Demo market activity") }<div class="grid two"><section class="panel"><div class="markettop"><div><div class="category">${htmlEscape(top.chain||top.type)} · ${htmlEscape(top.id)}</div><h3>${htmlEscape(top.title)}</h3></div><span class="pill">${live?"Live record":"Demo"}</span></div><div class="probrow" style="margin-top:25px"><span class="prob">${p}</span><span class="muted">${live?"Indicative outcome price":"Illustrative probability"}</span></div><div class="bar"><span style="width:${top.p||0}%"></span></div><div class="grid three" style="margin-top:18px"><div><div class="statlabel">Volume</div><strong>${htmlEscape(top.volume||"—")}</strong></div><div><div class="statlabel">Liquidity</div><strong>${htmlEscape(top.depth||"—")}</strong></div><div><div class="statlabel">Opened</div><strong>${htmlEscape(top.time||"—")}</strong></div></div>${live&&seerMarketHref(top)?`<p><a href="${htmlEscape(seerMarketHref(top))}" target="_blank" rel="noopener noreferrer" style="color:var(--violet)">Inspect this market on Seer ↗</a></p>`:""}<p class="muted" style="font-size:11px;margin-top:18px">The chart below is a design placeholder, not price history.</p>${chart()}</section>${evidenceRail()}</div>`}function renderApp(){const categories=["All markets",...new Set(markets.map(m=>m.type).filter(Boolean))];const list=markets.filter(m=>(state.filter==="All markets"||m.type===state.filter)&&m.title.toLowerCase().includes(state.search.toLowerCase()));const live=marketFeed.status==="live";const highest=list.reduce((best,m)=>m.p!==null&&m.p!==undefined&&(best===null||m.p>best)?m.p:best,null);return `<div class="crumb">SEER / MARKET EXPLORER</div><div class="headrow"><div><div class="eyebrow">02 / Discover</div><h1 class="heading">Market explorer</h1><p class="intro">Search the question, inspect the implied probability and look beyond price to liquidity and expiry. A market is a signal—not a substitute for evidence.</p></div><span class="pill violet">${live?"Live data":"Demo fallback"}</span></div><div class="grid stats">${stat("Markets shown",String(list.length).padStart(2,"0"),live?"Current API sample":"Demo records")}${stat("Highest shown price",highest===null?"—":Math.round(highest)+"%","Among displayed records")}${stat("Source",live?"Seer API":"Demo",live?"Fetched "+marketFeed.updatedAt.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}):"Not live")}</div><div class="panel"><div class="formrow"><div class="field"><label for="marketSearch">Search markets</label><input id="marketSearch" placeholder="Search a question or topic…" value="${state.search.replaceAll('"',"&quot;")}" oninput="state.search=this.value;render()"></div><div class="field"><label for="marketFilter">Market category</label><select id="marketFilter" onchange="state.filter=this.value;render()">${categories.map(x=>`<option value="${htmlEscape(x)}" ${state.filter===x?"selected":""}>${htmlEscape(x)}</option>`).join("")}</select></div></div></div>${section(live?"Markets by reported liquidity":"Demo market records",`${list.length} matching records · ${live?"live Seer API response":"illustrative fallback"}`)}<div class="grid markets">${list.length?list.map(marketCard).join(""):`<div class="panel">No markets match this search. Try a different term or category.</div>`}</div>${section("How to read a price","Probability is only one part of the market.")}<div class="grid three"><div class="panel"><div class="category">01 / Price</div><h3>What is implied?</h3><p class="muted">Outcome prices are not always identical to calibrated probabilities. Read the market type, outcome and pool context before interpreting a percentage.</p></div><div class="panel"><div class="category">02 / Liquidity</div><h3>Can you trade near that price?</h3><p class="muted">Liquidity is not the same as executable depth at every price. Check spread, fees and slippage before relying on a quote.</p></div><div class="panel"><div class="category">03 / Resolution</div><h3>What exactly settles?</h3><p class="muted">Inspect the outcome definition, deadline, resolution source and dispute conditions before participating.</p></div></div>${evidenceRail("Source, freshness & limitations")}`}const forecasts=[{name:"Submission A · Open-source tooling",p:72,low:60,high:81,signal:"Strongest forecast"},{name:"Submission B · Public-goods analytics",p:61,low:47,high:72,signal:"Competitive"},{name:"Submission C · Developer education",p:48,low:34,high:62,signal:"High uncertainty"},{name:"Submission D · Infrastructure research",p:39,low:25,high:54,signal:"High uncertainty"}];
function renderDeep(){return `<div class="crumb">SEER / DEEP FORECASTS</div><div class="headrow"><div><div class="eyebrow">03 / Multi-outcome intelligence</div><h1 class="heading">Look beyond the leading outcome.</h1><p class="intro">Compare multiple candidate outcomes, uncertainty ranges and evidence quality. For grant evaluation, forecasts can reveal overlooked candidates and disagreement—but they do not determine who receives funding.</p></div><span class="pill violet">Deep</span></div><div class="grid stats">${stat("Candidates","04","Illustrative forecast set")}${stat("Leading estimate","72%","Not a confidence guarantee")}${stat("Decision owner","Human","Evaluators retain authority")}</div><div class="grid two"><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>Candidate forecast distribution</h2><p>Illustrative estimates with uncertainty ranges</p></div><span class="pill">Demo data</span></div>${forecasts.map(f=>`<div class="optionrow"><div><strong>${f.name}</strong><small>${f.low}–${f.high}% indicative range · ${f.signal}</small><div class="bar" style="margin-top:10px"><span style="width:${f.p}%"></span></div></div><div class="optionprob">${f.p}%</div></div>`).join("")}<p class="muted" style="font-size:11px">Ranges are fabricated for interface demonstration, not statistically calibrated intervals.</p></section><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>Evaluator evidence</h2><p>What would strengthen this forecast?</p></div></div><div class="evidence"><div class="evidenceitem"><strong>Track record</strong><span>Check independently verifiable delivery against prior commitments.</span></div><div class="evidenceitem"><strong>Adoption evidence</strong><span>Distinguish active usage from sign-ups, impressions or self-reported reach.</span></div><div class="evidenceitem"><strong>Execution risk</strong><span>Assess dependencies, maintenance plan, security and delivery feasibility.</span></div><div class="evidenceitem"><strong>Conflicts and concentration</strong><span>Look for correlated forecasts, coordinated positions and evaluator conflicts.</span></div></div><div class="notice">A high market probability is not proof of merit. Preserve independent review, written reasons and an appeal path.</div></section></div>${section("Review workflow","Use forecasts to improve attention—not automate the verdict.")}<div class="grid three">${[["01","Triage","Identify candidates where the market and reviewers disagree."],["02","Investigate","Ask for evidence that could explain the disagreement."],["03","Decide","Document the human decision and the reasons behind it."]].map(x=>`<div class="panel"><div class="category">${x[0]} / STEP</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join("")}</div>${evidenceRail("Forecast evidence & limitations")}`}
function renderFutarchy(){const p=state.pass;return `<div class="crumb">SEER / FUTARCHY</div><div class="headrow"><div><div class="eyebrow">04 / Conditional outcomes</div><h1 class="heading">Price the consequences,<br>not just the vote.</h1><p class="intro">Futarchy compares forecasts for a measurable success metric under different proposal outcomes. It helps a DAO examine trade-offs; it does not make or execute the governance decision.</p></div><span class="pill violet">Futarchy</span></div><div class="panel"><div class="markettop"><div><div class="category">ILLUSTRATIVE DAO PROPOSAL · P-27</div><h2 style="font-size:19px;margin:6px 0">Increase the ecosystem grants budget by 20%</h2><p class="muted">Metric: six-month retained active developers</p></div><span class="pill">Scenario analysis</span></div><div class="sectionhead"><div><h2>Compare conditional forecasts</h2><p>Choose a scenario to inspect its assumed outcome.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button ${p?"primary":""}" onclick="state.pass=true;render()">If proposal passes</button><button class="button ${!p?"primary":""}" onclick="state.pass=false;render()">If proposal fails</button></div><div class="grid two" style="margin-top:16px"><div class="panel" style="background:var(--bg)"><div class="statlabel">Forecast retained developers</div><div class="statvalue">${p?"1,240":"1,050"}</div><div class="statfoot">${p?"Illustrative pass scenario":"Illustrative fail scenario"}</div><div class="bar" style="margin-top:15px"><span style="width:${p?78:66}%"></span></div></div><div class="panel" style="background:var(--bg)"><div class="statlabel">Forecast change vs baseline</div><div class="statvalue ${p?"positive":""}">${p?"+18%":"+0%"}</div><div class="statfoot">${p?"Incremental upside is uncertain":"Baseline scenario assumption"}</div></div></div></div>${section("What the comparison does—and doesn't—tell you")}<div class="grid two"><section class="panel"><h3>Questions to resolve before voting</h3><div class="evidence"><div class="evidenceitem"><strong>Is the metric measurable?</strong><span>Define active developer and retention before observing outcomes.</span></div><div class="evidenceitem"><strong>Are scenarios comparable?</strong><span>Use consistent time windows, data sources and settlement rules.</span></div><div class="evidenceitem"><strong>What else changes?</strong><span>Consider budget opportunity cost, execution quality and external conditions.</span></div></div></section><section class="panel"><h3>Governance boundary</h3><p class="muted">The market is an input to deliberation. Token holders, delegates or the authorized governance process retain the decision, subject to the DAO's rules.</p><div class="notice">The figures above are hypothetical UI data, not an actual proposal, Seer market, DAO vote or measured causal effect.</div></section></div>${evidenceRail("Conditional forecast integrity")}`}
function renderOpportunity(){return `<div class="crumb">SEER / OPPORTUNITY MARKETS</div><div class="headrow"><div><div class="eyebrow">05 / Funding & selection</div><h1 class="heading">Find the signal.<br>Keep the review fair.</h1><p class="intro">Opportunity markets can forecast which submissions are likely to be selected. This interface separates market estimates from review evidence and final decisions.</p></div><span class="pill violet">Opportunities</span></div><div class="grid stats">${stat("Submissions","04","Illustrative candidate set")}${stat("Review status","Open","No winner selected here")}${stat("Final authority","Review panel","Independent assessment required")}</div><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>Selection forecast</h2><p>Indicative likelihood of selection · simulated values</p></div><span class="pill">Not a verdict</span></div><div class="tablewrap"><table><thead><tr><th>Submission</th><th>Market estimate</th><th>Evidence status</th><th>Review</th></tr></thead><tbody>${[{n:"Open-source tooling",p:72,e:"Needs verification"},{n:"Public-goods analytics",p:61,e:"Evidence supplied"},{n:"Developer education",p:48,e:"Needs verification"},{n:"Infrastructure research",p:39,e:"Evidence supplied"}].map((x,i)=>`<tr><td><strong>${x.n}</strong><br><span class="muted">Candidate 0${i+1}</span></td><td><strong>${x.p}%</strong><div class="bar" style="width:100px;margin-top:5px"><span style="width:${x.p}%"></span></div></td><td>${x.e}</td><td><span class="pill">${i===1?"In review":"Pending"}</span></td></tr>`).join("")}</tbody></table></div></section>${section("Reviewer safeguards","Market popularity should never be confused with submission quality.")}<div class="grid three">${[["Blind review","Hide market rank during the initial independent assessment."],["Conflict checks","Declare conflicts and review coordinated activity."],["Audit trail","Record rubric scores, rationale and final human decision."]].map((x,i)=>`<div class="panel"><div class="category">SAFEGUARD 0${i+1}</div><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join("")}</div><div class="notice">This preview does not identify real applicants or predict an actual grant outcome. Simulated estimates must not be used to rank real submissions.</div>${evidenceRail("Selection signal integrity")}`}
function renderRisk(){const a=Number(state.riskA),b=Number(state.riskB),gap=Math.abs(a-b);const protocols=[{name:"Protocol North",risk:25,loss:40,liq:82},{name:"Protocol Meridian",risk:60,loss:65,liq:45},{name:"Protocol Vale",risk:42,loss:30,liq:68}];return `<div class="crumb">SEER / RISK PRICING</div><div class="headrow"><div><div class="eyebrow">06 / Comparative risk</div><h1 class="heading">Risk isn't one number.</h1><p class="intro">Compare protocols across distinct dimensions: likelihood of an adverse event, potential loss severity and liquidity. Keep the components visible instead of hiding them inside a single yes/no price.</p></div><span class="pill violet">Risk pricing</span></div><div class="grid three">${protocols.map((x,i)=>`<div class="panel"><div class="markettop"><span class="category">${x.name}</span><span class="pill">${i===0?"Lower score":i===1?"Higher score":"Mid-range"}</span></div><div class="statvalue">${x.risk}/100</div><div class="statfoot">Illustrative risk index · not a measured rating</div><div style="margin-top:16px"><div class="probrow"><span class="muted">Potential loss severity</span><strong>${x.loss}/100</strong></div><div class="bar"><span style="width:${x.loss}%;background:var(--amber)"></span></div></div><div style="margin-top:13px"><div class="probrow"><span class="muted">Liquidity score</span><strong>${x.liq}/100</strong></div><div class="bar"><span style="width:${x.liq}%;background:var(--green)"></span></div></div></div>`).join("")}</div>${section("Compare your own risk assumptions","Move the sliders to see the difference between two hypothetical protocols.")}<div class="grid two"><section class="panel"><div class="field"><label for="riskA">Protocol A · assumed risk score: <strong id="riskALabel">${a}/100</strong></label><input type="range" id="riskA" min="0" max="100" value="${a}" oninput="state.riskA=this.value;document.getElementById('riskALabel').textContent=this.value+'/100';updateRisk()"></div><div class="field" style="margin-top:22px"><label for="riskB">Protocol B · assumed risk score: <strong id="riskBLabel">${b}/100</strong></label><input type="range" id="riskB" min="0" max="100" value="${b}" oninput="state.riskB=this.value;document.getElementById('riskBLabel').textContent=this.value+'/100';updateRisk()"></div><p class="muted" style="font-size:11px;margin-top:20px">These are user-defined assumptions, not market-implied probabilities or security assessments.</p></section><section class="panel" id="riskResult"><div class="category">ASSUMPTION DIFFERENCE</div><div class="outcome" id="riskGap">${gap} points</div><p class="muted" id="riskText">${gap>=25?"Material gap in the assumed risk scores. Investigate what drives the difference.":"Relatively narrow score gap under these assumptions. Check the individual risk dimensions."}</p><div class="notice">A score difference does not establish which protocol is safer. Compare methodology, evidence, exposure, loss given failure and liquidity.</div></section></div>${evidenceRail("Risk evidence & comparability")}`}
function updateRisk(){const a=Number(state.riskA),b=Number(state.riskB),g=Math.abs(a-b);document.getElementById("riskGap").textContent=g+" points";document.getElementById("riskText").textContent=g>=25?"Material gap in the assumed risk scores. Investigate what drives the difference.":"Relatively narrow score gap under these assumptions. Check the individual risk dimensions."}

function go(page) {
  const validPages = ["home", "app", "deep", "futarchy", "opportunity", "risk"];

  if (!validPages.includes(page)) return;

  state.page = page;
  const nextHash = "#/" + page;

  if (location.hash !== nextHash) {
    history.pushState({ page }, "", nextHash);
  }

  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render(){
  const pageTitles={home:"Overview",app:"Market explorer",deep:"Deep forecasts",futarchy:"Futarchy",opportunity:"Opportunity markets",risk:"Risk pricing"};
  document.title="Seer Six — "+(pageTitles[state.page]||"Markets for better decisions");
  document.getElementById("main").dataset.page=state.page;
  const focusedId = document.activeElement && document.activeElement.id === "marketSearch" ? "marketSearch" : null;
  const caret = focusedId ? document.activeElement.selectionStart : null;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
  const views={home:renderHome,app:renderApp,deep:renderDeep,futarchy:renderFutarchy,opportunity:renderOpportunity,risk:renderRisk};
  const interfaceItems=[["home","01","Overview"],["app","02","Market explorer"],["deep","03","Deep forecasts"],["futarchy","04","Futarchy"],["opportunity","05","Opportunities"],["risk","06","Risk pricing"]];
  const suiteNav=`<nav class="interface-nav" aria-label="All six Seer interfaces"><div class="interface-nav-heading"><span class="eyebrow">Seer / Six interfaces</span><span class="interface-nav-caption">Choose another interface</span></div><div class="interface-nav-links">${interfaceItems.map(([key,n,title])=>`<a class="interface-nav-link ${key===state.page?"current":""}" href="#/${key}" data-suite-page="${key}" ${key===state.page?'aria-current="page"':""}><span class="interface-nav-num">${n}</span><span class="interface-nav-title">${title}</span><span class="interface-nav-arrow" aria-hidden="true">↗</span></a>`).join("")}</div></nav>`;
  document.getElementById("main").innerHTML=views[state.page]()+suiteNav+`<footer class="foot"><span>SEER SIX / INTERFACE CONCEPT</span><span>${marketFeed.status==="live"?"Seer API market records · specialist scenarios remain illustrative":"Demo fallback until live market data is available"} · Not financial or governance advice</span></footer>`;
  if(focusedId){
    const next=document.getElementById(focusedId);
    if(next){next.focus();if(typeof caret==="number")next.setSelectionRange(caret,caret);}
  }
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("main").addEventListener("click",e=>{const b=e.target.closest("a[data-suite-page]");if(b){e.preventDefault();go(b.dataset.suitePage)}});
render();
loadLiveMarkets();

function toggleTheme(){const next=document.body.dataset.theme==="light"?"dark":"light";document.body.dataset.theme=next;const b=document.getElementById("themeToggle");if(b){b.innerHTML=next==="light"?"☾ <span>Dark</span>":"☼ <span>Light</span>";b.setAttribute("aria-label","Switch to "+(next==="light"?"dark":"light")+" theme");b.title="Switch to "+(next==="light"?"dark":"light")+" theme";}}

function syncRoute() {
  const page = location.hash.replace(/^#\/?/, "");
  const validPages = [
    "home", "app", "deep",
    "futarchy", "opportunity", "risk"
  ];

  state.page = validPages.includes(page) ? page : "home";
  render();
}

window.addEventListener("popstate", syncRoute);
window.addEventListener("hashchange", syncRoute);

syncRoute();

</script>
</body>
